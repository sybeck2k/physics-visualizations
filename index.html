<title>Physics Visualizations</title>
<style>
  :root{
    --bg:#06080d; --panel:#0b0f1a; --panel2:#0e1424; --line:#1b2436;
    --ink:#c9d4e3; --dim:#7c8aa0; --faint:#4a5568; --cyan:#38bdf8; --amber:#fbbf24;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--mono); overflow:hidden}
  #app{display:flex; flex-direction:column; height:100vh; width:100vw}
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap;
    padding:8px 14px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0a0e18,#070a12);
  }
  h1{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
    font-weight:600; margin:0 4px 0 0;
  }
  #tabs{display:flex; gap:6px; flex-wrap:wrap}
  #tabs button{
    font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:7px;
    padding:6px 11px; cursor:pointer; transition:.15s;
  }
  #tabs button:hover{color:var(--ink); border-color:#2b3550}
  #tabs button.on{color:#06202b; background:var(--cyan); border-color:var(--cyan); font-weight:600}
  #right{margin-left:auto; display:flex; align-items:center; gap:10px}
  #note{font-size:10.5px; color:var(--faint); max-width:38ch; text-align:right}
  .reopen{
    font-family:var(--mono); font-size:10px; color:var(--dim); background:transparent;
    border:1px solid var(--line); border-radius:6px; padding:4px 9px; cursor:pointer; white-space:nowrap;
  }
  .reopen:hover{color:var(--ink); border-color:var(--cyan)}
  #stage{position:relative; flex:1 1 auto; min-height:0}
  header.collapsed{display:none}
  #hShow{
    position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:6; display:none;
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--dim);
    background:rgba(10,14,24,.92); border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px;
    padding:2px 14px 3px; cursor:pointer;
  }
  #hShow:hover{color:var(--ink); border-color:var(--cyan)}
  body.hcol #hShow{display:block}
  #frame{position:absolute; inset:0; width:100%; height:100%; border:0; background:#04060b; display:block}
  #intro{
    position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    padding:20px; background:rgba(4,6,11,.84); backdrop-filter:blur(3px);
  }
  #intro[hidden]{display:none}
  #intro .card{
    max-width:456px; max-height:calc(100% - 28px); overflow:auto;
    background:linear-gradient(180deg,#0c1220,#0a0e18); border:1px solid #26324a;
    border-radius:13px; padding:20px 22px; box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  #intro .eyebrow{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); margin-bottom:15px;
  }
  #intro .block{margin:0 0 13px}
  #intro .lab{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
  #intro .lab.watch{color:var(--amber)}
  #intro .block p{margin:4px 0 0; font-size:12px; line-height:1.58; color:var(--ink)}
  #intro .go{
    margin-top:4px; width:100%; font-family:var(--mono); font-size:12px; font-weight:600;
    color:#06202b; background:var(--cyan); border:0; border-radius:8px; padding:9px; cursor:pointer;
  }
  #intro .go:hover{background:#5cc9fa}
  #intro .go:focus-visible{outline:2px solid #fff; outline-offset:2px}
  #intro .dismiss{margin-top:8px; text-align:center; font-size:10px; color:var(--faint)}
  @media (max-width:560px){ #right{width:100%; justify-content:flex-end} #note{max-width:none} }
</style>
<div id="app">
  <header>
    <h1>Physics&nbsp;visualizations</h1>
    <div id="tabs"></div>
    <div id="right">
      <div id="note"></div>
      <button id="iReopen" class="reopen" type="button">?&nbsp;what am I looking at</button>
      <button id="hHide" class="reopen" type="button" title="Collapse the top bar (H)">&#9652;&nbsp;hide bar</button>
    </div>
  </header>
  <div id="stage">
    <iframe id="frame" title="visualization"></iframe>
    <button id="hShow" type="button" title="Show the top bar (H)">&#9662;&nbsp;menu</button>
    <div id="intro" hidden>
      <div class="card">
        <div class="eyebrow" id="iName"></div>
        <div class="block"><span class="lab">The scene</span><p id="iScene"></p></div>
        <div class="block"><span class="lab watch">Watch for</span><p id="iWatch"></p></div>
        <div class="block"><span class="lab">Try</span><p id="iAct"></p></div>
        <button class="go" id="iClose" type="button">Got it &mdash; show me</button>
        <div class="dismiss">press Esc, or click outside this card</div>
      </div>
    </div>
  </div>
</div>
<script id="vizdata" type="application/json">
{"sonic-boom":"<title>Sonic Boom Propagation<\/title>\r\n<style>\r\n  /* Committed dark instrument-panel aesthetic: single visual world, painted explicitly. */\r\n  :root{\r\n    color-scheme:dark;\r\n    --bg:#06080d; --panel:#0b0f1a; --panel2:#0e1424; --line:#1b2436;\r\n    --ink:#c9d4e3; --dim:#7c8aa0; --faint:#4a5568;\r\n    --cyan:#38bdf8; --amber:#fbbf24; --green:#34d399; --red:#f87171; --violet:#a78bfa;\r\n    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,\"Liberation Mono\",monospace;\r\n    --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;\r\n  }\r\n  *{box-sizing:border-box}\r\n  html,body{margin:0;height:100%}\r\n  body{\r\n    background:var(--bg); color:var(--ink); font-family:var(--sans);\r\n    font-size:13px; line-height:1.5; overflow:hidden;\r\n  }\r\n  #app{display:flex; flex-direction:column; height:100vh; width:100vw}\r\n\r\n  header{\r\n    display:flex; align-items:center; gap:14px 18px; padding:10px 16px; flex-wrap:wrap;\r\n    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0a0e18,#070a12);\r\n    flex:0 0 auto;\r\n  }\r\n  header h1{\r\n    font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;\r\n    margin:0; color:#e6edf6;\r\n  }\r\n  header h1 span{color:var(--cyan)}\r\n  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}\r\n  .tabs button{\r\n    font-family:var(--mono); font-size:11px; letter-spacing:.06em;\r\n    color:var(--dim); background:var(--panel2); border:1px solid var(--line);\r\n    padding:7px 12px; border-radius:7px; cursor:pointer; transition:.15s;\r\n  }\r\n  .tabs button:hover{color:var(--ink); border-color:#2b3550}\r\n  .tabs button.on{color:#06202b; background:var(--cyan); border-color:var(--cyan); font-weight:600}\r\n\r\n  main{flex:1 1 auto; display:grid; grid-template-columns:250px 1fr; min-height:0}\r\n\r\n  aside{\r\n    border-right:1px solid var(--line); background:var(--panel);\r\n    padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;\r\n  }\r\n  .grp{display:flex; flex-direction:column; gap:9px}\r\n  .grp h2{\r\n    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;\r\n    color:var(--faint); margin:0 0 2px; border-bottom:1px solid var(--line); padding-bottom:6px;\r\n  }\r\n  .row{display:flex; align-items:center; gap:8px}\r\n  .btns{display:flex; gap:6px}\r\n  .btns button{\r\n    flex:1; font-family:var(--mono); font-size:11px; color:var(--ink);\r\n    background:var(--panel2); border:1px solid var(--line); border-radius:6px;\r\n    padding:8px 4px; cursor:pointer; transition:.15s;\r\n  }\r\n  .btns button:hover{border-color:var(--cyan); color:#fff}\r\n  .btns button.play{background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.4)}\r\n  label.fld{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim)}\r\n  label.fld .v{color:var(--ink); font-family:var(--mono); font-size:11px}\r\n  input[type=range]{width:100%; accent-color:var(--cyan); cursor:pointer}\r\n  label.chk{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); cursor:pointer}\r\n  label.chk input{accent-color:var(--cyan); cursor:pointer}\r\n\r\n  #stagewrap{position:relative; min-width:0; display:flex; flex-direction:column}\r\n  #stage{position:relative; flex:1 1 auto; min-height:0; background:#04060b}\r\n  #stage canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  #inset3d{\r\n    position:absolute; top:12px; right:10px; width:272px; height:190px;\r\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.96);\r\n    backdrop-filter:blur(3px); z-index:3;\r\n  }\r\n  #inset3d canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  #inset3d .cap{\r\n    position:absolute; left:9px; top:7px; font-family:var(--mono); font-size:9px;\r\n    letter-spacing:.12em; text-transform:uppercase; color:var(--faint); z-index:1;\r\n  }\r\n  #readouts{\r\n    position:absolute; top:206px; right:10px; bottom:8px; width:306px; z-index:3;\r\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.97);\r\n    backdrop-filter:blur(3px); padding:9px 12px; font-family:var(--mono);\r\n    overflow-y:auto;\r\n  }\r\n  #readouts h3{\r\n    font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);\r\n    margin:0 0 6px;\r\n  }\r\n  #readouts dl{display:grid; grid-template-columns:1fr auto; gap:2px 10px; margin:0; font-size:10.5px}\r\n  #readouts dt{color:var(--dim); white-space:nowrap}\r\n  #readouts dt[title]{cursor:help; text-decoration:underline dotted var(--faint); text-underline-offset:2px}\r\n  #readouts dd{margin:0; text-align:right; color:var(--ink)}\r\n  #readouts dd.hi{color:var(--amber)}\r\n  #readouts dd.warn{color:var(--red)}\r\n  #readouts dd.ok{color:var(--green)}\r\n  #readouts .sep{grid-column:1/-1; height:1px; background:var(--line); margin:5px 0}\r\n\r\n  #plots{\r\n    flex:0 0 168px; display:grid; grid-template-columns:1fr 1fr; gap:1px;\r\n    background:var(--line); border-top:1px solid var(--line);\r\n  }\r\n  .plot{position:relative; background:#070a12}\r\n  .plot canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  .plot .cap{\r\n    position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:9px;\r\n    letter-spacing:.13em; text-transform:uppercase; color:var(--faint); z-index:1;\r\n  }\r\n\r\n  #explain{\r\n    flex:0 0 auto; max-height:clamp(180px,26vh,300px); overflow-y:auto; border-top:1px solid var(--line);\r\n    background:var(--panel); padding:11px 16px 13px; display:grid;\r\n    grid-template-columns:repeat(5,1fr); gap:12px;\r\n  }\r\n  #explain .ex{\r\n    border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 12px;\r\n    max-height:clamp(164px,24vh,280px); overflow-y:auto;\r\n  }\r\n  #explain .ex::-webkit-scrollbar{width:5px}\r\n  #explain .ex::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}\r\n  #explain h4{\r\n    margin:0 0 5px; font-family:var(--mono); font-size:10px;\r\n    letter-spacing:.1em; text-transform:uppercase; color:var(--cyan);\r\n  }\r\n  #explain p{margin:5px 0 0; color:var(--dim); font-size:11.5px}\r\n  #explain p.cav{margin-top:6px; color:var(--faint); font-size:10px; font-style:italic; line-height:1.45}\r\n  #explain b{color:var(--ink); font-weight:600}\r\n  #explain code{font-family:var(--mono); color:var(--amber); font-size:11px}\r\n  .hint{font-size:10.5px; color:var(--faint); margin-top:4px}\r\n  @media (max-width:1400px){ #explain{grid-template-columns:repeat(3,1fr); max-height:34vh} }\r\n  @media (max-width:820px){ #explain{grid-template-columns:1fr 1fr; max-height:40vh} }\r\n<\/style>\r\n\r\n<div id=\"app\">\r\n  <header>\r\n    <h1>Sonic&nbsp;<span>Boom<\/span>&nbsp;Propagation<\/h1>\r\n    <div class=\"tabs\" id=\"tabs\">\r\n      <button data-s=\"accel\" class=\"on\">1 · Accelerating<\/button>\r\n      <button data-s=\"cruise\">2 · Supersonic cruise<\/button>\r\n      <button data-s=\"booster\">3 · Falcon&nbsp;9 booster<\/button>\r\n      <button data-s=\"lowboom\">4 · Low‑boom X‑59<\/button>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <main>\r\n    <aside>\r\n      <div class=\"grp\">\r\n        <h2>Simulation<\/h2>\r\n        <div class=\"btns\">\r\n          <button id=\"playBtn\" class=\"play\">▶ Play<\/button>\r\n          <button id=\"restartBtn\">↻ Restart<\/button>\r\n        <\/div>\r\n        <label class=\"fld\">Time rate <span class=\"v\" id=\"rateV\">1.0×<\/span>\r\n          <input type=\"range\" id=\"rate\" min=\"0.15\" max=\"5\" step=\"0.05\" value=\"1\">\r\n        <\/label>\r\n        <label class=\"fld\">Timeline <span class=\"v\" id=\"progV\">0.0 s<\/span>\r\n          <input type=\"range\" id=\"prog\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\">\r\n        <\/label>\r\n      <\/div>\r\n\r\n      <div class=\"grp\" data-scen=\"accel cruise lowboom\">\r\n        <h2>Aircraft<\/h2>\r\n        <label class=\"fld\" data-scen=\"cruise lowboom\">Mach number <span class=\"v\" id=\"machV\">1.80<\/span>\r\n          <input type=\"range\" id=\"mach\" min=\"0.6\" max=\"3\" step=\"0.01\" value=\"1.8\">\r\n        <\/label>\r\n        <label class=\"fld\" data-scen=\"accel cruise lowboom\">Altitude <span class=\"v\" id=\"altV\">12.0 km<\/span>\r\n          <input type=\"range\" id=\"alt\" min=\"6000\" max=\"20000\" step=\"100\" value=\"12000\">\r\n        <\/label>\r\n        <label class=\"fld\" data-scen=\"accel\">Final Mach <span class=\"v\" id=\"mendV\">2.20<\/span>\r\n          <input type=\"range\" id=\"mend\" min=\"1.2\" max=\"3\" step=\"0.01\" value=\"2.2\">\r\n        <\/label>\r\n        <label class=\"fld\" data-scen=\"accel\">Acceleration <span class=\"v\" id=\"accV\">1.0×<\/span>\r\n          <input type=\"range\" id=\"acc\" min=\"0.5\" max=\"2.2\" step=\"0.05\" value=\"1\">\r\n        <\/label>\r\n        <label class=\"fld\">Effective length <span class=\"v\" id=\"lenV\">60 m<\/span>\r\n          <input type=\"range\" id=\"len\" min=\"15\" max=\"90\" step=\"1\" value=\"60\">\r\n        <\/label>\r\n      <\/div>\r\n\r\n      <div class=\"grp\" data-scen=\"booster\">\r\n        <h2>Booster entry<\/h2>\r\n        <label class=\"fld\">Entry Mach <span class=\"v\" id=\"bmV\">6.0<\/span>\r\n          <input type=\"range\" id=\"bm\" min=\"3\" max=\"8\" step=\"0.1\" value=\"6\">\r\n        <\/label>\r\n        <label class=\"fld\">Descent rate <span class=\"v\" id=\"bdV\">1.0×<\/span>\r\n          <input type=\"range\" id=\"bd\" min=\"0.5\" max=\"2\" step=\"0.05\" value=\"1\">\r\n        <\/label>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>View<\/h2>\r\n        <div class=\"btns\">\r\n          <button id=\"panL\">◂ Pan<\/button>\r\n          <button id=\"panR\">Pan ▸<\/button>\r\n          <button id=\"recenter\">⊙ Center<\/button>\r\n        <\/div>\r\n        <div class=\"hint\">Drag the sky to pan the camera · double‑click to recenter.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Observer<\/h2>\r\n        <label class=\"fld\">Lateral offset from track <span class=\"v\" id=\"latV\">0.0 km<\/span>\r\n          <input type=\"range\" id=\"lat\" min=\"-60\" max=\"60\" step=\"0.5\" value=\"0\">\r\n        <\/label>\r\n        <div class=\"hint\">Drag the green marker along the ground to move it downrange. In the booster\r\n        case it starts at the landing pad, where the boom arrives within seconds of touchdown.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Overlays<\/h2>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oWf\" checked> Spherical wavefronts<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oCone\" checked> Analytic Mach cone<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oCarpet\" checked> Boom carpet / sweep<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oAtm\" checked> Atmosphere layers<\/label>\r\n      <\/div>\r\n    <\/aside>\r\n\r\n    <div id=\"stagewrap\">\r\n      <div id=\"stage\">\r\n        <canvas id=\"main2d\"><\/canvas>\r\n        <div id=\"inset3d\">\r\n          <span class=\"cap\">3D · Mach cone &amp; carpet (schematic)<\/span>\r\n          <canvas id=\"c3d\"><\/canvas>\r\n        <\/div>\r\n        <div id=\"readouts\">\r\n          <h3>Live readout<\/h3>\r\n          <dl id=\"rdl\"><\/dl>\r\n        <\/div>\r\n      <\/div>\r\n      <div id=\"plots\">\r\n        <div class=\"plot\">\r\n          <span class=\"cap\">Observer N‑wave<\/span>\r\n          <canvas id=\"cNwave\"><\/canvas>\r\n        <\/div>\r\n        <div class=\"plot\">\r\n          <span class=\"cap\">Δp vs distance — this boom, at different ranges<\/span>\r\n          <canvas id=\"cAtten\"><\/canvas>\r\n        <\/div>\r\n      <\/div>\r\n    <\/div>\r\n  <\/main>\r\n\r\n  <section id=\"explain\">\r\n    <div class=\"ex\">\r\n      <h4>Wavefronts &amp; the cone<\/h4>\r\n      <p>Every instant the vehicle radiates a <b>pressure pulse<\/b> that grows as a sphere at the\r\n      local sound speed <code>a<\/code>. Because the source keeps moving, successive pulses sit\r\n      <b>off‑centre<\/b> — packed ahead (Doppler), stretched behind.<\/p>\r\n      <p>At <code>M=1<\/code> the pulses stack up at the nose; above it their common tangent is the\r\n      <b>Mach cone<\/b>, half‑angle <code>μ = arcsin(1/M)<\/code> — faster ⇒ narrower. The many small\r\n      shocks a real airframe makes only <i>merge<\/i> into one N‑wave after kilometres of travel.<\/p>\r\n      <p data-scen=\"accel\">Here <code>M<\/code> keeps rising, so the cone <b>narrows as you watch<\/b>. Starting\r\n      from <code>M≈0.7<\/code> the pulses bunch at the nose as it nears <code>M=1<\/code> — the “sound barrier” —\r\n      and the cone then trails behind for as long as it stays supersonic.<\/p>\r\n      <p data-scen=\"cruise\">Here <code>M<\/code> is held fixed, so the cone angle <b>never changes<\/b> and the boom\r\n      sweeps a continuous strip along the ground — not a one‑off bang at Mach 1. Drag the Mach slider\r\n      and the whole cone re‑shapes.<\/p>\r\n      <p data-scen=\"lowboom\">The cone is the <b>same geometry<\/b> as ordinary cruise at this Mach — shaping the\r\n      airframe does not change <code>μ<\/code>, only what the shocks are <i>made of<\/i> (see the next cards).<\/p>\r\n      <p data-scen=\"booster\">There is <b>no steady cone<\/b> here. The booster falls tail‑first and slows as the air\r\n      thickens, so <code>μ<\/code> <b>widens<\/b> down the descent and the cone disappears altogether once the\r\n      stage is no longer supersonic.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>What the observer hears<\/h4>\r\n      <p data-scen=\"accel cruise\">Nothing until the cone sweeps past — then pressure jumps to <b>+Δp<\/b>, ramps through\r\n      ambient to <b>−Δp<\/b>, and snaps back: the <b>N‑wave<\/b>. Its two shocks are a <b>double\r\n      boom<\/b> once they're &gt;~100 ms apart, a single <b>crack<\/b> when closer.<\/p>\r\n      <p data-scen=\"lowboom\">Nothing until the cone sweeps past — then, instead of a sharp N, a <b>soft thump<\/b>: a\r\n      shaped airframe spreads its shocks so they don't pile into one jump. Watch the dashed\r\n      “conventional” curve — the same airframe unshaped — for the crack it avoids.<\/p>\r\n      <p data-scen=\"booster\">A Falcon 9 booster returns tail‑first as a blunt, finned body: a base shock, a middle shock\r\n      (grid‑fin compression meeting a landing‑leg expansion), and a shock off the top — a <b>triple\r\n      boom<\/b> under ~1 s, arriving within seconds of touchdown.<\/p>\r\n      <p data-scen=\"accel\">An accelerating vehicle can also make a <b>U‑wave<\/b>: where successive cones converge\r\n      the observer gets a focused, sharper‑peaked boom — the loudest spot, marked on the stage.<\/p>\r\n      <p data-scen=\"accel cruise lowboom\">Off to the side, Δp fades to zero at the edge of the <b>boom carpet<\/b>\r\n      (half‑width ≈ <code>2.6 × altitude<\/code>). Beyond it: silence.<\/p>\r\n      <p data-scen=\"booster\">Off to the side, Δp fades quickly with distance from the pad, and beyond the\r\n      <b>boom carpet<\/b> (half‑width ≈ <code>2.6 × altitude<\/code>) there is silence.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>Intensity &amp; strength<\/h4>\r\n      <p>Ground Δp grows with the vehicle's <b>weight and cross‑section<\/b>, weakly with Mach, and\r\n      drops with altitude as <code>√(p_source·p_ground)<\/code>.<\/p>\r\n      <p data-scen=\"accel\">A turn or hard acceleration <b>focuses<\/b> the cone into a <b>U‑wave<\/b> 2–5× stronger than\r\n      steady flight — that is the peak the stage predicts before the run plays out. Concorde in\r\n      cruise ≈ <b>2 psf<\/b> for comparison.<\/p>\r\n      <p data-scen=\"cruise\">Concorde in cruise made ≈ <b>2 psf<\/b> (~100 Pa) under its track. Raise the altitude and\r\n      Δp falls; stretch the vehicle length and it rises.<\/p>\r\n      <p data-scen=\"lowboom\">Loudness is really set by the <b>equivalent‑area distribution<\/b> — how gradually lift and\r\n      volume build along the body. A long, slender, shaped nose (NASA's <b>X‑59<\/b>) keeps the shocks\r\n      separate: a <b>0.3 psf, 75 PLdB thump<\/b> vs Concorde's ~105 PLdB. Push past <code>M≈1.4<\/code> and\r\n      the shaping fades.<\/p>\r\n      <p data-scen=\"booster\">An F9 booster ≈ <b>2–7 psf<\/b> near the pad. It\r\n      arrives as a short, blunt triple boom close to touchdown. Entry Mach sets the strength aloft; what\r\n      reaches the ground is capped by cut‑off.<\/p>\r\n      <p class=\"cav\" data-scen=\"accel cruise\">Sim caveat: Mach &gt; 1.4 is a teaching device. Treat every figure as an\r\n      engineering estimate, ±~2×.<\/p>\r\n      <p class=\"cav\" data-scen=\"lowboom\">Sim caveats: the X‑59 thump shape is stylised (not CFD); its dashed “conventional”\r\n      curve is this same airframe unshaped, not Concorde; Mach &gt; 1.4 here is a teaching device. Treat\r\n      every figure as an engineering estimate, ±~2×.<\/p>\r\n      <p class=\"cav\" data-scen=\"booster\">Sim caveats: the booster's Mach‑vs‑altitude profile is scripted, not a trajectory solve,\r\n      and its triple‑boom shape is stylised. Treat every figure as an engineering estimate, ±~2×.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>Attenuation with distance<\/h4>\r\n      <p>As it travels the N‑wave <b>ages<\/b>: <b>cylindrical spreading<\/b> (<code>r^−½<\/code> — the\r\n      cone is a line source, not a point) plus <b>nonlinear steepening loss<\/b> (<code>r^−¼<\/code>)\r\n      give <code>Δp ∝ r^−¾<\/code>, while the <b>duration grows<\/b> as <code>r^¼<\/code>. Absorption\r\n      also thickens the shock rise from ~1 ms to tens of ms — a crack becomes a rumble.<\/p>\r\n      <p data-scen=\"accel cruise lowboom\">A shock only reaches the ground while its <b>horizontal trace speed<\/b> stays above the\r\n      local sound speed all the way down. In level flight the cone is steady, so it does — the boom keeps\r\n      arriving for as long as you fly. (Real <b>Mach cut‑off<\/b> for level flight sits near <code>M≈1.15<\/code> in\r\n      the stratosphere; only the booster tab models it.)<\/p>\r\n      <p data-scen=\"booster\">A shock only reaches the ground while its <b>horizontal trace speed<\/b> stays above the\r\n      local sound speed all the way down. Once the source is slower than <b>sea‑level<\/b> sound it\r\n      refracts upward — <b>Mach cut‑off<\/b> — which is why a decelerating booster falls quiet near\r\n      landing. Wind and turbulence shift where this happens.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>Reading the units<\/h4>\r\n      <p><b>Δp — pascals (Pa) or lb/ft² (psf).<\/b> The boom's <b>pressure<\/b> jump above still air\r\n      (~101 000 Pa). <code>1 psf ≈ 48 Pa<\/code>. ~50 Pa (1 psf) is a distant thud, ~100 Pa (2 psf)\r\n      rattles windows, &gt;~500 Pa (10 psf) can crack glass.<\/p>\r\n      <p><b>PLdB — perceived level, decibels.<\/b> How <b>loud and startling<\/b> it seems, not the raw\r\n      pressure. Logarithmic: <code>+10 ≈ twice as loud<\/code>. ~75 far rumble · ~95 loud boom · ~110\r\n      sharp crack.<\/p>\r\n      <p><b>T_N and rise — milliseconds.<\/b> The N‑wave's length and how fast the shock jumps. A\r\n      ~1 ms rise is a knife‑edge crack; tens of ms is a soft thud — same Δp, ~10–20 PLdB apart.<\/p>\r\n    <\/div>\r\n  <\/section>\r\n<\/div>\r\n\r\n<script>\r\n\"use strict\";\r\n/* ============================================================ constants */\r\nconst GAMMA=1.4, RSPEC=287.05, G0=9.80665, MAIR=0.0289644, RSTAR=8.3144598;\r\nconst P0=101325, T0K=288.15;\r\nconst A0=Math.sqrt(GAMMA*RSPEC*T0K);          // sea-level sound speed ~340.3 m/s\r\nconst KR=1.9, KCAL=0.117, CT=1.0;             // boom scaling: KR ground reflection, KCAL fit to Concorde ≈ 100 Pa\r\nconst PA_PER_PSF=47.880259;\r\n\r\n/* US Standard Atmosphere 1976 (geopotential km, base T, lapse K/km) */\r\nconst LAYERS=[\r\n  {h:0,     T:288.15, L:-6.5},\r\n  {h:11000, T:216.65, L:0},\r\n  {h:20000, T:216.65, L:1.0},\r\n  {h:32000, T:228.65, L:2.8},\r\n  {h:47000, T:270.65, L:0},\r\n  {h:51000, T:270.65, L:-2.8},\r\n  {h:71000, T:214.65, L:-2.0},\r\n];\r\n// precompute base pressures\r\n(function(){\r\n  LAYERS[0].P=P0;\r\n  for(let i=1;i<LAYERS.length;i++){\r\n    const b=LAYERS[i-1], dh=LAYERS[i].h-b.h;\r\n    if(Math.abs(b.L)<1e-9){\r\n      LAYERS[i].P=b.P*Math.exp(-G0*MAIR*dh/(RSTAR*b.T));\r\n    }else{\r\n      const Ltop=b.T+b.L*dh/1000;\r\n      LAYERS[i].P=b.P*Math.pow(Ltop/b.T, -G0*MAIR/(RSTAR*b.L/1000));\r\n    }\r\n  }\r\n})();\r\nfunction atmo(z){\r\n  z=Math.max(0,Math.min(z,84000));\r\n  let i=0; while(i<LAYERS.length-1 && z>=LAYERS[i+1].h) i++;\r\n  const b=LAYERS[i], dh=z-b.h, L=b.L/1000;\r\n  const T=b.T+L*dh;\r\n  let P;\r\n  if(Math.abs(L)<1e-12) P=b.P*Math.exp(-G0*MAIR*dh/(RSTAR*b.T));\r\n  else P=b.P*Math.pow(T/b.T, -G0*MAIR/(RSTAR*L));\r\n  const rho=P*MAIR/(RSTAR*T);\r\n  return {T, P, rho, a:Math.sqrt(GAMMA*RSPEC*T)};\r\n}\r\nconst soundSpeed=z=>atmo(z).a;\r\nconst pressureAt=z=>atmo(z).P;\r\n\r\n/* ============================================================ helpers */\r\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\r\nconst lerp=(a,b,t)=>a+(b-a)*t;\r\nconst smooth=t=>t*t*t*(t*(t*6-15)+10);\r\nfunction keyf(pairs,x){\r\n  if(x<=pairs[0][0])return pairs[0][1];\r\n  for(let i=1;i<pairs.length;i++){\r\n    if(x<=pairs[i][0]){\r\n      const[x0,y0]=pairs[i-1],[x1,y1]=pairs[i];\r\n      return lerp(y0,y1,(x-x0)/(x1-x0));\r\n    }\r\n  }\r\n  return pairs[pairs.length-1][1];\r\n}\r\nfunction rot(x,y,ang){const c=Math.cos(ang),s=Math.sin(ang);return[x*c-y*s,x*s+y*c];}\r\n\r\n// ground overpressure directly beneath the source (no focus, no lateral carpet falloff) —\r\n// shared by the live physics and the peak-impact predictor so the two can't drift apart\r\nfunction nominalDp(hGen, mGen, len){\r\n  const mr = clamp((mGen-1)/0.4, 0.06, 1);                       // weak shocks near M=1\r\n  return KCAL*KR*Math.sqrt(pressureAt(hGen)*P0)\r\n       * Math.pow(Math.max(mGen*mGen-1,1e-4),0.125)\r\n       * Math.pow(len/hGen,0.75) * mr;\r\n}\r\nconst plFrom=(dp,riseMs)=>clamp(100 + 20*Math.log10(Math.max(dp,1e-3)/50) - 8*Math.log10(riseMs/2), 40, 135);\r\n\r\n/* ============================================================ scenarios */\r\nconst SCEN={\r\n  accel:{\r\n    name:'Accelerating', camFrac:0.40, runLen:15, mStart:0.72,\r\n  },\r\n  cruise:{\r\n    name:'Supersonic cruise', camFrac:0.40,\r\n  },\r\n  lowboom:{\r\n    name:'Low-boom (X-59)', camFrac:0.40,   // level flight; the ground signature is what differs\r\n  },\r\n  booster:{\r\n    name:'Falcon 9 booster', runLen:30, padX:0,\r\n    // altitude vs. normalised descent progress — lingers low so the terminal burn is slow\r\n    altKf:[[0,70000],[0.10,56000],[0.25,40000],[0.42,24000],[0.55,14000],[0.66,8000],[0.75,3600],[0.88,1000],[1,0]],\r\n    // downrange vs. progress — flies back from ~13 km downrange to the pad at x=0\r\n    downKf:[[0,13000],[0.35,7000],[0.62,3000],[0.85,600],[1,0]],\r\n  },\r\n};\r\n\r\n/* ============================================================ state */\r\nconst S={\r\n  scen:'accel', playing:false, t:0, rate:1,\r\n  // controls\r\n  mach:1.8, alt:12000, mend:2.2, acc:1, len:60, bm:6, bd:1, lat:0,\r\n  ov:{wf:true,cone:true,carpet:true,atm:true},\r\n  // vehicle\r\n  v:{x:0,y:12000,vx:0,vy:0,spd:0,a:A0,M:0,mu:Math.PI/2,hGen:12000},\r\n  wf:[], lastEmit:-1,\r\n  obs:{x:0},          // world x of observer on ground\r\n  pan:0,             // user camera pan offset, metres\r\n  focus:{x:null,xMin:Infinity,tMin:0,locked:false},\r\n  res:null,           // computed observer result\r\n};\r\n\r\n// length of the \"active\" phase (acceleration / descent); cruise has no fixed phase\r\nfunction runLen(){\r\n  if(S.scen==='booster') return SCEN.booster.runLen/S.bd;\r\n  if(S.scen==='accel')   return SCEN.accel.runLen/S.acc;\r\n  return 0;\r\n}\r\n\r\n// altitude below which a descending booster's speed drops under the sea-level\r\n// sound speed — shocks made lower than this refract upward and never reach the ground\r\nfunction boosterCutoffAlt(){\r\n  for(let z=1200; z<52000; z+=200){ if(machForBoosterAlt(z)*soundSpeed(z) >= A0) return z; }\r\n  return 4000;\r\n}\r\n\r\n// total meaningful timeline: active phase + however long the boom needs to\r\n// propagate to the observer + a margin to watch the N-wave pass\r\nfunction simDuration(){\r\n  if(S.scen==='booster'){\r\n    const zc=boosterCutoffAlt();\r\n    const d=Math.abs(S.obs.x - SCEN.booster.padX);\r\n    const prop=Math.hypot(d,zc,S.lat*1000)/320;\r\n    return runLen() + Math.max(prop+10, 16);\r\n  }\r\n  const h=S.alt, cross=Math.hypot(h,S.lat*1000), af=soundSpeed(h);\r\n  const Mf = S.scen==='accel' ? S.mend : S.mach;\r\n  const base = S.scen==='accel' ? runLen() : 0;\r\n  if(Mf<=1.03) return base + 46;                 // subsonic: just watch the wavefronts\r\n  const vf=Mf*af, lag=cross*Math.sqrt(Mf*Mf-1);      // ground boom trails the aircraft by `lag`\r\n  let xActive=0, tActive=0;\r\n  if(S.scen==='accel'){ tActive=runLen(); xActive=0.5*(SCEN.accel.mStart+Mf)*af*tActive; }\r\n  // the steady Mach cone reaches the observer after this...\r\n  const tCone=tActive + Math.max(0,(S.obs.x + lag - xActive)/vf);\r\n  // ...but the FIRST real wavefront is the one emitted at the start point, which then has to\r\n  // expand across the full slant distance — the binding constraint when the vehicle is high\r\n  const tFirst=tActive + Math.hypot(S.obs.x-xActive,cross)/af;\r\n  return clamp(Math.max(tCone, tFirst) + 12, base+6, 300);\r\n}\r\n\r\n// Pre-compute, from the current parameters alone, WHERE the loudest boom lands on the ground\r\n// and how strong it is there — before the run has played out.\r\nfunction peakImpact(){\r\n  const L=S.len;\r\n  if(S.scen==='booster'){\r\n    let zB=6000, sB=-1;                                  // altitude of the strongest ground-reaching shock\r\n    for(let z=2000; z<42000; z+=400){\r\n      const M=machForBoosterAlt(z);\r\n      if(M*soundSpeed(z) <= A0) continue;\r\n      const s=pressureAt(z)*Math.pow(Math.max(M*M-1,1e-3),0.125)*clamp((M-1)/0.4,0.06,1);\r\n      if(s>sB){ sB=s; zB=z; }\r\n    }\r\n    const M=machForBoosterAlt(zB);\r\n    const dp=nominalDp(zB, M, L)*1.35*0.55;              // scenK · (slant + horizontal falloff to the pad)\r\n    return {x:SCEN.booster.padX, dp, psf:dp/PA_PER_PSF, PLdB:plFrom(dp,1.6),\r\n      where:`at the pad (shock born ~${(zB/1000).toFixed(0)} km up)`};\r\n  }\r\n  if(S.scen==='accel'){\r\n    const h=S.alt, af=soundSpeed(h), rl=runLen(), N=600;\r\n    let x=0, tp=0, xgMin=Infinity, mMin=1, xM1=0, gotM1=false;\r\n    for(let i=0;i<=N;i++){\r\n      const t=rl*i/N, p=clamp(t/rl,0,1);\r\n      const M=lerp(SCEN.accel.mStart,S.mend,smooth(p)), v=M*af;\r\n      if(i>0) x += v*(t-tp); tp=t;\r\n      if(!gotM1 && M>=1){ gotM1=true; xM1=x; }\r\n      if(M>1.02){ const xg=x - h*Math.sqrt(M*M-1); if(xg<xgMin){ xgMin=xg; mMin=M; } }\r\n    }\r\n    if(!gotM1 || !isFinite(xgMin)) return {x:null, dp:0, psf:0, PLdB:0, where:'— stays subsonic'};\r\n    // the cones that converge on the caustic are the weak transonic ones just past M=1\r\n    const mF=Math.min(1.2, S.mend), mr=clamp((mF-1)/0.4,0.06,1);\r\n    const r0=h/Math.max(Math.sin(Math.asin(1/mF)),1e-3);\r\n    const slant=Math.max(Math.sqrt((xgMin-xM1)**2 + h*h), r0);   // longer path back to the focal line\r\n    let dp=nominalDp(h,mF,L)*Math.pow(r0/slant,0.75);\r\n    dp=Math.min((dp/mr)*lerp(mr,1,0.25)*2.2, 430);              // caustic gain, capped ~9 psf\r\n    return {x:xgMin, dp, psf:dp/PA_PER_PSF, PLdB:plFrom(dp,2),\r\n      where:`focal line, ~${((xM1-xgMin)/1000).toFixed(0)} km behind the M1 crossing`};\r\n  }\r\n  // cruise / low-boom: the peak is the whole strip directly under the flight path\r\n  if(S.mach<=1.03) return {x:null, dp:0, psf:0, PLdB:0, where:'— subsonic, no boom'};\r\n  const shaped=S.scen==='lowboom', loss=clamp((S.mach-1.4)/0.5,0,1);\r\n  const sk=shaped?lerp(0.24,0.85,loss):1;\r\n  const dp=nominalDp(S.alt, S.mach, L)*sk;\r\n  let pl=plFrom(dp, shaped?lerp(25,3,loss):1.7);\r\n  if(shaped) pl=clamp(pl - 6*(1-loss), 40, 135);\r\n  return {x:null, dp, psf:dp/PA_PER_PSF, PLdB:pl,\r\n    where:shaped?'under the track (a soft thump)':'under the flight path (carpet centreline)'};\r\n}\r\n\r\n/* ---- reset ---- */\r\nfunction resetSim(keepObs){\r\n  S.t=0; S.wf.length=0; S.lastEmit=-1; S.playing=false; S.pan=0; S._holdBase=null; S._arrivedAt=null; S._heardG=null; S._obsUserMoved=false;\r\n  S.focus={x:null,xMin:Infinity,tMin:0,locked:false};\r\n  S.res=null;\r\n  const c=SCEN[S.scen];\r\n  if(S.scen==='booster'){\r\n    const z=keyf(c.altKf,0), x=keyf(c.downKf,0);\r\n    S.v={x,y:z,vx:0,vy:0,spd:0,a:soundSpeed(z),M:S.bm,mu:Math.asin(1/S.bm),hGen:z};\r\n    if(!keepObs) S.obs.x=SCEN.booster.padX;   // default observer sits at the landing pad\r\n  }else if(S.scen==='cruise'||S.scen==='lowboom'){\r\n    const h=S.alt, a=soundSpeed(h), spd=S.mach*a;\r\n    S.v={x:0,y:h,vx:spd,vy:0,spd,a,M:S.mach,mu:S.mach>1?Math.asin(1/S.mach):Math.PI/2,hGen:h};\r\n    if(!keepObs) S.obs.x=2000;\r\n  }else{\r\n    const h=S.alt, a=soundSpeed(h), spd=SCEN.accel.mStart*a;\r\n    S.v={x:0,y:h,vx:spd,vy:0,spd,a,M:SCEN.accel.mStart,mu:Math.PI/2,hGen:h};\r\n    if(!keepObs) S.obs.x=9000;\r\n  }\r\n  playBtn.textContent='▶ Play';\r\n  syncProg();\r\n  draw();\r\n}\r\n\r\n/* ============================================================ vehicle update */\r\nfunction machForBoosterAlt(z){\r\n  // scripted Mach(altitude): hypersonic aloft, aerodynamically decelerating, still\r\n  // supersonic down to ~4 km (light empty stage + grid fins), then the landing burn\r\n  if(z>=55000) return S.bm;\r\n  if(z>=13000) return 1.7 + (S.bm-1.7)*((z-13000)/42000);\r\n  if(z>=3500)  return 1.03 + 0.67*((z-3500)/9500);\r\n  if(z>=1200)  return 0.62 + 0.41*((z-1200)/2300);\r\n  return 0.04 + 0.58*(z/1200);\r\n}\r\nfunction stepVehicle(dt){\r\n  const c=SCEN[S.scen];\r\n  if(S.scen==='cruise'||S.scen==='lowboom'){\r\n    const h=S.alt, a=soundSpeed(h), spd=S.mach*a;\r\n    S.v.x+=spd*dt; S.v.y=h;\r\n    S.v.vx=spd; S.v.vy=0; S.v.spd=spd; S.v.a=a; S.v.M=S.mach;\r\n    S.v.mu=S.mach>1?Math.asin(1/S.mach):Math.PI/2; S.v.hGen=h;\r\n  }else if(S.scen==='accel'){\r\n    const h=S.alt, a=soundSpeed(h);\r\n    const p=clamp(S.t/runLen(),0,1);\r\n    const M=lerp(SCEN.accel.mStart, S.mend, smooth(p));\r\n    const spd=M*a;\r\n    S.v.x+=spd*dt; S.v.y=h;\r\n    S.v.vx=spd; S.v.vy=0; S.v.spd=spd; S.v.a=a; S.v.M=M;\r\n    S.v.mu=M>1.0001?Math.asin(1/M):Math.PI/2; S.v.hGen=h;\r\n    // focus / caustic tracking: ground trace point of the trailing cone\r\n    if(M>1.02){\r\n      const xg=S.v.x - h*Math.sqrt(M*M-1);\r\n      if(!S.focus.locked){\r\n        if(xg<S.focus.xMin){ S.focus.xMin=xg; S.focus.tMin=S.t; }\r\n        else if(xg>S.focus.xMin+400){\r\n          S.focus.locked=true; S.focus.x=S.focus.xMin;\r\n          if(!S._obsUserMoved){ S.obs.x=S.focus.x; S._arrivedAt=null; S._heardG=null; }  // park the observer on the superboom\r\n        }\r\n      }\r\n    }\r\n  }else{ // booster\r\n    const p=clamp(S.t/runLen(),0,1);\r\n    const z=keyf(c.altKf,p), x=keyf(c.downKf,p);\r\n    const dtp=1/Math.max(runLen()*60,1);\r\n    const z2=keyf(c.altKf,Math.min(p+dtp,1)), x2=keyf(c.downKf,Math.min(p+dtp,1));\r\n    const a=soundSpeed(z), M=machForBoosterAlt(z), spd=M*a;\r\n    const dl=Math.hypot(x2-x, z2-z)||1;\r\n    S.v.vx=spd*(x2-x)/dl; S.v.vy=spd*(z2-z)/dl;\r\n    S.v.x=x; S.v.y=z; S.v.spd=spd; S.v.a=a; S.v.M=M;\r\n    S.v.mu=M>1.0001?Math.asin(1/M):Math.PI/2; S.v.hGen=z;\r\n  }\r\n}\r\n\r\n/* ============================================================ wavefronts */\r\nconst DT_EMIT=0.22, WF_CAP=1300;\r\nfunction emit(){\r\n  if(S.t-S.lastEmit < DT_EMIT && S.lastEmit>=0) return;\r\n  S.lastEmit=S.t;\r\n  const boom = S.v.M>1 && (S.scen!=='booster' || S.v.spd>A0);\r\n  S.wf.push({x:S.v.x,y:S.v.y,t:S.t,a:S.v.a,M:S.v.M,spd:S.v.spd,mu:S.v.mu,boom});\r\n  if(S.wf.length>WF_CAP) S.wf.splice(0,S.wf.length-WF_CAP);\r\n}\r\n\r\n/* ============================================================ observer physics */\r\nfunction computeObserver(){\r\n  const O={x:S.obs.x,y:0};\r\n  const lat=S.lat*1000;\r\n  // scan boom wavefronts: `maxF` finds the first one to reach the observer (timing);\r\n  // `loudW` is the strongest one that has already arrived (sets Δp / character)\r\n  let maxF=-Infinity, sweepX=null, firstHitX=null, oldestBoomT=Infinity;\r\n  let loudW=null, loudS=-Infinity, tArrTrue=Infinity;\r\n  for(const w of S.wf){\r\n    if(!w.boom) continue;\r\n    const r=w.a*(S.t-w.t);\r\n    const d=Math.hypot(O.x-w.x, O.y-w.y, lat);\r\n    const f=r-d;\r\n    if(f>maxF) maxF=f;\r\n    const ta=w.t + d/w.a;                 // when THIS wavefront's sphere reaches the observer\r\n    if(ta<tArrTrue) tArrTrue=ta;\r\n    if(f>=0){\r\n      // shock-strength proxy: ambient pressure × Mach term × weak-shock roll-off near M=1\r\n      const s = pressureAt(Math.abs(w.y)) * Math.pow(Math.max(w.M*w.M-1,1e-3),0.125) * clamp((w.M-1)/0.4,0.06,1);\r\n      if(s>loudS){ loudS=s; loudW=w; }\r\n    }\r\n    if(r>=Math.hypot(w.y,lat)){\r\n      const dx=Math.sqrt(Math.max(0,r*r-w.y*w.y-lat*lat));\r\n      const cand = Math.abs((w.x+dx)-O.x) < Math.abs((w.x-dx)-O.x) ? w.x+dx : w.x-dx;\r\n      if(sweepX===null || Math.abs(cand-O.x) < Math.abs(sweepX-O.x)) sweepX=cand;\r\n      if(w.t<oldestBoomT){ oldestBoomT=w.t; firstHitX = (Math.abs(w.x+dx-O.x)<Math.abs(w.x-dx-O.x))?w.x+dx:w.x-dx; }\r\n    }\r\n  }\r\n  const arrived = maxF>=0;\r\n  const hasBoomWf = maxF>-Infinity;                 // a ground-reaching shock is in flight\r\n  const enRoute = !arrived && hasBoomWf;\r\n  // record the TRUE first-arrival time (not just \"when we noticed\"), so playing and\r\n  // scrubbing past the arrival give the same \"boom vs. touchdown\" and N-wave playhead\r\n  if(arrived && !S._arrivedAt) S._arrivedAt = Math.min(tArrTrue, S.t);\r\n  if(!arrived) { S._arrivedAt=null; S._heardG=null; }\r\n  // Let the heard boom build for a few seconds after first arrival (a caustic fills in from\r\n  // several cones), then LOCK its source so the signature settles instead of climbing forever.\r\n  // Moving the observer or rebuilding clears it (see rebuildTo / the drag handler).\r\n  if(arrived && loudW && (!S._heardG || S.t < S._arrivedAt + 2))\r\n    S._heardG = {a:loudW.a, M:loudW.M, spd:loudW.spd, mu:loudW.mu, y:loudW.y, x:loudW.x};\r\n\r\n  // Generating conditions = the locked source once arrived; before that, a signature is\r\n  // previewed only for STEADY flight (cruise / X-59), where the current vehicle state is a\r\n  // faithful stand-in. For the accelerating jet and the booster the source sweeps along the\r\n  // trajectory, so there is no single meaningful pre-arrival signature — show just the countdown.\r\n  const steady = S.scen==='cruise' || S.scen==='lowboom';\r\n  const g = arrived ? (S._heardG || loudW)\r\n          : (S.v.M>1 && steady) ? {a:S.v.a,M:S.v.M,spd:S.v.spd,mu:S.v.mu,y:S.v.hGen,x:S.v.x}\r\n          : null;\r\n\r\n  let R={scenName:SCEN[S.scen].name, M:S.v.M, spd:S.v.spd, a:S.v.a, mu:S.v.mu,\r\n         status:'', dp:0, psf:0, dpRaw:0, r:0, r0:0, hGen:S.v.hGen, mGen:S.v.M,\r\n         T_N:0, riseMs:0, PLdB:0, label:'—', dbl:false, triple:false, g1:0, g2:0,\r\n         shaped:false, dpConv:0, PLdBconv:0,\r\n         carpetHalf:0, lat:S.lat, inCarpet:true, cutoff:false,\r\n         countdown:null, passedAgo:null, sweepX, firstHitX, arrived};\r\n\r\n  // true Mach cut-off: nothing supersonic now AND no ground-reaching shock left aloft\r\n  const boosterCutoff = S.scen==='booster' && S.v.spd<=A0 && !arrived && !hasBoomWf && S.t>1;\r\n\r\n  if(!g && !arrived){\r\n    if(enRoute){\r\n      R.status='incoming';\r\n      R.countdown=Math.max(0,tArrTrue-S.t);\r\n      if(S.scen==='booster') R.enRouteAloft=true;   // boom generated higher up, still descending\r\n    }else if(boosterCutoff){\r\n      R.status='MACH CUT‑OFF — refracts upward'; R.cutoff=true;\r\n    }else{\r\n      R.status = S.scen==='booster' ? (S.v.M>0.98?'transonic':'subsonic — no boom')\r\n                                    : (S.v.M>0.98?'M ≈ 1 — shock forming':'subsonic — no boom');\r\n    }\r\n    return R;\r\n  }\r\n\r\n  const mu=g.mu, mGen=g.M, vGen=g.spd, hGen=Math.max(Math.abs(g.y),300);\r\n  const gx = (g.x!=null) ? g.x : ((arrived&&loudW)?loudW.x:S.v.x);   // where the heard boom was generated\r\n  const carpetHalf=2.64*hGen;\r\n  const inCarpet=Math.abs(lat)<=carpetHalf;\r\n  const cf = inCarpet ? Math.cos(0.5*Math.PI*lat/carpetHalf) : 0;\r\n  // Propagation path = straight-line slant from where the heard boom was generated to the\r\n  // observer. For a normal observer this equals the Mach-cone slant hGen/sin(μ); for the\r\n  // acceleration FOCUS the observer sits well behind that, so the path is longer and the\r\n  // boom is more attenuated by spreading before the caustic gain is applied on top.\r\n  let r0, r;\r\n  const dSlant = Math.sqrt((O.x-gx)**2 + hGen*hGen + lat*lat);\r\n  if(S.scen==='booster'){\r\n    r0 = hGen;\r\n    r  = dSlant;\r\n  }else{\r\n    r0 = hGen/Math.max(Math.sin(mu),1e-3);\r\n    r  = Math.max(dSlant, r0);          // never shorter than the natural cone slant\r\n  }\r\n  const machRoll = clamp((mGen-1)/0.4, 0.06, 1);          // shocks near M=1 are weak\r\n  // low-boom (X-59): airframe shaping keeps the shocks from coalescing into an N-wave.\r\n  // Effective only near its M1.4 design point; it degrades toward a normal boom above ~M1.6.\r\n  const shaped = S.scen==='lowboom';\r\n  const shapeLoss = shaped ? clamp((mGen-1.4)/0.5, 0, 1) : 0;   // 0 = full shaping, 1 = lost\r\n  // tuned so the M1.4 design point lands on NASA's published X-59 figures:\r\n  // ~0.3 psf peak, ~75 PLdB thump (vs ~105 PLdB for a conventional boom)\r\n  const scenK = S.scen==='booster' ? 1.35\r\n              : shaped ? lerp(0.24, 0.85, shapeLoss)\r\n              : 1;\r\n  // nominalDp() uses the GEOMETRIC MEAN of ambient pressure at source and ground (not the\r\n  // source pressure alone, which over-weights altitude); scenK is the per-scenario factor\r\n  const dpRaw = nominalDp(hGen, mGen, S.len) * scenK;\r\n  let dp = dpRaw*Math.pow(r0/r,0.75)*cf;\r\n  if(S.scen==='booster'){                                  // fall off with horizontal distance from the source\r\n    dp *= 1/(1+Math.pow(Math.abs(O.x-gx)/6000,1.6));\r\n  }\r\n  const dpConv = shaped ? dp/Math.max(scenK,1e-3) : dp;    // what a conventional airframe would make\r\n\r\n  // acceleration superboom: a caustic where successive weak Mach cones converge. The gain is\r\n  // ray-convergence, only loosely tied to how weak each shock is, so partly relax the near-M=1\r\n  // roll-off and stack the classic ~×2–5 on top.\r\n  if(S.scen==='accel' && S.focus.x!==null && Math.abs(O.x-S.focus.x)<1500){\r\n    const near = 1 - Math.abs(O.x-S.focus.x)/1500;          // 1 on the focal line, 0 at the edge\r\n    const dpPlain = dp;                                     // the plain N-wave this spot would get\r\n    dp = Math.min((dp/machRoll) * lerp(machRoll, 1, 0.25*near) * lerp(1, 2.2, near), 430);  // cap ~9 psf\r\n    R.focused = true;\r\n    R.focusMult = dp / Math.max(dpPlain, 1e-6);\r\n  }\r\n\r\n  // N-wave duration: near-field ~ L/a at the source, then it STRETCHES with propagation as the\r\n  // shocks age — ∝ r^(1/4), referenced to ~10 km (roughly where it has matured into an N-wave).\r\n  const T_N0 = CT*(S.len/Math.max(g.a,1));\r\n  const T_N = T_N0 * Math.pow(Math.max(r/15000, 1), 0.25);\r\n  // a sharp N-wave rises in ~1-3 ms; a shaped low-boom signature ramps up over tens of ms\r\n  const riseMs = shaped ? lerp(25, 3, shapeLoss) + 0.01*(r/1000)\r\n                        : 1.5 + 0.02*(r/1000);\r\n  const plOf = d => clamp(100 + 20*Math.log10(Math.max(d,1e-3)/50) - 8*Math.log10(riseMs/2), 40, 135);\r\n  // shaped signatures are quieter than an N-wave of equal peak Δp (energy sits at low\r\n  // frequency, spread over time) — a credit the simple rise-time term can't fully capture\r\n  const PLdB = shaped ? clamp(plOf(dp) - 6*(1-shapeLoss), 40, 135) : plOf(dp);\r\n  const PLdBconv = shaped ? clamp(100 + 20*Math.log10(Math.max(dpConv,1e-3)/50), 40, 135) : PLdB;\r\n  const label = shaped ? (PLdB>92?'firm thump (shaping degraded)':'gentle sonic thump')\r\n              : PLdB>108?'sharp crack':PLdB>96?'loud boom':PLdB>82?'muffled thud':'distant rumble';\r\n  // aircraft: one N-wave, its bow+tail heard as a \"double boom\" past ~100 ms.\r\n  // Falcon 9: a TRIPLE boom — base shock, a middle shock where a grid-fin compression\r\n  // merges with a landing-leg expansion, and a rear shock off the top of the booster.\r\n  const triple = S.scen==='booster';\r\n  // shock separation ≈ body length / sound speed → the whole triple spans ~0.12–0.18 s\r\n  const gBase  = clamp(0.5*S.len/Math.max(vGen,1), 0.03, 0.09);\r\n  const g1 = triple ? gBase       : 0;      // base → fins/legs\r\n  const g2 = triple ? gBase*1.1   : 0;      // fins/legs → top\r\n  const dbl = !shaped && (triple || (T_N*1000>100));\r\n\r\n  Object.assign(R,{\r\n    dp, psf:dp/PA_PER_PSF, dpRaw, r, r0, hGen, mGen, mu,\r\n    T_N, riseMs, PLdB, label, dbl, triple, g1, g2, carpetHalf, inCarpet, cutoff:false,\r\n    shaped, dpConv, PLdBconv,\r\n  });\r\n\r\n  if(boosterCutoff){ R.cutoff=true; R.status='MACH CUT‑OFF — refracts upward'; R.dp=0; R.psf=0; }\r\n  else if(!inCarpet){ R.status='outside boom carpet — silent'; R.dp=0; R.psf=0; }\r\n  else if(arrived){\r\n    R.status='BOOM'; R.passedAgo = S.t-(S._arrivedAt||S.t);\r\n  }else if(Number.isFinite(maxF)){\r\n    R.countdown = Math.max(0, tArrTrue-S.t);\r\n    R.status='incoming';\r\n  }else{\r\n    R.status = S.v.M>1 ? 'supersonic — cone hasn’t reached here yet' : 'subsonic — no boom';\r\n  }\r\n  return R;\r\n}\r\n\r\n/* ============================================================ canvases */\r\nconst main2d=document.getElementById('main2d'), g2=main2d.getContext('2d');\r\nconst c3d=document.getElementById('c3d'), g3=c3d.getContext('2d');\r\nconst cN=document.getElementById('cNwave'), gN=cN.getContext('2d');\r\nconst cA=document.getElementById('cAtten'), gA=cA.getContext('2d');\r\nlet DPR=1, W=0,H=0, W3=0,H3=0, WN=0,HN=0, WA=0,HA=0;\r\nfunction fit(cv,ctx){\r\n  DPR=Math.min(window.devicePixelRatio||1,2);\r\n  const r=cv.getBoundingClientRect();\r\n  cv.width=Math.max(1,Math.round(r.width*DPR));\r\n  cv.height=Math.max(1,Math.round(r.height*DPR));\r\n  ctx.setTransform(DPR,0,0,DPR,0,0);\r\n  return [r.width,r.height];\r\n}\r\nfunction resize(){\r\n  [W,H]=fit(main2d,g2);\r\n  [W3,H3]=fit(c3d,g3);\r\n  [WN,HN]=fit(cN,gN);\r\n  [WA,HA]=fit(cA,gA);\r\n  draw();\r\n}\r\nwindow.addEventListener('resize',resize);\r\n\r\n/* ---- world <-> screen for the 2D stage (isotropic so angles are true) ---- */\r\nlet cam={s:1,x0:0,vmax:20000};\r\nfunction curVmax(){\r\n  if(S.scen==='booster') return 46000;                    // booster enters from above the top edge\r\n  return clamp(S.alt*1.30, 13000, 24000);                 // accel + cruise\r\n}\r\nfunction updateCam(){\r\n  const c=SCEN[S.scen];\r\n  const marginTop=18, marginBot=46;\r\n  cam.vmax=curVmax();\r\n  cam.s=(H-marginTop-marginBot)/cam.vmax;                  // px per metre\r\n  const wpp=W/cam.s;                                       // world metres across the view\r\n  const R=S.res;\r\n  let base;\r\n  if(R && R.arrived){\r\n    // freeze the frame the moment the boom lands, so the wavefronts expand on screen\r\n    if(S._holdBase==null) S._holdBase = S.obs.x - 0.5*wpp;\r\n    base = S._holdBase;\r\n  }else if(S.scen==='booster'){\r\n    S._holdBase=null;\r\n    base = SCEN.booster.padX - 0.42*wpp;                   // frame the landing pad\r\n  }else{\r\n    S._holdBase=null;\r\n    const acX = S.v.x - c.camFrac*wpp;                     // follow the aircraft\r\n    if(R && R.sweepX!=null){\r\n      // glide toward the observer as the boom approaches, so the arrival is on screen\r\n      const k = clamp(1 - Math.abs(R.sweepX - S.obs.x)/(0.55*wpp), 0, 1);\r\n      base = lerp(acX, S.obs.x - 0.5*wpp, k);\r\n    }else base = acX;\r\n  }\r\n  cam.x0 = base + S.pan;\r\n  cam.yBase=H-marginBot;\r\n}\r\nconst sx=wx=>(wx-cam.x0)*cam.s;\r\nconst sy=wy=>cam.yBase-wy*cam.s;\r\n\r\n/* ============================================================ 2D DRAW */\r\nfunction draw(){\r\n  updateCam();\r\n  S._peak = peakImpact();          // predicted loudest ground spot + level (from current params)\r\n  const c=SCEN[S.scen];\r\n\r\n  // sky gradient\r\n  const grd=g2.createLinearGradient(0,0,0,H);\r\n  grd.addColorStop(0,'#0a1428'); grd.addColorStop(0.55,'#0a0f1c'); grd.addColorStop(1,'#05070d');\r\n  g2.fillStyle=grd; g2.fillRect(0,0,W,H);\r\n\r\n  // atmosphere layers\r\n  if(S.ov.atm){\r\n    const marks = cam.vmax>40000\r\n      ? [0,11000,20000,32000,47000,71000]\r\n      : [0,3000,6000,9000,12000,16000,20000];\r\n    g2.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');\r\n    for(const z of marks){\r\n      if(z>cam.vmax) continue;\r\n      const y=sy(z);\r\n      g2.strokeStyle='rgba(120,150,190,.10)'; g2.lineWidth=1;\r\n      g2.beginPath(); g2.moveTo(0,y); g2.lineTo(W,y); g2.stroke();\r\n      const A=atmo(z);\r\n      g2.fillStyle='rgba(150,170,200,.45)';\r\n      g2.fillText(`${(z/1000).toFixed(0)} km   T ${A.T.toFixed(0)} K   a ${A.a.toFixed(0)} m/s`, 8, y-4);\r\n    }\r\n    // named bands\r\n    g2.fillStyle='rgba(150,170,200,.28)';\r\n    if(cam.vmax>40000){\r\n      band('TROPOSPHERE',5000); band('STRATOSPHERE',30000); band('MESOSPHERE',75000);\r\n    }else{\r\n      band('TROPOSPHERE',3500); band('TROPOPAUSE',12500); band('STRATOSPHERE',19000);\r\n    }\r\n    function band(t,z){ if(z<cam.vmax) g2.fillText(t, W-138, sy(z)-2); }\r\n  }\r\n\r\n  // ground\r\n  const gy=sy(0);\r\n  g2.fillStyle='#070b12'; g2.fillRect(0,gy,W,H-gy);\r\n  g2.strokeStyle='rgba(120,150,190,.35)'; g2.lineWidth=1.5;\r\n  g2.beginPath(); g2.moveTo(0,gy); g2.lineTo(W,gy); g2.stroke();\r\n  // ground ticks (km) — coarser when the view is wide\r\n  g2.fillStyle='rgba(150,170,200,.35)'; g2.font='9px '+cssMono();\r\n  const stepKm = cam.vmax>40000 ? 20 : 5;\r\n  const x0km=Math.floor(cam.x0/1000/stepKm)*stepKm;\r\n  for(let k=x0km;k*1000<cam.x0+W/cam.s;k+=stepKm){\r\n    const X=sx(k*1000); if(X<-40||X>W) continue;\r\n    g2.beginPath(); g2.moveTo(X,gy); g2.lineTo(X,gy+7); g2.stroke();\r\n    g2.fillText(k+' km', X+3, gy+16);\r\n  }\r\n\r\n  const R=S.res;\r\n\r\n  // Mach cut-off (booster): where this scripted descent's speed drops below sea-level sound speed\r\n  if(S.scen==='booster'){\r\n    const zc=boosterCutoffAlt();\r\n    const y=sy(zc);\r\n    g2.strokeStyle='rgba(248,113,113,.35)'; g2.setLineDash([5,5]); g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(0,y); g2.lineTo(W,y); g2.stroke(); g2.setLineDash([]);\r\n    g2.fillStyle='rgba(248,113,113,.6)'; g2.font='9px '+cssMono();\r\n    g2.fillText('≈ Mach cut‑off — from here down the descent is slower than sea‑level sound, so shocks refract away (wind & trajectory move this level)', 8, y-4);\r\n    // booster still above the top of the view\r\n    if(sy(S.v.y) < 4){\r\n      const X=clamp(sx(S.v.x)-90, 8, W-190);\r\n      g2.fillStyle='rgba(232,238,247,.7)'; g2.font='10px '+cssMono();\r\n      g2.fillText(`▲ booster at ${(S.v.y/1000).toFixed(0)} km — descending into view`, X, 13);\r\n    }\r\n  }\r\n\r\n  // boom carpet already swept (ground shading)\r\n  if(S.ov.carpet && R && R.firstHitX!=null && R.sweepX!=null && !R.cutoff){\r\n    const xa=sx(Math.min(R.firstHitX,R.sweepX)), xb=sx(Math.max(R.firstHitX,R.sweepX));\r\n    const lg=g2.createLinearGradient(xa,0,xb,0);\r\n    lg.addColorStop(0,'rgba(251,191,36,.02)'); lg.addColorStop(1,'rgba(251,191,36,.14)');\r\n    g2.fillStyle=lg; g2.fillRect(xa,gy,xb-xa,5);\r\n  }\r\n\r\n  // spherical wavefronts\r\n  if(S.ov.wf){\r\n    for(const w of S.wf){\r\n      const r=w.a*(S.t-w.t)*cam.s;\r\n      if(r<1 || r>2.6*W) continue;                    // skip pinpoints and giant faint arcs\r\n      const cx=sx(w.x), cy=sy(w.y);\r\n      if(cx+r<-20||cx-r>W+20||cy-r>H+20) continue;\r\n      const fadeRef=clamp(S.scen==='booster'?32:S.scen==='cruise'?22:runLen()+6, 12, 34);\r\n      const age=(S.t-w.t)/fadeRef;\r\n      const al=clamp(0.55-0.42*age,0.04,0.55);\r\n      if(w.boom){ g2.strokeStyle=`rgba(251,191,36,${al*1.2})`; g2.lineWidth=1.6; }\r\n      else{ g2.strokeStyle=`rgba(56,189,248,${al*0.95})`; g2.lineWidth=1.1; }\r\n      g2.beginPath(); g2.arc(cx,cy,r,0,Math.PI*2); g2.stroke();\r\n    }\r\n  }\r\n\r\n  // analytic Mach cone (aircraft scenarios)\r\n  if(S.ov.cone && S.scen!=='booster' && S.v.M>1.01){\r\n    const un=Math.hypot(S.v.vx,S.v.vy)||1;\r\n    const bx=-S.v.vx/un, by=-S.v.vy/un;   // trailing (world) direction\r\n    const L=8000;                          // metres\r\n    g2.strokeStyle='rgba(251,191,36,.55)'; g2.lineWidth=1.4;\r\n    for(const sgn of [1,-1]){\r\n      const [dx,dy]=rot(bx,by,sgn*S.v.mu); // world-space ray direction\r\n      g2.setLineDash([7,6]);\r\n      g2.beginPath();\r\n      g2.moveTo(sx(S.v.x), sy(S.v.y));\r\n      g2.lineTo(sx(S.v.x+dx*L), sy(S.v.y+dy*L));\r\n      g2.stroke();\r\n      g2.setLineDash([]);\r\n    }\r\n    g2.fillStyle='rgba(251,191,36,.9)'; g2.font='11px '+cssMono();\r\n    g2.fillText(`μ = ${(S.v.mu*180/Math.PI).toFixed(1)}°`, sx(S.v.x)+14, sy(S.v.y)+34);\r\n  }\r\n\r\n  // \"sound barrier\" glow near M=1 (accel)\r\n  if(S.scen==='accel' && S.v.M>0.965 && S.v.M<1.035){\r\n    const P=[sx(S.v.x),sy(S.v.y)];\r\n    const rad=26+40*(1-Math.abs(S.v.M-1)/0.035);\r\n    const rg=g2.createRadialGradient(P[0],P[1],2,P[0],P[1],rad);\r\n    rg.addColorStop(0,'rgba(255,255,255,.5)'); rg.addColorStop(.4,'rgba(251,191,36,.35)'); rg.addColorStop(1,'rgba(251,191,36,0)');\r\n    g2.fillStyle=rg; g2.beginPath(); g2.arc(P[0],P[1],rad,0,Math.PI*2); g2.fill();\r\n    g2.fillStyle='rgba(255,255,255,.85)'; g2.font='10px '+cssMono();\r\n    g2.fillText('SOUND BARRIER — wavefronts stack up at the nose', P[0]+18, P[1]-16);\r\n  }\r\n\r\n  // predicted loudest-impact marker (dashed) — accel only, where the spot isn't obvious\r\n  if(S.scen==='accel' && S._peak && S._peak.x!=null && S.focus.x==null){\r\n    const X=sx(S._peak.x), Y=gy;\r\n    g2.strokeStyle='rgba(248,113,113,.5)'; g2.setLineDash([3,3]); g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(X-13,Y); g2.lineTo(X+13,Y); g2.moveTo(X,Y-13); g2.lineTo(X,Y-1); g2.stroke();\r\n    g2.setLineDash([]);\r\n    g2.fillStyle='rgba(248,113,113,.75)'; g2.font='9px '+cssMono();\r\n    g2.fillText(`predicted loudest spot · ≈ ${S._peak.psf.toFixed(1)} psf · ${S._peak.PLdB.toFixed(0)} PLdB`, X+14, Y-6);\r\n  }\r\n  // superboom focus marker (accel) — the real one, once the caustic has formed\r\n  if(S.scen==='accel' && S.focus.x!=null){\r\n    const X=sx(S.focus.x), Y=gy;\r\n    g2.strokeStyle='rgba(248,113,113,.9)'; g2.lineWidth=1.5;\r\n    for(let i=0;i<8;i++){\r\n      const a=i/8*Math.PI*2;\r\n      g2.beginPath(); g2.moveTo(X,Y); g2.lineTo(X+Math.cos(a)*11,Y+Math.sin(a)*11); g2.stroke();\r\n    }\r\n    g2.fillStyle='rgba(248,113,113,.95)'; g2.font='10px '+cssMono();\r\n    g2.fillText('SUPERBOOM / focus — a U‑wave, Δp ×2–5', X+14, Y-8);\r\n  }\r\n\r\n  // Mach cut-off indication (booster)\r\n  if(R && R.cutoff){\r\n    const P=[sx(S.v.x),sy(S.v.y)];\r\n    g2.strokeStyle='rgba(248,113,113,.7)'; g2.setLineDash([4,4]); g2.lineWidth=1.3;\r\n    for(const sgn of [1,-1]){\r\n      g2.beginPath(); g2.moveTo(P[0],P[1]);\r\n      g2.quadraticCurveTo(P[0]+sgn*90, P[1]-30, P[0]+sgn*150, P[1]-160);\r\n      g2.stroke();\r\n    }\r\n    g2.setLineDash([]);\r\n    g2.fillStyle='rgba(248,113,113,.95)'; g2.font='11px '+cssMono();\r\n    g2.fillText('MACH CUT‑OFF — descent slower than sea‑level sound; rays refract upward, no ground boom', P[0]-10, P[1]-24);\r\n  }\r\n\r\n  // boom sweep point on ground\r\n  if(S.ov.carpet && R && R.sweepX!=null && !R.cutoff){\r\n    const X=sx(R.sweepX), Y=gy;\r\n    const pg=g2.createRadialGradient(X,Y,1,X,Y,16);\r\n    pg.addColorStop(0,'rgba(251,191,36,.95)'); pg.addColorStop(1,'rgba(251,191,36,0)');\r\n    g2.fillStyle=pg; g2.beginPath(); g2.arc(X,Y,16,0,Math.PI*2); g2.fill();\r\n    g2.fillStyle='rgba(251,191,36,.75)'; g2.font='9px '+cssMono();\r\n    g2.fillText('boom reaches ground here', X+14, Y+34);\r\n  }\r\n\r\n  // vehicle\r\n  drawVehicle(sx(S.v.x), sy(S.v.y));\r\n\r\n  // observer\r\n  drawObserver(sx(S.obs.x), gy, R);\r\n\r\n  // status flash\r\n  if(R && R.status==='BOOM' && R.passedAgo<0.5){\r\n    g2.fillStyle=`rgba(255,255,255,${0.28*(1-R.passedAgo/0.5)})`;\r\n    g2.fillRect(0,0,W,H);\r\n  }\r\n\r\n  drawInset3D();\r\n  drawNwave();\r\n  drawAtten();\r\n  updateReadouts();\r\n}\r\nfunction cssMono(){return getComputedStyle(document.body).getPropertyValue('--mono');}\r\n\r\nfunction drawVehicle(x,y){\r\n  g2.save(); g2.translate(x,y);\r\n  g2.fillStyle='#e8eef7';\r\n  if(S.scen==='booster'){\r\n    // a Falcon 9 booster falls and lands VERTICALLY — always upright, base at (x,y)\r\n    const bw=7, bh=34;\r\n    g2.fillRect(-bw/2,-bh,bw,bh);                       // body standing on its base\r\n    g2.beginPath(); g2.moveTo(-bw/2,-bh); g2.lineTo(0,-bh-5); g2.lineTo(bw/2,-bh); g2.fill(); // interstage taper\r\n    g2.fillRect(-bw/2-4,-bh+6,4,5); g2.fillRect(bw/2,-bh+6,4,5);   // grid fins\r\n    if(S.v.y<3500){                                     // landing legs deploy low\r\n      g2.strokeStyle='#e8eef7'; g2.lineWidth=1.6;\r\n      g2.beginPath();\r\n      g2.moveTo(-bw/2,-3); g2.lineTo(-bw/2-7,3);\r\n      g2.moveTo(bw/2,-3);  g2.lineTo(bw/2+7,3);\r\n      g2.stroke();\r\n    }\r\n    if(S.v.M<1.7 || S.v.y<45000){                       // entry / landing burn — plume points down\r\n      const pl=g2.createLinearGradient(0,0,0,32);\r\n      pl.addColorStop(0,'rgba(255,210,140,.98)'); pl.addColorStop(1,'rgba(255,120,60,0)');\r\n      g2.fillStyle=pl;\r\n      g2.beginPath(); g2.moveTo(-bw/2,0); g2.lineTo(0,30); g2.lineTo(bw/2,0); g2.closePath(); g2.fill();\r\n    }\r\n    g2.restore();\r\n    g2.fillStyle='rgba(232,238,247,.6)'; g2.font='10px '+cssMono();\r\n    if(S.v.M>0.12) g2.fillText(`M ${S.v.M.toFixed(2)}`, x+16, y-bh*0.6);\r\n    return;\r\n  }\r\n  // aircraft — dart pointed along the velocity vector\r\n  g2.rotate(Math.atan2(S.v.vy,S.v.vx));\r\n  if(S.scen==='lowboom'){\r\n    // long, slender, needle-nosed low-boom airframe\r\n    g2.beginPath();\r\n    g2.moveTo(22,0); g2.lineTo(-13,-3); g2.lineTo(-11,0); g2.lineTo(-13,3); g2.closePath(); g2.fill();\r\n    g2.beginPath(); g2.moveTo(-5,0); g2.lineTo(-12,-6); g2.lineTo(-7,0); g2.fill();   // tail\r\n  }else{\r\n    g2.beginPath();\r\n    g2.moveTo(14,0); g2.lineTo(-10,-4); g2.lineTo(-8,0); g2.lineTo(-10,4); g2.closePath(); g2.fill();\r\n    g2.beginPath(); g2.moveTo(-2,0); g2.lineTo(-9,-7); g2.lineTo(-4,0); g2.fill();\r\n  }\r\n  g2.restore();\r\n  g2.fillStyle='rgba(232,238,247,.55)'; g2.font='10px '+cssMono();\r\n  g2.fillText(`M ${S.v.M.toFixed(2)}`, x+16, y-6);\r\n}\r\nfunction drawObserver(x,y,R){\r\n  const on = R && (R.status==='BOOM');\r\n  g2.strokeStyle = on?'#fff':'#34d399'; g2.fillStyle = on?'rgba(255,255,255,.9)':'rgba(52,211,153,.9)';\r\n  g2.lineWidth=2;\r\n  g2.beginPath(); g2.arc(x,y-9,4,0,Math.PI*2); g2.fill();\r\n  g2.beginPath(); g2.moveTo(x,y-5); g2.lineTo(x,y); g2.moveTo(x-5,y); g2.lineTo(x+5,y); g2.stroke();\r\n  g2.fillStyle=on?'#fff':'rgba(52,211,153,.9)'; g2.font='9px '+cssMono();\r\n  g2.fillText(S.lat!==0?`observer (${S.lat>0?'+':''}${S.lat} km lat)`:'observer', x+9, y-6);\r\n  // ring pulse on boom\r\n  if(on && R.passedAgo<0.6){\r\n    g2.strokeStyle=`rgba(255,255,255,${0.7*(1-R.passedAgo/0.6)})`; g2.lineWidth=2;\r\n    g2.beginPath(); g2.arc(x,y-9,4+R.passedAgo*60,0,Math.PI*2); g2.stroke();\r\n  }\r\n}\r\n\r\n/* ============================================================ 3D INSET (hand-rolled) */\r\nlet yaw=0.6, pitch=0.5, dragging3=false, lastM=null;\r\nc3d.parentElement.addEventListener('mousedown',e=>{dragging3=true;lastM=[e.clientX,e.clientY];});\r\nwindow.addEventListener('mouseup',()=>dragging3=false);\r\nwindow.addEventListener('mousemove',e=>{\r\n  if(!dragging3)return;\r\n  yaw+=(e.clientX-lastM[0])*0.01; pitch=clamp(pitch+(e.clientY-lastM[1])*0.006,0.12,1.2);\r\n  lastM=[e.clientX,e.clientY]; if(!S.playing) draw();\r\n});\r\nfunction drawInset3D(){\r\n  g3.clearRect(0,0,W3,H3);\r\n  g3.fillStyle='#070b14'; g3.fillRect(0,0,W3,H3);\r\n  if(!S.playing) yaw+=0; else yaw+=0.004;\r\n  const cx=W3*0.5, cy=H3*0.62, sc=Math.min(W3,H3)*0.30;\r\n  const cy2=Math.cos(yaw), sy2=Math.sin(yaw), sp=Math.sin(pitch), cp=Math.cos(pitch);\r\n  const pr=(X,Y,Z)=>{ // X downrange, Y lateral, Z up  (normalised units)\r\n    const xe=X*cy2 - Y*sy2;\r\n    const ye=(X*sy2 + Y*cy2);\r\n    return [cx + xe*sc, cy - (Z*cp - ye*sp)*sc];\r\n  };\r\n  // ground grid\r\n  g3.strokeStyle='rgba(120,150,190,.16)'; g3.lineWidth=1;\r\n  for(let gx=-2;gx<=2;gx++){ const a=pr(gx,-2,0),b=pr(gx,2,0);\r\n    g3.beginPath();g3.moveTo(a[0],a[1]);g3.lineTo(b[0],b[1]);g3.stroke(); }\r\n  for(let gy=-2;gy<=2;gy++){ const a=pr(-2,gy,0),b=pr(2,gy,0);\r\n    g3.beginPath();g3.moveTo(a[0],a[1]);g3.lineTo(b[0],b[1]);g3.stroke(); }\r\n\r\n  const R=S.res;\r\n  const supersonic = S.v.M>1.01 && !(R&&R.cutoff);\r\n\r\n  // boom carpet (lateral gaussian) under the track\r\n  if(R && !R.cutoff && R.carpetHalf>0){\r\n    const halfN = clamp(R.carpetHalf/ (cam.vmax*0.9), 0.15, 1.9);\r\n    for(let i=0;i<26;i++){\r\n      const yy=-halfN + 2*halfN*(i/25);\r\n      const al=0.20*Math.cos(0.5*Math.PI*yy/halfN);\r\n      if(al<=0)continue;\r\n      const a=pr(-2,yy,0), b=pr(2,yy,0);\r\n      g3.strokeStyle=`rgba(251,191,36,${al})`; g3.lineWidth=2;\r\n      g3.beginPath();g3.moveTo(a[0],a[1]);g3.lineTo(b[0],b[1]);g3.stroke();\r\n    }\r\n    // cut-off edges\r\n    for(const s of [-1,1]){\r\n      const a=pr(-2,s*halfN,0),b=pr(2,s*halfN,0);\r\n      g3.strokeStyle='rgba(248,113,113,.55)';g3.setLineDash([4,3]);g3.lineWidth=1;\r\n      g3.beginPath();g3.moveTo(a[0],a[1]);g3.lineTo(b[0],b[1]);g3.stroke();g3.setLineDash([]);\r\n    }\r\n  }\r\n\r\n  // vehicle + Mach cone\r\n  const vh = clamp(S.v.y/(cam.vmax), 0.05, 1.0)*1.4;\r\n  const vx = clamp((S.v.x-cam.x0)/(W/cam.s) - 0.5, -1, 1)*1.6;\r\n  const vp=pr(vx,0,vh);\r\n  g3.fillStyle='#e8eef7'; g3.beginPath(); g3.arc(vp[0],vp[1],3,0,7); g3.fill();\r\n\r\n  if(supersonic){\r\n    const mu=S.v.mu;\r\n    // cone axis = -velocity direction; approximate in inset as trailing along -X, tilted by descent\r\n    const u=[S.v.vx,S.v.vy]; const un=Math.hypot(u[0],u[1])||1;\r\n    const axX=-u[0]/un, axZ=-u[1]/un; // in (downrange, up) plane\r\n    const rings=6, Lc=1.7;\r\n    for(let k=1;k<=rings;k++){\r\n      const d=Lc*k/rings, rad=d*Math.tan(mu);\r\n      g3.strokeStyle=`rgba(251,191,36,${0.5-0.05*k})`; g3.lineWidth=1;\r\n      g3.beginPath();\r\n      for(let j=0;j<=28;j++){\r\n        const th=j/28*Math.PI*2;\r\n        // ring centre\r\n        const cX=vx+axX*d, cZ=vh+axZ*d;\r\n        // ring in plane perpendicular to axis: basis (lateral Y) and (in-plane perp)\r\n        const pX=-axZ, pZ=axX;\r\n        const X=cX + Math.cos(th)*rad*pX;\r\n        const Y=Math.sin(th)*rad;\r\n        const Z=cZ + Math.cos(th)*rad*pZ;\r\n        const p=pr(X,Y,Math.max(Z,0));\r\n        j===0?g3.moveTo(p[0],p[1]):g3.lineTo(p[0],p[1]);\r\n      }\r\n      g3.stroke();\r\n    }\r\n  } else {\r\n    g3.fillStyle='rgba(248,113,113,.9)'; g3.font='9px '+cssMono();\r\n    g3.fillText(R&&R.cutoff?'MACH CUT‑OFF':'subsonic', vp[0]+7, vp[1]-6);\r\n  }\r\n\r\n  // observer dot on carpet\r\n  if(R){\r\n    const oyN = clamp(S.lat*1000/(cam.vmax*0.9), -1.9, 1.9);\r\n    const oxN = clamp((S.obs.x-cam.x0)/(W/cam.s) - 0.5, -1.9, 1.9)*1.6;\r\n    const op=pr(oxN,oyN,0);\r\n    g3.fillStyle = (R.status==='BOOM')?'#fff':'#34d399';\r\n    g3.beginPath(); g3.arc(op[0],op[1],3.2,0,7); g3.fill();\r\n  }\r\n}\r\n\r\n/* ============================================================ N-WAVE PLOT */\r\nfunction nwave(tau,T_N,rise){\r\n  if(tau<0||tau>T_N)return 0;\r\n  const tr=Math.max(rise,1e-4);\r\n  if(tau<tr) return tau/tr;\r\n  if(tau>T_N-tr) return -(T_N-tau)/tr;\r\n  return 1 - 2*(tau-tr)/(T_N-2*tr);\r\n}\r\n// shaped low-boom \"thump\": a gentle rounded hump (no sharp shocks), faint ripples from the\r\n// un-coalesced shocklets, and a soft rarefaction tail. Peak ~1, caller scales it down.\r\nfunction shapedSig(tau,dur,rise){\r\n  if(tau<=0||tau>=dur) return 0;\r\n  const u=tau/dur;\r\n  const rf=clamp(rise/dur,0.14,0.45);\r\n  const up = u<rf ? smooth(u/rf) : 1;\r\n  const dn = smooth(clamp((1-u)/0.4,0,1));\r\n  const ripple = 1 - 0.15*Math.cos(u*Math.PI*4);\r\n  const tail = u>0.7 ? -0.22*smooth(clamp((u-0.7)/0.3,0,1)) : 0;\r\n  return up*dn*ripple + tail;\r\n}\r\nfunction drawNwave(){\r\n  gN.clearRect(0,0,WN,HN);\r\n  gN.fillStyle='#070a12'; gN.fillRect(0,0,WN,HN);\r\n  const R=S.res;\r\n  const padL=44,padR=12,padT=38,padB=22;\r\n  const x0=padL, x1=WN-padR, mid=(padT+HN-padB)/2;\r\n  // axes\r\n  gN.strokeStyle='rgba(120,150,190,.18)'; gN.lineWidth=1;\r\n  gN.beginPath(); gN.moveTo(x0,padT); gN.lineTo(x0,HN-padB); gN.lineTo(x1,HN-padB); gN.stroke();\r\n  gN.strokeStyle='rgba(120,150,190,.25)'; gN.setLineDash([3,3]);\r\n  gN.beginPath(); gN.moveTo(x0,mid); gN.lineTo(x1,mid); gN.stroke(); gN.setLineDash([]);\r\n  gN.fillStyle='rgba(150,170,200,.5)'; gN.font='9px '+cssMono();\r\n  gN.fillText('pressure',6,padT+2); gN.fillText('ambient',x1-46,mid-4); gN.fillText('time →',x1-40,HN-8);\r\n\r\n  if(!R || R.dp<=0 || (!R.arrived && R.countdown==null)){\r\n    gN.fillStyle='rgba(150,170,200,.45)';\r\n    const msg = R&&R.cutoff ? 'Mach cut‑off — this shock refracts upward, never reaching the ground'\r\n              : R&&!R.inCarpet ? 'observer is outside the boom carpet — no primary boom here'\r\n              : R&&R.enRouteAloft ? `boom en route ≈ ${R.countdown.toFixed(0)} s  (generated higher up, still descending)`\r\n              : R&&R.countdown!=null ? `cone reaches the observer in ≈ ${R.countdown.toFixed(1)} s`\r\n              : 'no boom yet — waiting for the Mach cone to sweep past';\r\n    gN.fillText(msg, x0+8, mid-10);\r\n    return;\r\n  }\r\n  const T_N=R.T_N, rise=R.riseMs/1000;\r\n\r\n  // ---- low-boom: shaped \"thump\" drawn against the N-wave a conventional jet would make ----\r\n  if(R.shaped){\r\n    const dur=T_N*1.35, sp=dur*1.6, lead=0.06*sp;\r\n    const tp=t=>x0 + (t/sp)*(x1-x0), amp=mid-padT-6, pp=v=>mid - v*amp;\r\n    const fr=clamp(R.dp/Math.max(R.dpConv,1e-6), 0.02, 1);\r\n    gN.strokeStyle='rgba(120,150,190,.4)'; gN.setLineDash([3,3]); gN.lineWidth=1;\r\n    gN.beginPath();\r\n    for(let i=0;i<=240;i++){ const t=sp*i/240, v=nwave(t-lead,T_N,0.003);\r\n      const X=tp(t),Y=pp(v*0.9); i?gN.lineTo(X,Y):gN.moveTo(X,Y); }\r\n    gN.stroke(); gN.setLineDash([]);\r\n    gN.fillStyle='rgba(120,150,190,.55)'; gN.font='8px '+cssMono();\r\n    gN.fillText(\"N‑wave a conventional jet would make\", tp(sp*0.30), pp(0.9)-3);\r\n    gN.strokeStyle='rgba(52,211,153,.95)'; gN.lineWidth=2;\r\n    gN.beginPath();\r\n    for(let i=0;i<=300;i++){ const t=sp*i/300, v=shapedSig(t-lead,dur,rise)*fr;\r\n      const X=tp(t),Y=pp(v*0.9); i?gN.lineTo(X,Y):gN.moveTo(X,Y); }\r\n    gN.stroke();\r\n    gN.fillStyle='rgba(52,211,153,.9)'; gN.font='9px '+cssMono();\r\n    gN.fillText(\"shaped “sonic thump”\", tp(lead)+2, pp(fr*0.9)-4);\r\n    if(R.arrived){\r\n      const frac=clamp(R.passedAgo/2.6,0,1), X=tp(sp*frac);\r\n      gN.strokeStyle='rgba(255,255,255,.8)'; gN.lineWidth=1;\r\n      gN.beginPath(); gN.moveTo(X,padT); gN.lineTo(X,HN-padB); gN.stroke();\r\n      if(frac>=1){ gN.fillStyle='rgba(255,255,255,.55)'; gN.fillText('PASSED', x1-52, padT+2); }\r\n    }else{\r\n      gN.fillStyle='rgba(52,211,153,.8)';\r\n      gN.fillText(`thump in ≈ ${R.countdown.toFixed(1)} s`, x0+8, padT+2);\r\n    }\r\n    gN.fillStyle='rgba(150,170,200,.6)';\r\n    gN.fillText(`rise ≈ ${R.riseMs.toFixed(0)} ms · ${R.PLdB.toFixed(0)} PLdB thump   vs ~${R.PLdBconv.toFixed(0)} PLdB for the N‑wave`, x0+8, HN-8);\r\n    return;\r\n  }\r\n\r\n  // ---- acceleration superboom: a focused U-wave, not a clean N ----\r\n  if(R.focused){\r\n    const Tn=Math.max(T_N,0.12), dur=Tn*2.2, sp=dur*1.3, lead=0.05*sp;\r\n    const tp=t=>x0 + (t/sp)*(x1-x0), amp=mid-padT-8, pp=v=>mid - v*amp;\r\n    const gau=(u,c,w)=>Math.exp(-Math.pow((u-c)/w,2));\r\n    // faint ghost: the plain N this spot would get with no focus\r\n    const fr=R.focusMult>0?1/R.focusMult:0.33;\r\n    gN.strokeStyle='rgba(120,150,190,.35)'; gN.setLineDash([3,3]); gN.lineWidth=1;\r\n    gN.beginPath();\r\n    for(let i=0;i<=200;i++){ const t=sp*i/200, v=nwave(t-lead,Tn,0.003)*fr;\r\n      const X=tp(t),Y=pp(v*0.9); i?gN.lineTo(X,Y):gN.moveTo(X,Y); }\r\n    gN.stroke(); gN.setLineDash([]);\r\n    gN.fillStyle='rgba(120,150,190,.5)'; gN.font='8px '+cssMono();\r\n    gN.fillText('plain N‑wave without the focus', tp(sp*0.32), pp(fr*0.9)-3);\r\n    // the focused U-wave: a peaked leading rise, rounded valley, second peak — the \"U\"\r\n    gN.strokeStyle='rgba(248,113,113,.95)'; gN.lineWidth=2;\r\n    gN.beginPath();\r\n    for(let i=0;i<=320;i++){\r\n      const t=sp*i/320, u=(t-lead)/dur;\r\n      let v=0;\r\n      if(u>0&&u<1){\r\n        const env=(u<0.05?smooth(u/0.05):1)*(u>0.9?smooth((1-u)/0.1):1);\r\n        v=env*(1.4*gau(u,0.13,0.10) + 0.85*gau(u,0.60,0.15) - 0.28*gau(u,0.40,0.13));\r\n      }\r\n      const X=tp(t),Y=pp(clamp(v,-1.15,1.55)*0.9); i?gN.lineTo(X,Y):gN.moveTo(X,Y);\r\n    }\r\n    gN.stroke();\r\n    if(R.arrived){\r\n      const frac=clamp(R.passedAgo/2.6,0,1), X=tp(sp*frac);\r\n      gN.strokeStyle='rgba(255,255,255,.8)'; gN.lineWidth=1;\r\n      gN.beginPath(); gN.moveTo(X,padT); gN.lineTo(X,HN-padB); gN.stroke();\r\n      if(frac>=1){ gN.fillStyle='rgba(255,255,255,.55)'; gN.fillText('PASSED', x1-52, padT+2); }\r\n    }\r\n    gN.fillStyle='rgba(248,113,113,.9)'; gN.font='9px '+cssMono();\r\n    gN.fillText(`focused U‑wave ≈ ×${(R.focusMult||1).toFixed(1)} the plain N   ·   ${R.PLdB.toFixed(0)} PLdB`, x0+8, HN-8);\r\n    return;\r\n  }\r\n\r\n  // three overlapping sub-N-waves for the Falcon 9 (base / fins+legs / top); one for aircraft\r\n  const sub = R.triple ? [[0,1.0],[R.g1,0.5],[R.g1+R.g2,0.85]] : [[0,1.0]];\r\n  const tnSub = R.triple ? T_N*0.8 : T_N;\r\n  const lastOff = sub[sub.length-1][0];\r\n  const span = (lastOff + tnSub)*1.45;\r\n  const t2px = t=>x0 + (t/span)*(x1-x0);\r\n  const amp = (mid-padT-6);\r\n  const p2px = v=>mid - v*amp;\r\n\r\n  // ideal (sharp) — dashed faint\r\n  gN.strokeStyle='rgba(120,150,190,.35)'; gN.setLineDash([2,3]); gN.lineWidth=1;\r\n  plotWave(1e-4,0.35);\r\n  gN.setLineDash([]);\r\n  // actual (absorption-rounded) — solid amber\r\n  gN.strokeStyle='rgba(251,191,36,.95)'; gN.lineWidth=1.8;\r\n  plotWave(rise,1);\r\n\r\n  function plotWave(rz,alpha){\r\n    gN.globalAlpha=alpha;\r\n    gN.beginPath();\r\n    const N=300, lead=0.04*span;\r\n    for(let i=0;i<=N;i++){\r\n      const t=span*i/N;\r\n      let v=0;\r\n      for(const [off,w] of sub) v += w*nwave(t-lead-off, tnSub, rz);\r\n      const X=t2px(t), Y=p2px(clamp(v,-1.15,1.15)*0.9);\r\n      i===0?gN.moveTo(X,Y):gN.lineTo(X,Y);\r\n    }\r\n    gN.stroke(); gN.globalAlpha=1;\r\n  }\r\n\r\n  if(R.triple){                       // tick + label the three shocks\r\n    gN.fillStyle='rgba(150,170,200,.55)'; gN.font='8px '+cssMono();\r\n    const names=['base','fins+legs','top'];\r\n    sub.forEach(([off],k)=>{\r\n      const X=t2px(0.04*span+off);\r\n      gN.strokeStyle='rgba(120,150,190,.3)'; gN.beginPath(); gN.moveTo(X,padT); gN.lineTo(X,padT+7); gN.stroke();\r\n      gN.fillText(names[k], X-2, padT-2);\r\n    });\r\n  }\r\n\r\n  // playhead sweep after arrival (stretched for visibility)\r\n  if(R.arrived){\r\n    const PLAY=2.6;\r\n    const frac=clamp((R.passedAgo)/PLAY,0,1);\r\n    const X=t2px(span*frac);\r\n    gN.strokeStyle='rgba(255,255,255,.8)'; gN.lineWidth=1;\r\n    gN.beginPath(); gN.moveTo(X,padT); gN.lineTo(X,HN-padB); gN.stroke();\r\n    if(frac>=1){ gN.fillStyle='rgba(255,255,255,.55)'; gN.fillText('PASSED', x1-52, padT+2); }\r\n  }else{\r\n    gN.fillStyle='rgba(52,211,153,.8)';\r\n    gN.fillText(`boom in ≈ ${R.countdown.toFixed(1)} s`, x0+8, padT+2);\r\n  }\r\n\r\n  // labels\r\n  gN.fillStyle='rgba(251,191,36,.85)';\r\n  gN.fillText('+Δp', t2px(span*0.03)+2, p2px(0.9)-2);\r\n  gN.fillText('−Δp', t2px(T_N*0.95), p2px(-0.9)+10);\r\n  gN.fillStyle='rgba(150,170,200,.6)';\r\n  const kind = R.focused ? 'at a focus — the real signature is a U‑wave, not this N'\r\n             : R.triple ? `triple boom · spread ${((R.g1+R.g2)*1000).toFixed(0)} ms`\r\n             : R.dbl ? 'double boom' : 'single crack';\r\n  gN.fillText(`T_N ≈ ${(T_N*1000).toFixed(0)} ms   rise ≈ ${R.riseMs.toFixed(1)} ms   ·  ${kind}`, x0+8, HN-8);\r\n}\r\n\r\n/* ============================================================ ATTENUATION PLOT */\r\nfunction drawAtten(){\r\n  gA.clearRect(0,0,WA,HA);\r\n  gA.fillStyle='#070a12'; gA.fillRect(0,0,WA,HA);\r\n  const padL=46,padR=14,padT=38,padB=26;\r\n  const x0=padL,x1=WA-padR,y0=HA-padB,y1=padT;\r\n  gA.strokeStyle='rgba(120,150,190,.18)'; gA.lineWidth=1;\r\n  gA.beginPath(); gA.moveTo(x0,y1); gA.lineTo(x0,y0); gA.lineTo(x1,y0); gA.stroke();\r\n  gA.fillStyle='rgba(150,170,200,.5)'; gA.font='9px '+cssMono();\r\n  gA.fillText('Δp [Pa]',6,y1-6); gA.fillText('slant distance r →',x1-96,HA-9);\r\n\r\n  const R=S.res;\r\n  const haveData = !!(R && R.dpRaw>0);\r\n  if(!haveData){\r\n    gA.fillStyle='rgba(150,170,200,.4)';\r\n    gA.fillText('waiting for a boom — no overpressure data yet', x0+8, (y0+y1)/2);\r\n    return;\r\n  }\r\n  const rRef = R.r0>0?R.r0:8000;\r\n  const dpRef = R.dpRaw>0?R.dpRaw:120;\r\n  const rMin=Math.max(rRef*0.25,800), rMax=Math.min(rRef*12, 150000);   // don't draw past the carpet\r\n  const dpAt = r=>dpRef*Math.pow(rRef/r,0.75);\r\n  const lrMin=Math.log10(rMin), lrMax=Math.log10(rMax);\r\n  const dpTop=dpAt(rMin), dpBot=dpAt(rMax)*0.6;\r\n  const ldTop=Math.log10(dpTop), ldBot=Math.log10(Math.max(dpBot,0.5));\r\n  const X=r=>x0+(Math.log10(r)-lrMin)/(lrMax-lrMin)*(x1-x0);\r\n  const Y=d=>y0-(Math.log10(Math.max(d,0.3))-ldBot)/(ldTop-ldBot)*(y0-y1);\r\n\r\n  // grid + ticks\r\n  gA.fillStyle='rgba(150,170,200,.45)';\r\n  for(const rk of [1,3,10,30,100,300]){\r\n    const r=rk*1000; if(r<rMin||r>rMax)continue;\r\n    const px=X(r);\r\n    gA.strokeStyle='rgba(120,150,190,.10)';\r\n    gA.beginPath();gA.moveTo(px,y1);gA.lineTo(px,y0);gA.stroke();\r\n    gA.fillText(rk<1?rk*1000+' m':rk+' km', px-8, y0+13);\r\n  }\r\n  for(const dk of [1,3,10,30,100,300,1000]){\r\n    if(dk<Math.pow(10,ldBot)||dk>Math.pow(10,ldTop))continue;\r\n    const py=Y(dk);\r\n    gA.strokeStyle='rgba(120,150,190,.10)';\r\n    gA.beginPath();gA.moveTo(x0,py);gA.lineTo(x1,py);gA.stroke();\r\n    gA.fillText(dk+'',x0-32,py+3);\r\n  }\r\n\r\n  // reference slope: cylindrical spreading alone (r^-1/2), through (rRef, dpRef)\r\n  gA.strokeStyle='rgba(120,150,190,.35)'; gA.setLineDash([4,4]); gA.lineWidth=1;\r\n  gA.beginPath();\r\n  gA.moveTo(X(rMin), Y(dpRef*Math.pow(rRef/rMin,0.5)));\r\n  gA.lineTo(X(rMax), Y(dpRef*Math.pow(rRef/rMax,0.5)));\r\n  gA.stroke(); gA.setLineDash([]);\r\n  gA.fillStyle='rgba(120,150,190,.5)';\r\n  gA.fillText('r⁻¹ᐟ²  spreading only', X(rMin)+3, Y(dpRef*Math.pow(rRef/rMin,0.5))-3);\r\n\r\n  // main curve: spreading × nonlinear aging → r^-3/4\r\n  gA.strokeStyle='rgba(251,191,36,.95)'; gA.lineWidth=2;\r\n  gA.beginPath();\r\n  for(let i=0;i<=120;i++){\r\n    const r=Math.pow(10, lrMin+(lrMax-lrMin)*i/120);\r\n    const px=X(r), py=Y(dpAt(r));\r\n    i===0?gA.moveTo(px,py):gA.lineTo(px,py);\r\n  }\r\n  gA.stroke();\r\n  gA.fillStyle='rgba(251,191,36,.8)';\r\n  gA.fillText('r⁻³ᐟ⁴  + nonlinear aging', x1-146, y1-6);\r\n\r\n  // carpet edge — beyond this lateral the primary boom is gone\r\n  if(R.carpetHalf>0){\r\n    const rEdge=Math.hypot(rRef, R.carpetHalf);\r\n    if(rEdge>rMin && rEdge<rMax){\r\n      const px=X(rEdge);\r\n      gA.strokeStyle='rgba(248,113,113,.4)'; gA.setLineDash([2,3]); gA.lineWidth=1;\r\n      gA.beginPath(); gA.moveTo(px,y1); gA.lineTo(px,y0); gA.stroke(); gA.setLineDash([]);\r\n      gA.fillStyle='rgba(248,113,113,.55)'; gA.fillText('carpet edge', px-24, y0-4);\r\n    }\r\n  }\r\n\r\n  // observer marker\r\n  if(R && R.r>0 && R.dp>0){\r\n    const px=X(clamp(R.r,rMin,rMax)), py=Y(clamp(R.dp,Math.pow(10,ldBot),Math.pow(10,ldTop)));\r\n    gA.fillStyle=R.status==='BOOM'?'#fff':'#34d399';\r\n    gA.beginPath(); gA.arc(px,py,4,0,7); gA.fill();\r\n    gA.fillStyle='rgba(230,238,247,.9)';\r\n    gA.fillText(`${R.dp.toFixed(0)} Pa · ${R.psf.toFixed(2)} psf @ ${(R.r/1000).toFixed(1)} km`, x0+6, y0-6);\r\n  }\r\n}\r\n\r\n/* ============================================================ READOUTS */\r\nfunction readRow(k,v,cls,tip){\r\n  const t = tip ? ` title=\"${tip}\"` : '';\r\n  return `<dt${t}>${k}<\/dt><dd class=\"${cls||''}\"${t}>${v}<\/dd>`;\r\n}\r\nfunction updateReadouts(){\r\n  const R=S.res; if(!R){rdl.innerHTML='';return;}\r\n  const A=atmo(S.v.hGen);\r\n  const fresh = R.status==='BOOM' && R.passedAgo<3.5;\r\n  let statusCls = fresh?'warn':R.status==='BOOM'?'hi':R.cutoff?'warn':R.status==='incoming'?'ok':'';\r\n  let statusTxt = fresh?'▲ BOOM NOW'\r\n                 :R.status==='BOOM'?'boom received (see Δp)'\r\n                 :R.status==='incoming'?`incoming · ${R.countdown.toFixed(R.countdown<10?1:0)} s`\r\n                 :R.cutoff?'Mach cut‑off':R.status||'—';\r\n  let rows='';\r\n  const pk=S._peak;\r\n  if(pk && pk.dp>0){\r\n    rows+=readRow('⌖ Loudest spot', pk.wh
