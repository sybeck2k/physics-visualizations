ere, '',\r\n      'Estimated up front from the current parameters — where the strongest boom lands on the ground and how loud it is there, before the run plays out');\r\n    rows+=readRow('   level there', `≈ ${pk.psf.toFixed(1)} psf · ${pk.PLdB.toFixed(0)} PLdB`,\r\n      pk.PLdB>108?'warn':'');\r\n    rows+='<div class=\"sep\"><\/div>';\r\n  }\r\n  rows+=readRow('Scenario', SCEN[S.scen].name);\r\n  rows+=readRow('Mach M', R.M.toFixed(3), R.M>1?'hi':'');\r\n  rows+=readRow('Speed', (R.spd).toFixed(0)+' m/s');\r\n  rows+=readRow('Local a', A.a.toFixed(1)+' m/s');\r\n  if(S.scen==='booster') rows+=readRow('Boom made at',\r\n    R.hGen>400&&R.dp>0 ? `${(R.hGen/1000).toFixed(1)} km · M ${R.mGen.toFixed(2)}` : '—', '',\r\n    'Altitude and Mach at the point along the descent where the boom now reaching the ground was generated');\r\n  rows+=readRow('Mach angle μ',\r\n    S.v.M>1 ? (S.v.mu*180/Math.PI).toFixed(1)+'°'\r\n    : (S.scen==='booster'&&R.mGen>1&&R.dp>0 ? (R.mu*180/Math.PI).toFixed(1)+'° at source' : '—'),\r\n    '', 'μ = arcsin(1/M) — the one exact number here; everything else is an engineering estimate');\r\n  rows+='<div class=\"sep\"><\/div>';\r\n  rows+=readRow('Observer', statusTxt, statusCls);\r\n  const dVeh=Math.sqrt((S.v.x-S.obs.x)**2 + S.v.y**2 + (S.lat*1000)**2);\r\n  rows+=readRow(S.scen==='booster'?'Observer → booster':'Observer → aircraft',\r\n    (dVeh/1000).toFixed(1)+' km', '',\r\n    \"Straight-line distance to the vehicle's position right now — not the boom's path (see Propagation r)\");\r\n  if(S.scen==='booster'){\r\n    const padDist=Math.abs(S.obs.x-SCEN.booster.padX), tLand=runLen();\r\n    rows+=readRow('Distance from pad', (padDist/1000).toFixed(1)+' km');\r\n    if(R.status==='BOOM'){\r\n      const lo=(S._arrivedAt||S.t)-tLand;\r\n      rows+=readRow('Boom vs. touchdown',\r\n        `≈ touchdown (${lo>=0?'+':'−'}${Math.abs(lo).toFixed(0)} s)`,\r\n        Math.abs(lo)<15?'ok':'',\r\n        'The last supersonic shocks are made near Mach 1, descending about as fast as sound, so they land within seconds of the booster. Real timing shifts with observer position and trajectory.');\r\n    }else{\r\n      rows+=readRow('Boom vs. touchdown', R.cutoff?'—':'≈ around touchdown', R.cutoff?'':'ok');\r\n    }\r\n  }\r\n  rows+=readRow('Peak Δp', R.dp>0?`${R.dp.toFixed(0)} Pa · ${R.psf.toFixed(2)} psf`:'—', R.dp>0?'hi':'',\r\n    'Overpressure: the pressure spike above still air (~101 000 Pa).  1 psf ≈ 48 Pa');\r\n  rows+=readRow('Propagation r', R.r>0?(R.r/1000).toFixed(1)+' km':'—', '',\r\n    'Slant distance the boom travelled from where it was generated to the observer');\r\n  rows+=readRow(R.shaped?'Signature length':'N‑wave T_N',\r\n    R.T_N>0?`${(R.T_N*1000).toFixed(0)} ms · rise ${R.riseMs.toFixed(R.shaped?0:1)}`:'—', '',\r\n    R.shaped\r\n      ? 'The shaped thump has no coalesced N and no true shock — this is its total length and the time it takes to rise to the peak (ms)'\r\n      : 'T_N = length of the N-wave; rise = how fast the front shock jumps (ms). It grows with propagation distance, so shorter rise = sharper crack');\r\n  rows+=readRow('Perceived', R.dp>0?`${R.PLdB.toFixed(0)} PLdB · ${R.label}`:'—',\r\n    R.dp>0?(R.shaped?'ok':R.PLdB>100?'warn':''):'',\r\n    'Perceived Level in decibels — how loud/startling it sounds, not the raw pressure. +10 ≈ twice as loud');\r\n  rows+=readRow('Boom shape',\r\n    R.dp<=0 ? '—'\r\n    : R.focused ? `focused U‑wave · ×${(R.focusMult||1).toFixed(1)} the plain N`\r\n    : R.shaped ? 'shaped — no coalesced N'\r\n    : R.triple ? `triple · ${((R.g1+R.g2)*1000).toFixed(0)} ms spread`\r\n    : R.dbl ? 'double boom' : 'single crack');\r\n  if(R.shaped && R.dp>0){\r\n    rows+=readRow('vs. plain N‑wave',\r\n      `${(R.dpConv/PA_PER_PSF).toFixed(1)} psf · +${(R.PLdBconv-R.PLdB).toFixed(0)} PLdB`,\r\n      'ok',\r\n      'What an unshaped airframe of the same size would put on the ground — the shaping buys this much reduction');\r\n  }\r\n  rows+='<div class=\"sep\"><\/div>';\r\n  rows+=readRow('Carpet ½‑width',\r\n    R.carpetHalf>0?`${(R.carpetHalf/1000).toFixed(1)} km${R.inCarpet?'':' · outside'}`:'—',\r\n    R.inCarpet?'':'warn',\r\n    'Half the width of the ground strip that gets a boom; the observer lateral offset sets how far off-centre you are');\r\n  rdl.innerHTML=rows;\r\n}\r\n\r\n/* ============================================================ LOOP */\r\nlet lastTS=0;\r\nfunction frame(ts){\r\n  requestAnimationFrame(frame);\r\n  const dtReal=Math.min((ts-lastTS)/1000||0, 0.05); lastTS=ts;\r\n  if(S.playing){\r\n    const dt=dtReal*S.rate;\r\n    let sub=Math.ceil(dt/0.02), h=dt/sub;\r\n    for(let i=0;i<sub;i++){ S.t+=h; stepVehicle(h); emit(); }\r\n    // advance wavefront ages implicitly via S.t; cull far ones\r\n    if(S.wf.length>WF_CAP) S.wf.splice(0,S.wf.length-WF_CAP);\r\n    // the timeline runs until the boom has reached the observer and the N-wave has passed —\r\n    // but never stop while a boom is still on its way in (guards against a short estimate)\r\n    const endT = simDuration();\r\n    const boomPending = S.res && (S.res.status==='incoming' || (S.res.arrived && S.res.passedAgo<3)\r\n                                  || S.res.enRouteAloft);\r\n    if(S.t>=endT && !boomPending){ S.t=endT; S.playing=false; playBtn.textContent='▶ Play'; }\r\n    else if(S.t>=endT+40){ S.t=endT+40; S.playing=false; playBtn.textContent='▶ Play'; } // hard cap\r\n    syncProg();\r\n  }\r\n  S.res=computeObserver();\r\n  draw();\r\n}\r\nrequestAnimationFrame(frame);\r\n\r\n/* ============================================================ UI WIRING */\r\nconst $=id=>document.getElementById(id);\r\nconst playBtn=$('playBtn'), rdl=$('rdl');\r\nfunction syncProg(){\r\n  const D=Math.max(simDuration(), S.t);   // grow if the run overran the estimate\r\n  $('prog').value=clamp(S.t/D,0,1);\r\n  $('progV').textContent=`${S.t.toFixed(1)} / ${D.toFixed(0)} s`;\r\n}\r\nplayBtn.onclick=()=>{\r\n  S.playing=!S.playing;\r\n  playBtn.textContent=S.playing?'❚❚ Pause':'▶ Play';\r\n};\r\n$('restartBtn').onclick=()=>resetSim(true);\r\n$('prog').oninput=e=>{\r\n  S.playing=false; playBtn.textContent='▶ Play';\r\n  S.t=parseFloat(e.target.value)*simDuration();\r\n  rebuildTo(S.t);                  // rewind/fast-forward to t WITH its full wavefront trail\r\n  S.res=computeObserver(); draw(); syncProg();\r\n};\r\n// Rebuild the entire state at time `tt` by replaying kinematics AND the emission schedule\r\n// from t=0. Scrubbing the timeline then lands on a populated frame, not an empty one.\r\nfunction rebuildTo(tt){\r\n  S.wf.length=0; S.lastEmit=-1; S._arrivedAt=null; S._heardG=null; S._holdBase=null;\r\n  resetKinematicsTo(tt);\r\n}\r\nfunction resetKinematicsTo(tt){\r\n  S.focus={x:null,xMin:Infinity,tMin:0,locked:false};\r\n  if(S.scen==='cruise'||S.scen==='lowboom'){          // closed form — no need to integrate\r\n    const spd=S.mach*soundSpeed(S.alt), aE=soundSpeed(S.alt);\r\n    const mu=S.mach>1?Math.asin(1/S.mach):Math.PI/2, boom=S.mach>1;\r\n    for(let u=0;u<=tt;u+=DT_EMIT)\r\n      S.wf.push({x:spd*u,y:S.alt,t:u,a:aE,M:S.mach,spd,mu,boom});\r\n    if(S.wf.length>WF_CAP) S.wf.splice(0,S.wf.length-WF_CAP);\r\n    S.lastEmit=S.wf.length?S.wf[S.wf.length-1].t:-1;\r\n    S.t=tt; stepVehicle(0.0001); S.v.x=spd*tt;\r\n    return;\r\n  }\r\n  // scripted trajectories: re-run stepVehicle from 0 with small steps, emitting as it goes\r\n  S.t=0;\r\n  const c=SCEN[S.scen];\r\n  if(S.scen==='booster'){ S.v.x=keyf(c.downKf,0); S.v.y=keyf(c.altKf,0); }\r\n  else { S.v.x=0; S.v.y=S.alt; }\r\n  const h=1/60;\r\n  for(let u=0;u<tt;u+=h){ S.t=u; stepVehicle(h); emit(); }\r\n  S.t=tt; stepVehicle(0.0001);\r\n}\r\n// a parameter changed: rebuild the wavefront trail + kinematics consistently at the current time\r\nfunction reparam(){\r\n  S.wf.length=0; S.lastEmit=-1; S._arrivedAt=null; S._heardG=null;\r\n  resetKinematicsTo(S.t);\r\n  S.res=computeObserver();\r\n  if(!S.playing) draw();\r\n  syncProg();\r\n}\r\n\r\n/* sliders */\r\nfunction refreshSliderLabels(){\r\n  $('rateV').textContent=S.rate.toFixed(2)+'×';\r\n  $('machV').textContent=S.mach.toFixed(2);\r\n  $('altV').textContent=(S.alt/1000).toFixed(1)+' km';\r\n  $('mendV').textContent=S.mend.toFixed(2);\r\n  $('accV').textContent=S.acc.toFixed(2)+'×';\r\n  $('lenV').textContent=S.len.toFixed(0)+' m';\r\n  $('bmV').textContent=S.bm.toFixed(1);\r\n  $('bdV').textContent=S.bd.toFixed(2)+'×';\r\n  $('latV').textContent=(S.lat>0?'+':'')+S.lat.toFixed(1)+' km';\r\n}\r\nconst nudge=()=>{ S.res=computeObserver(); if(!S.playing) draw(); syncProg(); };\r\n$('rate').oninput=e=>{S.rate=parseFloat(e.target.value);refreshSliderLabels();};\r\n$('mach').oninput=e=>{S.mach=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('alt').oninput=e=>{S.alt=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('mend').oninput=e=>{S.mend=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('acc').oninput=e=>{S.acc=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('len').oninput=e=>{S.len=parseFloat(e.target.value);refreshSliderLabels();nudge();};\r\n$('bm').oninput=e=>{S.bm=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('bd').oninput=e=>{S.bd=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('lat').oninput=e=>{S.lat=parseFloat(e.target.value);S._arrivedAt=null;S._heardG=null;refreshSliderLabels();nudge();};\r\n\r\n/* overlays */\r\n$('oWf').onchange=e=>{S.ov.wf=e.target.checked;draw();};\r\n$('oCone').onchange=e=>{S.ov.cone=e.target.checked;draw();};\r\n$('oCarpet').onchange=e=>{S.ov.carpet=e.target.checked;draw();};\r\n$('oAtm').onchange=e=>{S.ov.atm=e.target.checked;draw();};\r\n\r\n/* tabs */\r\ndocument.querySelectorAll('#tabs button').forEach(b=>{\r\n  b.onclick=()=>{\r\n    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));\r\n    b.classList.add('on');\r\n    S.scen=b.dataset.s;\r\n    document.querySelectorAll('[data-scen]').forEach(el=>{\r\n      el.style.display = el.dataset.scen.split(' ').includes(S.scen)?'':'none';\r\n    });\r\n    // sensible per-scenario defaults\r\n    const D = ({\r\n      accel:  {rate:3,   alt:8000,  len:60},   // focus lands ~10 km behind; sound takes a while to get there\r\n      cruise: {rate:1,   alt:12000, len:60, mach:1.8},\r\n      lowboom:{rate:1,   alt:16800, len:32, mach:1.4},   // X-59 design point: M1.4, ~55 kft\r\n      booster:{rate:3.0},\r\n    })[S.scen] || {};\r\n    if(D.rate!=null) S.rate=D.rate;\r\n    if(D.alt !=null) S.alt =D.alt;\r\n    if(D.len !=null) S.len =D.len;\r\n    if(D.mach!=null) S.mach=D.mach;\r\n    ['rate','alt','len','mach'].forEach(id=>{ const e=$(id); if(e) e.value=S[id]; });\r\n    refreshSliderLabels();\r\n    resetSim(false);\r\n  };\r\n});\r\n\r\n/* 2D stage: drag the marker to move the observer, drag anywhere else to pan the camera */\r\nlet dragMode=null, lastMx=0;\r\nmain2d.addEventListener('mousedown',e=>{\r\n  const r=main2d.getBoundingClientRect();\r\n  const px=e.clientX-r.left, py=e.clientY-r.top;\r\n  lastMx=e.clientX;\r\n  dragMode = (Math.abs(px - sx(S.obs.x))<24 && py>cam.yBase-52) ? 'obs' : 'pan';\r\n  document.body.style.cursor = dragMode==='pan' ? 'grabbing' : 'ew-resize';\r\n});\r\nwindow.addEventListener('mousemove',e=>{\r\n  if(!dragMode)return;\r\n  const dx=e.clientX-lastMx; lastMx=e.clientX;\r\n  if(dragMode==='obs'){\r\n    const r=main2d.getBoundingClientRect();\r\n    S.obs.x = cam.x0 + (e.clientX-r.left)/cam.s;\r\n    S._arrivedAt=null; S._heardG=null; S._obsUserMoved=true;\r\n  }else{\r\n    S.pan -= dx/cam.s;                         // drag right → view slides right\r\n  }\r\n  S.res=computeObserver(); if(!S.playing)draw(); syncProg();\r\n});\r\nwindow.addEventListener('mouseup',()=>{ dragMode=null; document.body.style.cursor=''; });\r\nmain2d.addEventListener('dblclick',()=>{ S.pan=0; if(!S.playing)draw(); });\r\n$('panL').onclick=()=>{ S.pan -= 0.16*(W/cam.s); if(!S.playing)draw(); };\r\n$('panR').onclick=()=>{ S.pan += 0.16*(W/cam.s); if(!S.playing)draw(); };\r\n$('recenter').onclick=()=>{ S.pan=0; if(!S.playing)draw(); };\r\n\r\n/* ============================================================ go */\r\ndocument.querySelectorAll('[data-scen]').forEach(el=>{\r\n  el.style.display = el.dataset.scen.split(' ').includes(S.scen)?'':'none';\r\n});\r\nresize();\r\ndocument.querySelector('#tabs button.on').click();   // apply the starting scenario's defaults\r\n<\/script>\r\n","diffraction":"<title>Multi-Slit Diffraction &amp; the Grating<\/title>\r\n<style>\r\n  /* Committed dark instrument-panel aesthetic: single visual world, painted explicitly. */\r\n  :root{\r\n    color-scheme:dark;\r\n    --bg:#06080d; --panel:#0b0f1a; --panel2:#0e1424; --line:#1b2436;\r\n    --ink:#c9d4e3; --dim:#7c8aa0; --faint:#4a5568;\r\n    --cyan:#38bdf8; --amber:#fbbf24; --green:#34d399; --red:#f87171; --violet:#a78bfa;\r\n    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,\"Liberation Mono\",monospace;\r\n    --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;\r\n  }\r\n  *{box-sizing:border-box}\r\n  html,body{margin:0;height:100%}\r\n  body{\r\n    background:var(--bg); color:var(--ink); font-family:var(--sans);\r\n    font-size:13px; line-height:1.5; overflow:hidden;\r\n  }\r\n  #app{display:flex; flex-direction:column; height:100vh; width:100vw}\r\n\r\n  header{\r\n    display:flex; align-items:center; gap:14px 18px; padding:10px 16px; flex-wrap:wrap;\r\n    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0a0e18,#070a12);\r\n    flex:0 0 auto;\r\n  }\r\n  header h1{\r\n    font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;\r\n    margin:0; color:#e6edf6;\r\n  }\r\n  header h1 span{color:var(--cyan)}\r\n  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}\r\n  .tabs button{\r\n    font-family:var(--mono); font-size:11px; letter-spacing:.06em;\r\n    color:var(--dim); background:var(--panel2); border:1px solid var(--line);\r\n    padding:7px 12px; border-radius:7px; cursor:pointer; transition:.15s;\r\n  }\r\n  .tabs button:hover{color:var(--ink); border-color:#2b3550}\r\n  .tabs button.on{color:#06202b; background:var(--cyan); border-color:var(--cyan); font-weight:600}\r\n\r\n  main{flex:1 1 auto; display:grid; grid-template-columns:250px 1fr; min-height:0}\r\n\r\n  aside{\r\n    border-right:1px solid var(--line); background:var(--panel);\r\n    padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;\r\n  }\r\n  .grp{display:flex; flex-direction:column; gap:9px}\r\n  .grp h2{\r\n    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;\r\n    color:var(--faint); margin:0 0 2px; border-bottom:1px solid var(--line); padding-bottom:6px;\r\n  }\r\n  .btns{display:flex; gap:6px}\r\n  .btns button{\r\n    flex:1; font-family:var(--mono); font-size:11px; color:var(--ink);\r\n    background:var(--panel2); border:1px solid var(--line); border-radius:6px;\r\n    padding:8px 4px; cursor:pointer; transition:.15s;\r\n  }\r\n  .btns button:hover{border-color:var(--cyan); color:#fff}\r\n  .btns button.play{background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.4)}\r\n  label.fld{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim)}\r\n  label.fld .v{color:var(--ink); font-family:var(--mono); font-size:11px}\r\n  input[type=range]{width:100%; accent-color:var(--cyan); cursor:pointer}\r\n  label.chk{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); cursor:pointer}\r\n  label.chk input{accent-color:var(--cyan); cursor:pointer}\r\n\r\n  #stagewrap{position:relative; min-width:0; display:flex; flex-direction:column}\r\n  #stage{position:relative; flex:1 1 auto; min-height:0; background:#04060b}\r\n  #stage canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  #inset3d{\r\n    position:absolute; top:12px; right:10px; width:272px; height:176px;\r\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.96);\r\n    backdrop-filter:blur(3px); z-index:3;\r\n  }\r\n  #inset3d canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  #inset3d .cap{\r\n    position:absolute; left:9px; top:7px; font-family:var(--mono); font-size:9px;\r\n    letter-spacing:.12em; text-transform:uppercase; color:var(--faint); z-index:1;\r\n  }\r\n  #readouts{\r\n    position:absolute; top:192px; right:10px; bottom:8px; width:314px; z-index:3;\r\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.97);\r\n    backdrop-filter:blur(3px); padding:9px 12px; font-family:var(--mono);\r\n    overflow-y:auto;\r\n  }\r\n  #readouts h3{\r\n    font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);\r\n    margin:0 0 6px;\r\n  }\r\n  #readouts dl{display:grid; grid-template-columns:1fr auto; gap:1px 10px; margin:0; font-size:10px}\r\n  #readouts dt{color:var(--dim); white-space:nowrap}\r\n  #readouts dt[title]{cursor:help; text-decoration:underline dotted var(--faint); text-underline-offset:2px}\r\n  #readouts dd{margin:0; text-align:right; color:var(--ink)}\r\n  #readouts dd.hi{color:var(--amber)}\r\n  #readouts dd.warn{color:var(--red)}\r\n  #readouts dd.ok{color:var(--green)}\r\n  #readouts .sep{grid-column:1/-1; height:1px; background:var(--line); margin:5px 0}\r\n\r\n  #plots{\r\n    flex:0 0 168px; display:grid; grid-template-columns:1fr 1fr; gap:1px;\r\n    background:var(--line); border-top:1px solid var(--line);\r\n  }\r\n  .plot{position:relative; background:#070a12}\r\n  .plot canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  .plot .cap{\r\n    position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:9px;\r\n    letter-spacing:.13em; text-transform:uppercase; color:var(--faint); z-index:1;\r\n  }\r\n\r\n  #explain{\r\n    flex:0 0 auto; max-height:clamp(180px,26vh,300px); overflow-y:auto; border-top:1px solid var(--line);\r\n    background:var(--panel); padding:11px 16px 13px; display:grid;\r\n    grid-template-columns:repeat(5,1fr); gap:12px;\r\n  }\r\n  #explain .ex{\r\n    border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 12px;\r\n    max-height:clamp(164px,24vh,280px); overflow-y:auto;\r\n  }\r\n  #explain .ex::-webkit-scrollbar{width:5px}\r\n  #explain .ex::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}\r\n  #explain h4{\r\n    margin:0 0 5px; font-family:var(--mono); font-size:10px;\r\n    letter-spacing:.1em; text-transform:uppercase; color:var(--cyan);\r\n  }\r\n  #explain p{margin:5px 0 0; color:var(--dim); font-size:11.5px}\r\n  #explain p.cav{margin-top:6px; color:var(--faint); font-size:10px; font-style:italic; line-height:1.45}\r\n  #explain b{color:var(--ink); font-weight:600}\r\n  #explain code{font-family:var(--mono); color:var(--amber); font-size:11px}\r\n  .hint{font-size:10.5px; color:var(--faint); margin-top:4px}\r\n  @media (max-width:1400px){ #explain{grid-template-columns:repeat(3,1fr); max-height:34vh} }\r\n  @media (max-width:820px){ #explain{grid-template-columns:1fr 1fr; max-height:40vh} }\r\n<\/style>\r\n\r\n<div id=\"app\">\r\n  <header>\r\n    <h1>Multi&#8209;Slit&nbsp;<span>Diffraction<\/span><\/h1>\r\n    <div class=\"tabs\" id=\"tabs\">\r\n      <button data-s=\"single\">1 · Single slit<\/button>\r\n      <button data-s=\"double\">2 · Double slit<\/button>\r\n      <button data-s=\"grating\" class=\"on\">3 · Grating (N lines)<\/button>\r\n      <button data-s=\"subwave\">4 · Sub‑wavelength d &lt; λ<\/button>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <main>\r\n    <aside>\r\n      <div class=\"grp\">\r\n        <h2>Simulation<\/h2>\r\n        <div class=\"btns\">\r\n          <button id=\"playBtn\" class=\"play\">▶ Play<\/button>\r\n          <button id=\"restartBtn\">↻ Restart<\/button>\r\n        <\/div>\r\n        <label class=\"fld\">Time rate <span class=\"v\" id=\"rateV\">1.00×<\/span>\r\n          <input type=\"range\" id=\"rate\" min=\"0.15\" max=\"5\" step=\"0.05\" value=\"1\">\r\n        <\/label>\r\n        <label class=\"fld\">Timeline <span class=\"v\" id=\"progV\">0 fs<\/span>\r\n          <input type=\"range\" id=\"prog\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\">\r\n        <\/label>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Aperture<\/h2>\r\n        <label class=\"fld\" data-scen=\"grating subwave\">Slits N <span class=\"v\" id=\"nSlitsV\">16<\/span>\r\n          <input type=\"range\" id=\"nSlits\" min=\"1\" max=\"64\" step=\"1\" value=\"16\">\r\n        <\/label>\r\n        <label class=\"fld\" data-scen=\"double grating subwave\">Slit spacing d <span class=\"v\" id=\"dSpaceV\">1.60 µm<\/span>\r\n          <input type=\"range\" id=\"dSpace\" min=\"0.3\" max=\"12\" step=\"0.05\" value=\"1.6\">\r\n        <\/label>\r\n        <label class=\"fld\">Slit width a <span class=\"v\" id=\"aWidthV\">0.60 µm<\/span>\r\n          <input type=\"range\" id=\"aWidth\" min=\"0.1\" max=\"6\" step=\"0.05\" value=\"0.6\">\r\n        <\/label>\r\n        <div class=\"hint\">Drag the aperture bar up/down to slide the slit stack. Slit width is\r\n        capped at 0.92 d — slits cannot overlap.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Light &amp; screen<\/h2>\r\n        <label class=\"fld\">Wavelength λ (vacuum) <span class=\"v\" id=\"lamV\">650 nm<\/span>\r\n          <input type=\"range\" id=\"lam\" min=\"380\" max=\"780\" step=\"1\" value=\"650\">\r\n        <\/label>\r\n        <label class=\"fld\">Screen distance L <span class=\"v\" id=\"LdistV\">1.00 m<\/span>\r\n          <input type=\"range\" id=\"Ldist\" min=\"0.2\" max=\"3\" step=\"0.05\" value=\"1\">\r\n        <\/label>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Detector<\/h2>\r\n        <label class=\"fld\">Angle θ <span class=\"v\" id=\"detV\">+23.9°<\/span>\r\n          <input type=\"range\" id=\"det\" min=\"-85\" max=\"85\" step=\"0.1\" value=\"23.9\">\r\n        <\/label>\r\n        <div class=\"hint\">Drag the green detector along the far‑field arc, or nudge it here.\r\n        It reads the order number, angle and relative power at that direction.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>View<\/h2>\r\n        <div class=\"btns\">\r\n          <button id=\"panL\">◂ Pan<\/button>\r\n          <button id=\"panR\">Pan ▸<\/button>\r\n          <button id=\"recenter\">⊙ Center<\/button>\r\n        <\/div>\r\n        <div class=\"hint\">Drag empty sky to pan · double‑click to recenter.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Overlays<\/h2>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oWav\" checked> Huygens wavelets<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oEnv\" checked> Single‑slit envelope<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oOrd\" checked> Analytic order directions<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oPh\" checked> Phasor chain at detector<\/label>\r\n      <\/div>\r\n    <\/aside>\r\n\r\n    <div id=\"stagewrap\">\r\n      <div id=\"stage\">\r\n        <canvas id=\"main2d\"><\/canvas>\r\n        <div id=\"inset3d\">\r\n          <span class=\"cap\">3D · plate, orders &amp; screen (schematic)<\/span>\r\n          <canvas id=\"c3d\"><\/canvas>\r\n        <\/div>\r\n        <div id=\"readouts\">\r\n          <h3>Live readout<\/h3>\r\n          <dl id=\"rdl\"><\/dl>\r\n        <\/div>\r\n      <\/div>\r\n      <div id=\"plots\">\r\n        <div class=\"plot\">\r\n          <span class=\"cap\">Screen · intensity vs position<\/span>\r\n          <canvas id=\"cScreen\"><\/canvas>\r\n        <\/div>\r\n        <div class=\"plot\">\r\n          <span class=\"cap\">Line width vs N — log–log<\/span>\r\n          <canvas id=\"cWidth\"><\/canvas>\r\n        <\/div>\r\n      <\/div>\r\n    <\/div>\r\n  <\/main>\r\n\r\n  <section id=\"explain\">\r\n    <div class=\"ex\">\r\n      <h4>Wavelets &amp; the pattern<\/h4>\r\n      <p>A plane wave hits the plate. Every open point of every slit becomes a <b>new circular\r\n      source<\/b> (Huygens) — that is all the picture draws. Far away, the wavelets arrive with a\r\n      path difference that depends on the angle, and add or cancel accordingly.<\/p>\r\n      <p data-scen=\"single\">Inside <b>one<\/b> slit of width <code>a<\/code>, wavelets from the top and bottom edges differ\r\n      by <code>a·sinθ<\/code>. When that equals one wavelength every wavelet finds a partner half a slit away\r\n      that cancels it — the first <b>dark null<\/b>, <code>a·sinθ = λ<\/code>. Between the nulls: one wide bright band.<\/p>\r\n      <p data-scen=\"double\">Wavelets from neighbouring slits arrive with a path difference <code>d·sinθ<\/code>.\r\n      Where it is a whole number of wavelengths they add: <code>d·sinθ = mλ<\/code>, a bright <b>fringe<\/b> of\r\n      order <code>m<\/code>. Where it is half a wavelength the two little arrows point opposite ways and you get darkness.<\/p>\r\n      <p data-scen=\"grating subwave\">Wavelets from neighbouring slits arrive with a path difference <code>d·sinθ<\/code>.\r\n      Where that difference is a whole number of wavelengths they add: <code>d·sinθ = mλ<\/code>,\r\n      a <b>principal maximum<\/b> of order <code>m<\/code>. Where the N little arrows close into a\r\n      ring, they cancel and you get darkness.<\/p>\r\n      <p>The bright directions are the <b>envelope<\/b> of the drawn wavelets — nothing asserts them.\r\n      Switch the dashed order rays off and they are still there.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>What the detector reads<\/h4>\r\n      <p>Nothing at all until the light gets there — the plane wave has to cross to the plate, and\r\n      the wavelets then have to cross to you. Watch the countdown, then the pattern lights up.<\/p>\r\n      <p data-scen=\"single\">Slide the detector and you trace the <b>screen curve<\/b> in the left plot: a single\r\n      broad central hump, dark nulls either side, and much weaker side‑lobes beyond them — nothing else.\r\n      Width of the hump is set by the slit width <code>a<\/code>: narrower slit ⇒ wider pattern.<\/p>\r\n      <p data-scen=\"double\">Slide the detector and you trace the <b>screen curve<\/b> in the left plot: evenly\r\n      spaced bright fringes with dark gaps between, all under a slowly sagging\r\n      <b>single‑slit envelope<\/b> set by the slit width <code>a<\/code>. The fringes are broad — two slits\r\n      cannot make them sharp.<\/p>\r\n      <p data-scen=\"grating\">Slide the detector and you trace the <b>screen curve<\/b> in the left plot: tall narrow\r\n      spikes at the orders, near‑black between them, all of it under a slowly sagging\r\n      <b>single‑slit envelope<\/b> set by the slit width <code>a<\/code>.<\/p>\r\n      <p data-scen=\"subwave\">Slide the detector and the <b>screen curve<\/b> is a single central spot — the\r\n      <code>m = 0<\/code> beam straight ahead — and nothing at any other angle. Drag the spacing back above\r\n      <code>λ<\/code> and the missing orders switch on at the edge of the plot.<\/p>\r\n      <p>Power is printed as a <b>percentage of the centre<\/b>. In a null the reading is 0.0 %, not\r\n      a small peak — the wavelets really do cancel.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"single\">\r\n      <h4>Narrower slit ⇒ wider pattern<\/h4>\r\n      <p>This is diffraction in its purest form: squeeze the light through a smaller gap and it spreads\r\n      <b>more<\/b>. The central band is bounded by <code>sinθ = ±λ/a<\/code>, so halving <code>a<\/code> doubles its width.<\/p>\r\n      <p>Make the slit narrower than the wavelength and there is <b>no null at all<\/b> — the wavelets from one\r\n      edge can never fall half a wave behind the other, and the light fans out across the whole half‑plane.<\/p>\r\n      <p>Everything else in this collection — double slits, gratings — is this pattern multiplied by something.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"double\">\r\n      <h4>Two slits ⇒ fringes<\/h4>\r\n      <p>Fringes sit at <code>d·sinθ = mλ<\/code>, so their angular spacing is about <code>λ/d<\/code>:\r\n      widen the gap and they crowd together; use shorter light and they do too.<\/p>\r\n      <p>With only two wavelets the fringes are <b>broad<\/b> — soft cosine humps, not lines. That is\r\n      the lesson of the next tab — add slits and watch each fringe sharpen to a line.<\/p>\r\n      <p>The envelope of the fringes is the single‑slit curve from tab 1: the pattern is the product of\r\n      “two sources” and “one slit of width <code>a<\/code>”.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"grating subwave\">\r\n      <h4>More slits ⇒ sharper<\/h4>\r\n      <p>Adding slits does not just brighten the lines, it <b>narrows<\/b> them. Each principal\r\n      maximum has angular full width <code>≈ 0.886 λ/(N d cosθ)<\/code> — double N, halve the width.\r\n      Sweep the N slider and watch the right plot slide down its <code>1/N<\/code> slope.<\/p>\r\n      <p data-scen=\"grating\">That is why a grating is a spectrometer: two wavelengths <code>λ<\/code> and\r\n      <code>λ+Δλ<\/code> separate when <code>R = λ/Δλ = mN<\/code>. The <b>sodium D doublet<\/b> at\r\n      <b>589.0 / 589.6 nm<\/b> needs <code>R ≈ 982<\/code>, so <b>N ≳ 1000<\/b> illuminated lines at\r\n      m = 1 — a double slit can never do it, however bright.<\/p>\r\n      <p data-scen=\"subwave\">Even here, more slits still sharpen the one beam that survives — the\r\n      <code>m = 0<\/code> spot straight ahead — but there is no <code>m = 1<\/code> to disperse colours, so no spectrometer.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"single double grating\">\r\n      <h4>How many orders fit<\/h4>\r\n      <p>An order only exists if <code>|mλ/d| &lt; 1<\/code> — you cannot bend light past 90°. So the\r\n      pattern has about <code>d/λ<\/code> orders on each side: <b>more spacing ⇒ more orders, closer together<\/b>;\r\n      a spacing near one wavelength throws a single pair of orders almost to the horizon.<\/p>\r\n      <p data-scen=\"single\">A single slit has no spacing <code>d<\/code>, so it has no orders — only its own\r\n      nulls at <code>a·sinθ = mλ<\/code>. Switch to tab 2 to see orders appear.<\/p>\r\n      <p data-scen=\"grating\">A <b>CD<\/b> has a track pitch of <b>1.6 µm<\/b>, so red light at 650 nm leaves it at\r\n      <code>asin(0.65/1.6) ≈ 23.9°<\/code> — that is the rainbow you see on the disc. A DVD's 0.74 µm\r\n      pitch throws red past 61°.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"subwave\">\r\n      <h4>When the orders vanish<\/h4>\r\n      <p>An order only exists if <code>|mλ/d| &lt; 1<\/code> — you cannot bend light past 90°. Squeeze\r\n      the spacing below one wavelength and every order but <code>m = 0<\/code> is gone: the light goes\r\n      straight through, and the structure survives only as <b>evanescent<\/b> near‑field. That is the\r\n      whole idea behind wire‑grid polarisers and metasurfaces.<\/p>\r\n      <p>A <b>CD<\/b>’s 1.6 µm pitch is comfortably above red light, so it still diffracts. Shrink the\r\n      pitch to 0.4 µm (this tab) and the rainbow would be gone.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>Reading the units<\/h4>\r\n      <p><b>Nanometres (nm) — wavelength.<\/b> Visible light runs 380 nm (violet) to 780 nm (deep\r\n      red). A <b>human hair<\/b> is about 70 000 nm thick, so ~100 wavelengths of red fit across one.<\/p>\r\n      <p><b>Micrometres (µm) — slit spacing and width.<\/b> 1 µm = 1000 nm. A <b>CD<\/b> track pitch is\r\n      1.6 µm; a good ruled grating is 1200 lines/mm, i.e. <code>d = 0.83 µm<\/code>.<\/p>\r\n      <p><b>Degrees — diffraction angle.<\/b> <b>1°<\/b> is roughly a fingertip held at arm's length; the\r\n      full Moon is half a degree. A grating line 0.3° wide is a fifth of a Moon.<\/p>\r\n      <p><b>Per cent — relative power.<\/b> 100 % is the centre of the pattern; 10 % is a tenth as\r\n      bright, still obvious to the eye; 0.1 % looks black beside it.<\/p>\r\n      <p class=\"cav\">Model caveats: scalar Fraunhofer (far‑field) diffraction from an ideal\r\n      monochromatic plane wave at normal incidence. No polarisation, no obliquity factor, no\r\n      finite‑source or slit‑thickness effects; the stage is drawn at micrometre scale and the screen\r\n      distance is compressed. Treat side‑lobe levels as estimates, ±.<\/p>\r\n\r\n    <\/div>\r\n  <\/section>\r\n<\/div>\r\n\r\n<script>\r\n\"use strict\";\r\n/* ============================================================ constants */\r\nconst C_VAC = 299792458;            // m/s\r\nconst C_UMFS = 0.299792458;         // µm per femtosecond — the stage works in µm and fs\r\nconst NM_PER_UM = 1000;\r\nconst PA_HAIR_UM = 70;              // a human hair, µm (used only in prose)\r\nconst P_CAP = 6000;                 // hard cap on aperture strip-sources (never blow up)\r\nconst WF_CAP = 240;                 // FIFO cap on emitted wavelet ages\r\nconst CD_PITCH_UM = 1.6;            // CD track pitch — the calibration anchor\r\nconst NA_D1 = 589.0, NA_D2 = 589.6; // sodium doublet, nm\r\n\r\n/* ============================================================ medium model\r\n * Air, not vacuum. Edlén's (1966) dispersion formula for standard air\r\n * (15 °C, 101.325 kPa, 0.03 % CO2), σ = 1/λ in µm^-1:\r\n *   (n-1)·1e8 = 8342.13 + 2406030/(130-σ²) + 15997/(38.9-σ²)\r\n * Datum: n(589 nm) = 1.000277 — the textbook refractive index of air.\r\n * Everything downstream uses the wavelength IN THE MEDIUM, λ_air = λ_vac/n.        */\r\nfunction airN(lamUmVac){\r\n  const s2 = 1/Math.max(lamUmVac*lamUmVac, 1e-6);\r\n  const n = 1 + 1e-8*(8342.13 + 2406030/Math.max(130-s2,1) + 15997/Math.max(38.9-s2,1));\r\n  return (isFinite(n) && n>1 && n<1.01) ? n : 1.000277;\r\n}\r\n\r\n/* ============================================================ helpers */\r\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\r\nconst lerp=(a,b,t)=>a+(b-a)*t;\r\nconst smooth=t=>t*t*t*(t*(t*6-15)+10);\r\nfunction keyf(pairs,x){\r\n  if(x<=pairs[0][0])return pairs[0][1];\r\n  for(let i=1;i<pairs.length;i++){\r\n    if(x<=pairs[i][0]){\r\n      const[x0,y0]=pairs[i-1],[x1,y1]=pairs[i];\r\n      return lerp(y0,y1,(x-x0)/(x1-x0));\r\n    }\r\n  }\r\n  return pairs[pairs.length-1][1];\r\n}\r\nfunction rot(x,y,ang){const c=Math.cos(ang),s=Math.sin(ang);return[x*c-y*s,x*s+y*c];}\r\nconst sinc=x=>Math.abs(x)<1e-9?1:Math.sin(x)/x;\r\nconst deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;\r\nconst asinC=x=>Math.asin(clamp(x,-1,1));\r\n\r\n/* ============================================================ scenarios */\r\nconst SCEN={\r\n  single:  {name:'Single slit',       def:{nSlits:1,  dSpace:4.0, aWidth:2.0,  lam:633, Ldist:1.0, det:0,    rate:1}},\r\n  double:  {name:'Double slit',       def:{nSlits:2,  dSpace:6.0, aWidth:1.4,  lam:633, Ldist:1.5, det:6.1,  rate:1}},\r\n  grating: {name:'Grating (N lines)', def:{nSlits:16, dSpace:1.6, aWidth:0.6,  lam:650, Ldist:0.5, det:23.9, rate:1}},\r\n  subwave: {name:'Sub-wavelength',    def:{nSlits:8,  dSpace:0.40,aWidth:0.20, lam:650, Ldist:1.0, det:0,    rate:1}},\r\n};\r\n\r\n/* ============================================================ state */\r\nconst S={\r\n  scen:'grating', playing:false, t:0, rate:1,\r\n  // controls\r\n  nSlits:16, dSpace:1.6, aWidth:0.6, lam:650, Ldist:1.0, det:23.9,\r\n  ov:{wav:true, env:true, ord:true, ph:true},\r\n  w:{front:0, cycles:0},        // plane-wave kinematic state\r\n  wf:[], lastEmit:-1,           // emission times (fs) of the Huygens wavelets — FIFO\r\n  yOff:0,                       // world y of the slit stack centre (draggable)\r\n  pan:0,                        // user camera pan, µm\r\n  res:null,                     // computed detector result\r\n  // transient caches (aperture-only quantities; cleared by reparam())\r\n  _peak:null, _curve:null, _widths:null, _der:null, _scr:null, _holdBase:null, _detUserMoved:false,\r\n};\r\n\r\n/* ============================================================ derived quantities */\r\nconst lamVacUm = ()=>S.lam/NM_PER_UM;\r\nconst lamUm    = ()=>lamVacUm()/airN(lamVacUm());        // wavelength in air — what diffracts\r\nconst cMed     = ()=>C_UMFS/airN(lamVacUm());            // µm/fs in air\r\nconst aEff     = ()=>Math.min(S.aWidth, 0.92*S.dSpace);  // slits may not overlap\r\nconst dEff     = ()=>Math.max(S.dSpace, 1e-3);\r\nconst period   = ()=>lamUm()/cMed();                     // optical period, fs\r\n// vertical world span of the stage: enough to show the lit part of the stack\r\nfunction curVmax(){\r\n  const stack = S.nSlits*dEff();\r\n  return clamp(Math.max(stack*1.25, 14*lamUm()), 8, 46);   // µm\r\n}\r\nconst X0   = ()=>0.55*curVmax();     // where the plane wave starts, µm left of the plate\r\nconst RFF  = ()=>0.45*curVmax();     // radius of the drawn far-field arc, µm\r\nconst tAp  = ()=>X0()/cMed();                       // plane wave reaches the plate\r\nconst tReady=()=>tAp()+RFF()/cMed();                // first wavelets reach the far-field arc\r\n// total meaningful timeline: light to the plate, light to the arc, then 60 optical cycles\r\n// of steady illumination so the interference pattern is fully established on screen\r\nfunction simDuration(){ return tReady() + 60*period(); }\r\n\r\n/* ---- the aperture, as an explicit list of strip sources -------------------\r\n * The honest primitive: ONE PHASOR PER APERTURE STRIP. Each slit is cut into P\r\n * equal strips; the far field is the sum of their phasors. P is picked so the\r\n * strip sum sits within ~0.3 % of the continuous integral over the whole pattern.  */\r\nfunction srcFor(N, d, a){\r\n  let P = clamp(Math.round(24*a/Math.max(lamUm(),1e-6))+8, 12, 96);\r\n  while(N*P > P_CAP && P > 12) P = Math.max(12, P>>1);\r\n  const out = new Float64Array(N*P);\r\n  let k=0;\r\n  for(let j=0;j<N;j++){\r\n    const yc = (j-(N-1)/2)*d;\r\n    for(let p=0;p<P;p++) out[k++] = yc + (p+0.5-P/2)*(a/P);\r\n  }\r\n  return out;\r\n}\r\nlet SRC = srcFor(16,1.6,0.6);\r\nfunction rebuildSources(){ SRC = srcFor(S.nSlits, dEff(), aEff()); }\r\n\r\n/* THE KERNEL — far-field intensity as the squared magnitude of a phasor sum over the\r\n * aperture, normalised so I(0) = 1. Live physics, the plots, the peak finder and the\r\n * up-front prediction all call THIS one function, so they cannot drift apart.        */\r\nfunction fieldWith(strips, th){\r\n  const n = strips.length;\r\n  if(!n) return 0;\r\n  const q = 2*Math.PI/Math.max(lamUm(),1e-9)*Math.sin(th);\r\n  let re=0, im=0;\r\n  for(let i=0;i<n;i++){ const ph=q*strips[i]; re+=Math.cos(ph); im+=Math.sin(ph); }\r\n  const I=(re*re+im*im)/(n*n);\r\n  return isFinite(I)?clamp(I,0,1.0000001):0;\r\n}\r\nconst fieldI = th => fieldWith(SRC, th);\r\n// the analytic law, used ONLY as the dashed secondary overlay and for the envelope\r\nconst envelopeI = th => Math.pow(sinc(Math.PI*aEff()*Math.sin(th)/lamUm()), 2);\r\nfunction gratingI(th, N){\r\n  const phi = 2*Math.PI*dEff()*Math.sin(th)/lamUm();\r\n  const s = Math.sin(phi/2);\r\n  if(Math.abs(s) < 1e-9) return 1;\r\n  return Math.pow(Math.sin(N*phi/2)/(N*s), 2);\r\n}\r\nconst analyticI = th => gratingI(th, S.nSlits)*envelopeI(th);\r\n/* Deliberate harness hook — one namespaced object, and the only thing this file puts on\r\n * `window`. It exposes the emergent kernel and the raw time state so an external checker can\r\n * compare against its OWN reimplementation of the law rather than against the viz's analytic\r\n * overlay, which would be circular. Nothing in the page itself reads it.                   */\r\nwindow.__vpz = {\r\n  I:      thDeg => fieldI(rad(thDeg)),\r\n  params: () => ({N:S.nSlits, d:dEff(), a:aEff(), lamVac:S.lam, lamMed:lamUm(), L:S.Ldist,\r\n                  tAp:tAp(), period:period(), tReady:tReady(), duration:simDuration(), settle:SETTLE}),\r\n  state:  () => ({t:S.t, wf:S.wf.length, arrived:arrivedCount(),\r\n                  ready:!!(S.res&&S.res.ready), ramp:S.res?S.res.ramp:0, I:S.res?S.res.I:0}),\r\n};\r\n\r\n/* ---- orders -------------------------------------------------------------\r\n * The grating equation gives the CANDIDATE directions; a candidate only counts as an order\r\n * if the emergent curve really peaks there. Two things kill one: the single-slit envelope\r\n * putting a zero on it — a \"missing order\", which takes out every even order when a = d/2 —\r\n * and grazing, past ~85°, where nothing usable leaves the plate. `orderList` is the single\r\n * source of truth: the visible count, the stage rays, the 3-D inset and every order-angle\r\n * readout are all filtered through it, so they cannot contradict each other.              */\r\nconst GRAZE = Math.sin(rad(85));\r\nconst EXTINCT = 1e-6;                        // relative intensity below which an order is gone\r\nconst orderAngle = m => (Math.abs(m*lamUm()/dEff())<1 ? asinC(m*lamUm()/dEff()) : null);\r\nfunction orderList(){\r\n  const out=[];\r\n  if(S.nSlits<2) return out;\r\n  const L=lamUm(), d=dEff(), N=S.nSlits;\r\n  const mMax = Math.floor(d/L - 1e-9);\r\n  for(let m=-mMax;m<=mMax;m++){\r\n    const s=m*L/d;\r\n    if(Math.abs(s) >= GRAZE) continue;                    // grazing — not a usable order\r\n    const th=Math.asin(s), I=fieldI(th);\r\n    if(m!==0 && I<EXTINCT) continue;                      // missing order: an envelope zero sits here\r\n    // confirm the sampled pattern actually peaks here: step a third of the way to the first\r\n    // null on each side and require the centre to beat both shoulders\r\n    const w=0.35*L/(N*d);\r\n    if(m!==0 && !(I>fieldI(Math.asin(clamp(s-w,-1,1))) && I>fieldI(Math.asin(clamp(s+w,-1,1))))) continue;\r\n    out.push({m, th, I});\r\n  }\r\n  return out;\r\n}\r\n// Does order m survive at all?  'ok' · 'extinct' (envelope zero) · 'none' (|mλ/d| ≥ 1,\r\n// grazing, or no periodic structure to make orders with).\r\nfunction orderState(m, ords){\r\n  if(S.nSlits<2) return 'none';\r\n  const s=m*lamUm()/dEff();\r\n  if(Math.abs(s) >= GRAZE) return 'none';\r\n  return ords.some(o=>o.m===m) ? 'ok' : 'extinct';\r\n}\r\n// find the true maximum of the EMERGENT curve near order m: coarse scan of the main\r\n// lobe, then a golden-section refine. (The single-slit envelope pulls the peak a few\r\n// hundredths of a degree off d·sinθ = mλ — that pull is real, and it is what you see.)\r\n// Callers must check orderState first: with no order there, this search happily returns a\r\n// shoulder of the envelope, which is a number for a maximum that does not exist.\r\nfunction measuredOrderAngle(m){\r\n  const th0=orderAngle(m); if(th0===null || S.nSlits<2) return null;\r\n  const s0=Math.sin(th0), L=lamUm(), d=dEff(), N=S.nSlits;\r\n  const win=Math.min(3*L/(N*d), 0.4*L/d);\r\n  let lo=clamp(s0-win,-0.999,0.999), hi=clamp(s0+win,-0.999,0.999);\r\n  let bs=s0, bI=-1;\r\n  for(let i=0;i<=60;i++){\r\n    const s=lo+(hi-lo)*i/60, I=fieldI(Math.asin(s));\r\n    if(I>bI){ bI=I; bs=s; }\r\n  }\r\n  const step=(hi-lo)/60;\r\n  let a=Math.max(lo,bs-step), b=Math.min(hi,bs+step);\r\n  const gr=0.6180339887;\r\n  let c1=b-gr*(b-a), c2=a+gr*(b-a);\r\n  let f1=fieldI(Math.asin(c1)), f2=fieldI(Math.asin(c2));\r\n  for(let i=0;i<60;i++){\r\n    if(f1<f2){ a=c1; c1=c2; f1=f2; c2=a+gr*(b-a); f2=fieldI(Math.asin(c2)); }\r\n    else     { b=c2; c2=c1; f2=f1; c1=b-gr*(b-a); f1=fieldI(Math.asin(c1)); }\r\n  }\r\n  return Math.asin(clamp((a+b)/2,-1,1));\r\n}\r\n// angular FWHM of the central principal maximum, measured on the emergent curve.\r\n// Bisection is exact here: on [0, first null] the curve falls monotonically from 1.\r\nfunction fwhmRadWith(src, N){\r\n  const L=lamUm(), d=dEff(), a=aEff();\r\n  // brackets: the grating's first null (λ/Nd) and a point safely past the envelope's own\r\n  // half-maximum (which sits at 0.443 λ/a, its first null at λ/a — 0.75 lies between)\r\n  const hiG = N>1 ? asinC(clamp(L/(N*d),0,0.95)) : Math.PI/2;\r\n  const hiE = asinC(clamp(0.75*L/Math.max(a,1e-6),0,0.95));\r\n  let hi = Math.min(hiG, hiE, rad(85));\r\n  if(!(hi>0)) return NaN;\r\n  if(fieldWith(src,hi) > 0.5) return NaN;          // no half-max inside the visible range\r\n  let lo=0;\r\n  for(let i=0;i<60;i++){\r\n    const mid=(lo+hi)/2;\r\n    if(fieldWith(src,mid) > 0.5) lo=mid; else hi=mid;\r\n  }\r\n  return 2*(lo+hi)/2;\r\n}\r\nconst fwhmRad = ()=>fwhmRadWith(SRC, S.nSlits);\r\n// classic peak-to-first-null half width, λ/(N d cosθ) — printed beside the true FWHM\r\nfunction nullHalfRad(){\r\n  if(S.nSlits<2) return NaN;\r\n  const x=lamUm()/(S.nSlits*dEff());\r\n  return x<1 ? asinC(x) : NaN;\r\n}\r\n\r\n/* Predict, up front and from the parameters alone, how many orders exist, where the\r\n * outermost one lands, and which order is brightest — before any light has arrived.\r\n * Reuses the same kernel (fieldI) as the live physics.                              */\r\nfunction peakImpact(ords){\r\n  if(!ords.length){\r\n    const w=fwhmRad();\r\n    return {n:0, outer:null, best:null, where: S.nSlits<2 ? 'single slit — one broad lobe, no orders'\r\n                                                          : 'no orders: d < λ, only m = 0 survives',\r\n            fwhm:w};\r\n  }\r\n  let best=ords.find(o=>o.m===0)||ords[0], outer=ords[0];\r\n  for(const o of ords){\r\n    if(o.I>best.I) best=o;\r\n    if(Math.abs(o.th)>Math.abs(outer.th)) outer=o;\r\n  }\r\n  return {n:ords.length, outer, best, fwhm:fwhmRad(),\r\n    where:`${ords.length} order${ords.length===1?'':'s'} · outermost m = ${outer.m>0?'+':''}${outer.m} at ≈ ${deg(outer.th).toFixed(1)}°`};\r\n}\r\n\r\n/* ---- caches -------------------------------------------------------------\r\n * Everything here depends on the APERTURE alone (N, d, a, λ) — never on the clock or\r\n * on where the detector sits — so it is computed once per parameter change and reused\r\n * by the readout, both plots and the stage. reparam() clears it.                     */\r\nfunction derived(){\r\n  if(S._der) return S._der;\r\n  const ords=orderList();\r\n  // an order-angle readout is a {state, th} pair, never a bare number: a direction is only\r\n  // reported for an order that is actually there\r\n  const ordRow = m => {\r\n    const st=orderState(m, ords);\r\n    return st==='ok' ? {state:'ok', th:measuredOrderAngle(m)} : {state:st, th:null};\r\n  };\r\n  S._der={\r\n    orders: ords,\r\n    fwhm: fwhmRad(),\r\n    nullHalf: nullHalfRad(),\r\n    ord1: ordRow(1),\r\n    ord2: ordRow(2),\r\n    peak: peakImpact(ords),\r\n  };\r\n  return S._der;\r\n}\r\n// The drawn pattern is sampled uniformly in sinθ — the natural variable, in which every\r\n// principal maximum has the same width — then interpolated. Sampling is fine enough that\r\n// the drawn lobes are the computed pattern, not a smoothed cartoon.\r\nconst CURVE_N=1600;\r\nfunction curve(){\r\n  if(S._curve) return S._curve;\r\n  const arr=new Float64Array(CURVE_N+1);\r\n  for(let i=0;i<=CURVE_N;i++) arr[i]=fieldWith(SRC, Math.asin(clamp(-1+2*i/CURVE_N,-1,1)));\r\n  S._curve=arr;\r\n  return arr;\r\n}\r\nfunction curveI(th){\r\n  const a=curve();\r\n  const x=clamp((Math.sin(th)+1)/2,0,1)*CURVE_N;\r\n  const i=Math.min(Math.floor(x),CURVE_N-1), f=x-i;\r\n  return a[i]*(1-f)+a[i+1]*f;\r\n}\r\n\r\n/* ---- how wide an angular slice the plots show ---------------------------\r\n * Wide enough for every order that carries light, but never wider than the point where\r\n * the single-slit envelope has fallen to ~1 % (sinθ = 1.43 λ/a) — past there the screen\r\n * is black and the fringes would just alias.                                           */\r\nfunction viewTheta(){\r\n  const D=derived(), ords=D.orders, w=D.fwhm||rad(6);\r\n  let th = ords.length>1 ? Math.max(1.35*Math.abs(ords[ords.length-1].th), 1.6*w) : 2.6*w;\r\n  const env = asinC(clamp(1.43*lamUm()/Math.max(aEff(),1e-6), 0.05, 0.999));\r\n  th = Math.min(th, env);\r\n  if(!isFinite(th)||th<=0) th=rad(20);\r\n  return clamp(th, rad(4), rad(78));\r\n}\r\n/* the lived signal, sampled on the EXACT kernel across the screen the detector sweeps.\r\n   Cached: it changes only with the aperture, the wavelength or the screen distance.   */\r\nconst SCR_N=720;\r\nfunction screenCurve(){\r\n  if(S._scr) return S._scr;\r\n  const thV=viewTheta(), yMax=S.Ldist*Math.tan(thV), arr=new Float64Array(SCR_N+1);\r\n  for(let i=0;i<=SCR_N;i++){\r\n    const yy=-yMax+2*yMax*i/SCR_N;\r\n    arr[i]=fieldI(Math.atan2(yy,S.Ldist));\r\n  }\r\n  S._scr={yMax, I:arr};\r\n  return S._scr;\r\n}\r\n\r\n/* ============================================================ reset */\r\nfunction resetSim(keepDet){\r\n  S.t=0; S.wf.length=0; S.lastEmit=-1; S.playing=false; S.pan=0;\r\n  S._holdBase=null; S._curve=null; S._widths=null; S._der=null; S._scr=null;\r\n  if(!keepDet) S._detUserMoved=false;\r\n  S.w={front:-X0(), cycles:0};\r\n  S.res=null;\r\n  rebuildSources();\r\n  playBtn.textContent='▶ Play';\r\n  syncProg();\r\n  draw();\r\n}\r\n\r\n/* ============================================================ wave update */\r\n// the illumination is a plane wave marching right at the speed of light in air\r\nfunction stepWave(dt){\r\n  S.w.front = -X0() + cMed()*S.t;\r\n  S.w.cycles = S.t/Math.max(period(),1e-9);\r\n}\r\n/* ============================================================ emission\r\n * Each slit re-radiates a fresh circular wavelet once per optical period, starting the\r\n * instant the plane wave lands on the plate. The schedule is a pure function of t, so\r\n * scrubbing rebuilds exactly what playing would have produced.                        */\r\nfunction emit(){\r\n  const T=period(), t0=tAp();\r\n  if(S.t < t0) return;\r\n  if(S.lastEmit < t0-1e-9){ S.lastEmit=t0; S.wf.push(t0); }\r\n  let guard=0;\r\n  while(S.t-S.lastEmit >= T-1e-9 && guard++ < 4000){ S.lastEmit+=T; S.wf.push(S.lastEmit); }\r\n  if(S.wf.length>WF_CAP) S.wf.splice(0, S.wf.length-WF_CAP);\r\n}\r\n/* How many of the emitted wavelets have actually expanded out to the detector's arc. This\r\n * is a scan of the wavefront ARRAY, not a formula in t: an empty or half-replayed array\r\n * cannot produce a reading, which is what makes scrub-equals-play a real constraint rather\r\n * than an identity. SETTLE full cycles have to land before the interference is established. */\r\nconst SETTLE=16;\r\nfunction arrivedCount(){\r\n  const rff=RFF(), c=cMed();\r\n  let n=0;\r\n  for(const u of S.wf) if(c*(S.t-u) >= rff) n++;\r\n  return n;\r\n}\r\n\r\n/* ============================================================ the detector (kernel consumer)\r\n * Returns one plain result object R, consumed by the readout and both plots. It\r\n * distinguishes named states — \"dark\" (light has not reached the plate), \"incoming\"\r\n * (wavelets in flight, with a countdown), \"settling\", \"reading\" — and never invents a\r\n * power for a pattern that has not arrived.                                            */\r\nfunction computeDetector(){\r\n  const th=rad(S.det), D=derived();\r\n  const arrival = tAp() + RFF()/cMed();             // when the first wavelet crosses the arc\r\n  const R={\r\n    scenName:SCEN[S.scen].name, th, thDeg:S.det,\r\n    N:S.nSlits, d:dEff(), a:aEff(), lamVac:S.lam, lamMed:lamUm(), n:airN(lamVacUm()),\r\n    status:'', ready:false, ramp:0, I:0, mFrac:0, mNear:0, onPeak:false, onNull:false,\r\n    screenY:0, countdown:null, orders:D.orders, fwhm:D.fwhm, nullHalf:D.nullHalf,\r\n    ord1:D.ord1, ord2:D.ord2,\r\n    cycles:S.w.cycles, arrival, arrived:0, settle:SETTLE,\r\n  };\r\n  R.mFrac = dEff()*Math.sin(th)/lamUm();            // path difference in wavelengths\r\n  R.mNear = Math.round(R.mFrac);\r\n  R.screenY = S.Ldist*Math.tan(th);                 // metres on a flat screen at distance L\r\n  R.arrived = arrivedCount();\r\n  if(!S.wf.length || S.t < tAp()){\r\n    R.status='dark — the wave has not reached the plate';\r\n    R.countdown=Math.max(tAp()-S.t, 0);\r\n    return R;\r\n  }\r\n  if(R.arrived === 0){\r\n    // wavelets exist but none has crossed the arc yet — countdown for the oldest one\r\n    R.status='incoming';\r\n    R.countdown=Math.max((RFF()-cMed()*(S.t-S.wf[0]))/cMed(), 0);\r\n    return R;\r\n  }\r\n  // the interference builds as successive wavefronts land: the reading is a function of how\r\n  // much of the replayed wavelet train has actually got here\r\n  R.ramp = clamp(R.arrived/SETTLE, 0, 1);\r\n  R.ready = true;\r\n  R.Ifull = fieldI(th);                             // the settled far-field value\r\n  R.I = R.Ifull*R.ramp;                             // what is on the detector right now\r\n  R.onPeak = S.nSlits>1 && Math.abs(R.mFrac-R.mNear)<0.06 && R.Ifull>0.02;\r\n  R.onNull = R.Ifull < 1e-4;\r\n  R.status = R.ramp<1 ? 'settling — interference building' : 'reading';\r\n  return R;\r\n}\r\n\r\n/* ============================================================ canvases */\r\nconst main2d=document.getElementById('main2d'), g2=main2d.getContext('2d');\r\nconst c3d=document.getElementById('c3d'), g3=c3d.getContext('2d');\r\nconst cS=document.getElementById('cScreen'), gS=cS.getContext('2d');\r\nconst cWd=document.getElementById('cWidth'), gW=cWd.getContext('2d');\r\nlet DPR=1, W=0,H=0, W3=0,H3=0, WS=0,HS=0, WW=0,HW=0;\r\nfunction fit(cv,ctx){\r\n  DPR=Math.min(window.devicePixelRatio||1,2);\r\n  const r=cv.getBoundingClientRect();\r\n  cv.width=Math.max(1,Math.round(r.width*DPR));\r\n  cv.height=Math.max(1,Math.round(r.height*DPR));\r\n  ctx.setTransform(DPR,0,0,DPR,0,0);\r\n  return [r.width,r.height];\r\n}\r\nfunction resize(){\r\n  [W,H]=fit(main2d,g2);\r\n  [W3,H3]=fit(c3d,g3);\r\n  [WS,HS]=fit(cS,gS);\r\n  [WW,HW]=fit(cWd,gW);\r\n  draw();\r\n}\r\nwindow.addEventListener('resize',resize);\r\n\r\n/* ---- world <-> screen for the 2D stage (isotropic so angles are true) ----\r\n * World units are micrometres; x runs downstream, y is transverse. sx and sy share\r\n * one scale, so a diffraction angle drawn on the stage IS the real angle.         */\r\nlet cam={s:1,x0:0,vmax:20};\r\nfunction updateCam(){\r\n  cam.vmax=curVmax();\r\n  cam.s=H/cam.vmax;                       // px per µm\r\n  const wpp=W/cam.s;\r\n  const R=S.res;\r\n  let frac;\r\n  if(R && R.ready){\r\n    // freeze the framing the moment the pattern lands, so the wavelets visibly expand\r\n    if(S._holdBase==null) S._holdBase = -0.30*wpp;\r\n    cam.x0 = S._holdBase + S.pan;\r\n  }else{\r\n    S._holdBase=null;\r\n    // glide: start wide enough to see the incoming wave, ease in as it reaches the plate\r\n    const k = clamp(S.t/Math.max(tAp(),1e-6), 0, 1);\r\n    frac = lerp(0.46, 0.30, smooth(k));\r\n    cam.x0 = -frac*wpp + S.pan;\r\n  }\r\n  cam.yMid=H/2;\r\n}\r\nconst sx=wx=>(wx-cam.x0)*cam.s;\r\nconst sy=wy=>cam.yMid-wy*cam.s;\r\nfunction cssMono(){return getComputedStyle(document.body).getPropertyValue('--mono');}\r\n\r\n/* ============================================================ 2D DRAW */\r\nfunction draw(){\r\n  updateCam();\r\n  S._peak = derived().peak;     // predicted orders + brightest order, from parameters alone\r\n  const R=S.res;\r\n\r\n  const grd=g2.createLinearGradient(0,0,0,H);\r\n  grd.addColorStop(0,'#080d18'); grd.addColorStop(0.55,'#06090f'); grd.addColorStop(1,'#04060b');\r\n  g2.fillStyle=grd; g2.fillRect(0,0,W,H);\r\n\r\n  drawAngleGrid();\r\n  drawPlaneWave();\r\n  if(S.ov.wav) drawWavelets();          // the construction, drawn first and faint...\r\n  if(R && R.ready) drawLobes(R);        // ...and its emergent envelope on top\r\n  if(S.ov.env) drawEnvelope();\r\n  if(S.ov.ord) drawOrderRays();\r\n  drawAperture();\r\n  drawDetector(R);\r\n  if(S.ov.ph) drawPhasors(R);\r\n  drawStageLabels(R);\r\n\r\n  drawInset3D();\r\n  drawScreenPlot();\r\n  drawWidthPlot();\r\n  updateReadouts();\r\n}\r\n\r\n/* faint polar scaffolding: the far-field arc and its degree ticks */\r\nfunction drawAngleGrid(){\r\n  const cx=sx(0), cy=sy(S.yOff), r=RFF()*cam.s;\r\n  g2.strokeStyle='rgba(120,150,190,.16)'; g2.lineWidth=1;\r\n  g2.beginPath(); g2.arc(cx,cy,r,-Math.PI/2,Math.PI/2); g2.stroke();\r\n  g2.font='9px '+cssMono(); g2.fillStyle='rgba(150,170,200,.42)';\r\n  for(let a=-80;a<=80;a+=10){\r\n    const th=rad(a), x=cx+Math.cos(th)*r, y=cy-Math.sin(th)*r;\r\n    const x2=cx+Math.cos(th)*(r-6), y2=cy-Math.sin(th)*(r-6);\r\n    g2.strokeStyle='rgba(120,150,190,.16)';\r\n    g2.beginPath(); g2.moveTo(x2,y2); g2.lineTo(x,y); g2.stroke();\r\n    if(a%20===0 && x<W-30) g2.fillText((a>0?'+':'')+a+'°', x+4, y+3);\r\n  }\r\n  g2.fillStyle='rgba(150,170,200,.32)';\r\n  g2.fillText('FAR‑FIELD ARC — angles true, distance compressed (schematic radius)', 196, H-14);\r\n}\r\n\r\n/* the phenomenon: the intensity lobes, drawn straight from the phasor sum */\r\nfunction drawLobes(R){\r\n  const cx=sx(0), cy=sy(S.yOff), r=RFF()*cam.s, amp=R.ramp;\r\n  const NS=240, tv=Math.PI/2*0.97;\r\n  // soft directional fan — brightness is the emergent intensity in that direction\r\n  for(let i=0;i<=NS;i++){\r\n    const th=-tv+2*tv*i/NS, I=curveI(th);\r\n    const al=clamp(Math.pow(I,0.42)*0.55*amp, 0, 0.6);\r\n    if(al<0.015) continue;\r\n    g2.strokeStyle=`rgba(251,191,36,${al})`; g2.lineWidth=1.2;\r\n    g2.beginPath(); g2.moveTo(cx,cy);\r\n    g2.lineTo(cx+Math.cos(th)*r, cy-Math.sin(th)*r);\r\n    g2.stroke();\r\n  }\r\n  // crisp lobe outline: radius ∝ √I, so the drawn shape is the pattern itself\r\n  g2.strokeStyle=`rgba(251,191,36,${0.95*amp})`; g2.lineWidth=1.8;\r\n  g2.beginPath();\r\n  for(let i=0;i<=480;i++){\r\n    const th=-tv+2*tv*i/480, rr=r*Math.sqrt(curveI(th));\r\n    const x=cx+Math.cos(th)*rr, y=cy-Math.sin(th)*rr;\r\n    i?g2.lineTo(x,y):g2.moveTo(x,y);\r\n  }\r\n  g2.stroke();\r\n}\r\nfunction drawEnvelope(){\r\n  const cx=sx(0), cy=sy(S.yOff), r=RFF()*cam.s, tv=Math.PI/2*0.97;\r\n  g2.strokeStyle='rgba(120,150,190,.45)'; g2.setLineDash([4,4]); g2.lineWidth=1;\r\n  g2.beginPath();\r\n  for(let i=0;i<=200;i++){\r\n    const th=-tv+2*tv*i/200, rr=r*Math.sqrt(envelopeI(th));\r\n    const x=cx+Math.cos(th)*rr, y=cy-Math.sin(th)*rr;\r\n    i?g2.lineTo(x,y):g2.moveTo(x,y);\r\n  }\r\n  g2.stroke(); g2.setLineDash([]);\r\n  g2.fillStyle='rgba(120,150,190,.55)'; g2.font='9px '+cssMono();\r\n  g2.fillText('single‑slit envelope  sinc²(πa sinθ/λ)', cx+10, cy+r*0.62);\r\n}\r\nfunction drawOrderRays(){\r\n  const cx=sx(0), cy=sy(S.yOff), r=RFF()*cam.s;\r\n  const ords=derived().orders;\r\n  g2.font='10px '+cssMono();\r\n  for(const o of ords){\r\n    g2.strokeStyle=o.m===0?'rgba(251,191,36,.35)':'rgba(251,191,36,.30)';\r\n    g2.setLineDash([6,5]); g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(cx,cy);\r\n    g2.lineTo(cx+Math.cos(o.th)*r*1.06, cy-Math.sin(o.th)*r*1.06);\r\n    g2.stroke(); g2.setLineDash([]);\r\n    const lx=cx+Math.cos(o.th)*r*1.09, ly=cy-Math.sin(o.th)*r*1.09;\r\n    // label only the orders that carry light, so a coarse grating does not paper the stage\r\n    if(lx<W-26 && (Math.abs(o.m)<=2 || o.I>0.04)){\r\n      g2.fillStyle='rgba(251,191,36,.75)';\r\n      g2.fillText(`m=${o.m>0?'+':''}${o.m}`, lx+2, ly+3);\r\n    }\r\n  }\r\n  // the up-front prediction, on stage before any light arrives\r\n  const pk=S._peak;\r\n  if(pk && pk.best && !(S.res && S.res.ready)){\r\n    const x=cx+Math.cos(pk.best.th)*r*0.62, y=cy-Math.sin(pk.best.th)*r*0.62;\r\n    g2.strokeStyle='rgba(248,113,113,.6)'; g2.lineWidth=1; g2.setLineDash([3,3]);\r\n    g2.beginPath(); g2.arc(x,y,9,0,Math.PI*2); g2.stroke(); g2.setLineDash([]);\r\n    g2.fillStyle='rgba(248,113,113,.8)'; g2.font='9px '+cssMono();\r\n    g2.fillText(`predicted brightest order · m=${pk.best.m>0?'+':''}${pk.best.m} · ≈ ${(pk.best.I*100).toFixed(0)} %`, x+12, y-4);\r\n  }\r\n}\r\nfunction drawPlaneWave(){\r\n  const L=lamUm(), xf=Math.min(S.w.front, 0);\r\n  const left=cam.x0-2;\r\n  g2.lineWidth=1.1;\r\n  for(let k=0;k<260;k++){\r\n    const xw=xf-k*L;\r\n    if(xw<left) break;\r\n    if(xw>0) continue;\r\n    const al=clamp(0.30-0.0016*k, 0.05, 0.30);\r\n    g2.strokeStyle=`rgba(56,189,248,${al})`;\r\n    const X=sx(xw);\r\n    g2.beginPath(); g2.moveTo(X,0); g2.lineTo(X,H); g2.stroke();\r\n  }\r\n  if(S.t<tAp()){\r\n    const X=sx(S.w.front);\r\n    g2.fillStyle='rgba(56,189,248,.85)'; g2.font='10px '+cssMono();\r\n    g2.fillText('◂ plane wave incoming — nothing on the screen yet', Math.max(X-260,6), 22);\r\n  }\r\n}\r\nfunction drawWavelets(){\r\n  const half=cam.vmax/2+dEff();\r\n  const N=S.nSlits, d=dEff();\r\n  // keep the wavelet halo inside the far-field arc, and thin: with N slits each shedding a\r\n  // fresh circle every optical period the near field is a dense weave, and the point of the\r\n  // picture is the bright directions that come out of it, not the weave itself\r\n  const rMax=Math.min(RFF()*1.02, 22*lamUm())*cam.s;\r\n  g2.lineWidth=0.9;\r\n  for(const u of S.wf){\r\n    const r=cMed()*(S.t-u)*cam.s;\r\n    if(r<1.5 || r>rMax) continue;\r\n    const al=clamp(0.17-0.13*(r/rMax), 0.035, 0.17);\r\n    g2.strokeStyle=`rgba(251,191,36,${al})`;\r\n    for(let j=0;j<N;j++){\r\n      const yw=S.yOff+(j-(N-1)/2)*d;\r\n      if(Math.abs(yw-S.yOff)>half) continue;             // only the slits actually in view\r\n      const cx=sx(0), cy=sy(yw);\r\n      if(cx-r>W+20) continue;\r\n      g2.beginPath(); g2.arc(cx,cy,r,-Math.PI/2,Math.PI/2); g2.stroke();\r\n    }\r\n  }\r\n}\r\nfunction drawAperture(){\r\n  const N=S.nSlits, d=dEff(), a=aEff();\r\n  const X=sx(0), half=cam.vmax/2;\r\n  // opaque plate\r\n  g2.fillStyle='#141b2a'; g2.fillRect(X-3.5,0,7,H);\r\n  g2.strokeStyle='rgba(120,150,190,.45)'; g2.lineWidth=1;\r\n  g2.beginPath(); g2.moveTo(X-3.5,0); g2.lineTo(X-3.5,H); g2.moveTo(X+3.5,0); g2.lineTo(X+3.5,H); g2.stroke();\r\n  // slits, cut to true scale\r\n  for(let j=0;j<N;j++){\r\n    const yw=S.yOff+(j-(N-1)/2)*d;\r\n    if(Math.abs(yw-S.yOff)>half+d) continue;\r\n    const y1=sy(yw+a/2), y2=sy(yw-a/2);\r\n    const hpx=Math.max(y2-y1, 1.1);\r\n    g2.fillStyle='rgba(56,189,248,.85)';\r\n    g2.fillRect(X-3.5, y1, 7, hpx);\r\n  }\r\n  // dimension marks when the geometry is legible\r\n  const dpx=d*cam.s;\r\n  if(N>1 && dpx>18){\r\n    const yA=S.yOff+(0-(N-1)/2)*d, yB=yA+d;\r\n    const xk=X-16;\r\n    g2.strokeStyle='rgba(150,170,200,.5)'; g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(xk,sy(yA)); g2.lineTo(xk,sy(yB)); g2.stroke();\r\n    g2.fillStyle='rgba(150,170,200,.7)'; g2.font='9px '+cssMono();\r\n    g2.fillText(`d = ${d.toFixed(2)} µm`, xk-84, (sy(yA)+sy(yB))/2+3);\r\n  }\r\n  g2.fillStyle='rgba(56,189,248,.75)'; g2.font='10px '+cssMono();\r\n  g2.fillText(`${N} slit${N===1?'':'s'} · a = ${a.toFixed(2)} µm`, X+10, H-32);\r\n}\r\nfunction drawDetector(R){\r\n  const cx=sx(0), cy=sy(S.yOff), r=RFF()*cam.s, th=rad(S.det);\r\n  const x=cx+Math.cos(th)*r, y=cy-Math.sin(th)*r;\r\n  const hot = R && R.ready && R.I>0.35;\r\n  g2.strokeStyle='rgba(52,211,153,.35)'; g2.lineWidth=1;\r\n  g2.beginPath(); g2.moveTo(cx,cy); g2.lineTo(x,y); g2.stroke();\r\n  g2.fillStyle=hot?'rgba(255,255,255,.95)':'rgba(52,211,153,.92)';\r\n  g2.beginPath(); g2.arc(x,y,5,0,Math.PI*2); g2.fill();\r\n  g2.strokeStyle=hot?'#fff':'#34d399'; g2.lineWidth=2;\r\n  g2.beginPath(); g2.arc(x,y,8.5,0,Math.PI*2); g2.stroke();\r\n  g2.fillStyle=hot?'#fff':'rgba(52,211,153,.92)'; g2.font='10px '+cssMono();\r\n  const txt = R && R.ready ? `detector ${S.det.toFixed(1)}° · ${(R.I*100).toFixed(R.I<0.01?2:1)} %`\r\n                           : `detector ${S.det.toFixed(1)}°`;\r\n  const tx = x<W-190 ? x+13 : x-190;\r\n  g2.fillText(txt, tx, y-10);\r\n}\r\n/* the phasor chain — N little arrows head to tail at the detector's angle.\r\n   When the chain closes into a ring the detector is in a null. */\r\nfunction drawPhasors(R){\r\n  const N=Math.min(S.nSlits, 64);\r\n  const bw=168, bh=118, bx=12, by=H-bh-12;\r\n  g2.fillStyle='rgba(7,10,18,.88)'; g2.strokeStyle='rgba(27,36,54,1)'; g2.lineWidth=1;\r\n  g2.beginPath(); g2.roundRect ? g2.roundRect(bx,by,bw,bh,8) : g2.rect(bx,by,bw,bh);\r\n  g2.fill(); g2.stroke();\r\n  g2.fillStyle='rgba(74,85,104,1)'; g2.font='9px '+cssMono();\r\n  g2.fillText('PHASOR CHAIN AT DETECTOR', bx+9, by+14);\r\n  const phi = 2*Math.PI*dEff()*Math.sin(rad(S.det))/lamUm();\r\n  // walk the chain to find its extent, then scale it to the box\r\n  let px=0, py=0, minX=0, maxX=0, minY=0, maxY=0;\r\n  const pts=[[0,0]];\r\n  for(let j=0;j<N;j++){\r\n    px+=Math.cos(j*phi); py+=Math.sin(j*phi);\r\n    pts.push([px,py]);\r\n    minX=Math.min(minX,px); maxX=Math.max(maxX,px);\r\n    minY=Math.min(minY,py); maxY=Math.max(maxY,py);\r\n  }\r\n  const spanX=Math.max(maxX-minX,1e-6), spanY=Math.max(maxY-minY,1e-6);\r\n  const sc=Math.min((bw-34)/spanX, (bh-40)/spanY);\r\n  const ox=bx+17-minX*sc, oy=by+30-minY*sc;\r\n  g2.strokeStyle='rgba(251,191,36,.85)'; g2.lineWidth=1.3;\r\n  g2.beginPath();\r\n  pts.forEach(([qx,qy],i)=>{ const X=ox+qx*sc, Y=oy+qy*sc; i?g2.lineTo(X,Y):g2.moveTo(X,Y); });\r\n  g2.stroke();\r\n  // resultant\r\n  const rx=ox+px*sc, ry=oy+py*sc;\r\n  g2.strokeStyle=(Math.hypot(px,py)/N<0.05)?'rgba(248,113,113,.95)':'rgba(52,211,153,.95)';\r\n  g2.lineWidth=2;\r\n  g2.beginPath(); g2.moveTo(ox,oy); g2.lineTo(rx,ry); g2.stroke();\r\n  g2.fillStyle='rgba(150,170,200,.7)'; g2.font='9px '+cssMono();\r\n  const closed = Math.hypot(px,py)/N < 0.05;\r\n  g2.fillText(closed?'chain closes ⇒ dark':`resultant ${(Math.hypot(px,py)/N*100).toFixed(0)} %`, bx+9, by+bh-8);\r\n}\r\nfunction drawStageLabels(R){\r\n  g2.font='11px '+cssMono();\r\n  if(S.dSpace < lamUm() && S.nSlits>1){\r\n    g2.fillStyle='rgba(248,113,113,.9)';\r\n    g2.fillText('d < λ — NO DIFFRACTED ORDERS; only m = 0 leaves the plate', 14, 24);\r\n  }\r\n  if(R && !R.ready && R.countdown!=null && S.t>=tAp()){\r\n    g2.fillStyle='rgba(52,211,153,.9)';\r\n    g2.fillText(`WAVELETS IN FLIGHT — pattern in ≈ ${R.countdown.toFixed(1)} fs`, 14, 24);\r\n  }\r\n  if(R && R.ready && R.ramp<1){\r\n    g2.fillStyle='rgba(251,191,36,.9)';\r\n    g2.fillText('PATTERN SETTLING — interference building over a few cycles', 14, 24);\r\n  }\r\n}\r\n\r\n/* ============================================================ 3D INSET (hand-rolled) */\r\nlet yaw=0.72, pitch=0.42, dragging3=false, lastM=null;\r\nc3d.parentElement.addEventListener('mousedown',e=>{dragging3=true;lastM=[e.clientX,e.clientY];});\r\nwindow.addEventListener('mouseup',()=>dragging3=false);\r\nwindow.addEventListener('mousemove',e=>{\r\n  if(!dragging3)return;\r\n  yaw+=(e.clientX-lastM[0])*0.01; pitch=clamp(pitch+(e.clientY-lastM[1])*0.006,0.10,1.15);\r\n  lastM=[e.clientX,e.clientY]; if(!S.playing) draw();\r\n});\r\nfunction drawInset3D(){\r\n  g3.clearRect(0,0,W3,H3);\r\n  g3.fillStyle='#070b14'; g3.fillRect(0,0,W3,H3);\r\n  if(S.playing) yaw+=0.004;\r\n  const cx=W3*0.32, cy=H3*0.58, sc=Math.min(W3,H3)*0.34;\r\n  const cA=Math.cos(yaw), sA=Math.sin(yaw), sp=Math.sin(pitch), cp=Math.cos(pitch);\r\n  const pr=(X,Y,Z)=>{                       // X downstream, Y lateral, Z vertical\r\n    const xe=X*cA - Y*sA, ye=X*sA + Y*cA;\r\n    return [cx + xe*sc, cy - (Z*cp - ye*sp)*sc];\r\n  };\r\n  // the plate\r\n  g3.strokeStyle='rgba(120,150,190,.35)'; g3.lineWidth=1;\r\n  const plate=[[0,-1,-1],[0,1,-1],[0,1,1],[0,-1,1]];\r\n  g3.beginPath();\r\n  plate.forEach((p,i)=>{const q=pr(p[0],p[1],p[2]); i?g3.lineTo(q[0],q[1]):g3.moveTo(q[0],q[1]);});\r\n  g3.closePath(); g3.stroke();\r\n  // slit lines on the plate (vertical scratches)\r\n  const NS=Math.min(S.nSlits,24);\r\n  g3.strokeStyle='rgba(56,189,248,.75)'; g3.lineWidth=1.4;\r\n  for(let j=0;j<NS;j++){\r\n    const yy=NS===1?0:(-0.7+1.4*j/(NS-1));\r\n    const A=pr(0,yy,-0.9), B=pr(0,yy,0.9);\r\n    g3.beginPath(); g3.moveTo(A[0],A[1]); g3.lineTo(B[0],B[1]); g3.stroke();\r\n  }\r\n  // the screen, downstream\r\n  g3.strokeStyle='rgba(120,150,190,.28)';\r\n  const scr=[[2.3,-1.5,-1],[2.3,1.5,-1],[2.3,1.5,1],[2.3,-1.5,1]];\r\n  g3.beginPath();\r\n  scr.forEach((p,i)=>{const q=pr(p[0],p[1],p[2]); i?g3.lineTo(q[0],q[1]):g3.moveTo(q[0],q[1]);});\r\n  g3.closePath(); g3.stroke();\r\n  // diffracted beams and their spots\r\n  const ords=derived().orders;\r\n  const R=S.res, on = R && R.ready;\r\n  for(const o of ords){\r\n    const yy=2.3*Math.tan(o.th);\r\n    if(Math.abs(yy)>1.5) continue;\r\n    const A=pr(0,0,0), B=pr(2.3,yy,0);\r\n    const al=clamp(0.25+0.7*o.I,0.12,0.95)*(on?1:0.35);\r\n    g3.strokeStyle=`rgba(251,191,36,${al})`; g3.lineWidth=1.4;\r\n    g3.beginPath(); g3.moveTo(A[0],A[1]); g3.lineTo(B[0],B[1]); g3.stroke();\r\n    g3.fillStyle=`rgba(251,191,36,${al})`;\r\n    g3.beginPath(); g3.arc(B[0],B[1], 2+3.4*Math.sqrt(o.I), 0, Math.PI*2); g3.fill();\r\n  }\r\n  if(!ords.length){\r\n    const A=pr(0,0,0), B=pr(2.3,0,0);\r\n    g3.strokeStyle=`rgba(251,191,36,${on?0.85:0.3})`; g3.lineWidth=1.6;\r\n    g3.beginPath(); g3.moveTo(A[0],A[1]); g3.lineTo(B[0],B[1]); g3.stroke();\r\n  }\r\n  // detector marker on the screen\r\n  const dy=2.3*Math.tan(rad(S.det));\r\n  if(Math.abs(dy)<=1.5){\r\n    const q=pr(2.3,dy,0);\r\n    g3.fillStyle= (on&&R.I>0.35)?'#fff':'#34d399';\r\n    g3.beginPath(); g3.arc(q[0],q[1],3.2,0,Math.PI*2); g3.fill();\r\n  }\r\n  g3.fillStyle='rgba(150,170,200,.55)'; g3.font='9px '+cssMono();\r\n  g3.fillText(`${ords.length||'—'} order${ords.length===1?'':'s'}`, W3-56, H3-9);\r\n}\r\n\r\n/* ============================================================ SCREEN PLOT (the lived signal) */\r\nfunction drawScreenPlot(){\r\n  gS.clearRect(0,0,WS,HS);\r\n  gS.fillStyle='#070a12'; gS.fillRect(0,0,WS,HS);\r\n  const padL=44,padR=12,padT=32,padB=24;\r\n  const x0=padL,x1=WS-padR,y0=HS-padB,y1=padT;\r\n  gS.strokeStyle='rgba(120,150,190,.18)'; gS.lineWidth=1;\r\n  gS.beginPath(); gS.moveTo(x0,y1); gS.lineTo(x0,y0); gS.lineTo(x1,y0); gS.stroke();\r\n  gS.fillStyle='rgba(150,170,200,.5)'; gS.font='9px '+cssMono();\r\n  gS.fillText('I / I₀',6,y1-4);\r\n  gS.fillText(`position on screen at L = ${S.Ldist.toFixed(2)} m →`, x1-176, HS-7);\r\n\r\n  const R=S.res;\r\n  const SC=screenCurve(), yMax=SC.yMax;\r\n  const X=yy=>x0+(yy+yMax)/(2*yMax)*(x1-x0);\r\n  const Y=I=>y0-clamp(I,0,1)*(y0-y1);\r\n  // y grid\r\n  for(const lv of [0.25,0.5,0.75,1]){\r\n    const py=Y(lv);\r\n    gS.strokeStyle='rgba(120,150,190,.10)';\r\n    gS.beginPath(); gS.moveTo(x0,py); gS.lineTo(x1,py); gS.stroke();\r\n    gS.fillStyle='rgba(150,170,200,.42)';\r\n    gS.fillText((lv*100).toFixed(0)+'%', x0-30, py+3);\r\n  }\r\n  if(!R || !R.ready){\r\n    gS.fillStyle='rgba(150,170,200,.45)';\r\n    const msg = !R ? 'no pattern yet'\r\n      : S.t<tAp() ? `plane wave still crossing to the plate — ≈ ${R.countdown.toFixed(0)} fs`\r\n      : `wavelets in flight — the screen lights up in ≈ ${R.countdown.toFixed(1)} fs`;\r\n    gS.fillText(msg, x0+10, (y0+y1)/2);\r\n    return;\r\n  }\r\n  // the analytic law, dashed and secondary\r\n  gS.strokeStyle='rgba(120,150,190,.40)'; gS.setLineDash([3,3]); gS.lineWidth=1;\r\n  gS.beginPath();\r\n  for(let i=0;i<=200;i++){\r\n    const yy=-yMax+2*yMax*i/200, th=Math.atan2(yy,S.Ldist);\r\n    const px=X(yy), py=Y(envelopeI(th));\r\n    i?gS.lineTo(px,py):gS.moveTo(px,py);\r\n  }\r\n  gS.stroke(); gS.setLineDash([]);\r\n  gS.fillStyle='rgba(120,150,190,.5)';\r\n  gS.fillText('envelope', x0+8, Y(envelopeI(Math.atan2(-yMax*0.55,S.Ldist)))-4);\r\n  // the emergent curve — one phasor sum over the aperture per sample point\r\n  gS.strokeStyle='rgba(251,191,36,.95)'; gS.lineWidth=1.6;\r\n  gS.beginPath();\r\n  for(let i=0;i<=SCR_N;i++){\r\n    const px=X(-yMax+2*yMax*i/SCR_N), py=Y(SC.I[i]*R.ramp);\r\n    i?gS.lineTo(px,py):gS.moveTo(px,py);\r\n  }\r\n  gS.stroke();\r\n  // order ticks\r\n  gS.font='8px '+cssMono();\r\n  for(const o of R.orders){\r\n    const yy=S.Ldist*Math.tan(o.th);\r\n    if(Math.abs(yy)>yMax) continue;\r\n    const px=X(yy);\r\n    gS.strokeStyle='rgba(251,191,36,.30)';\r\n    gS.beginPath(); gS.moveTo(px,y0); gS.lineTo(px,y0-6); gS.stroke();\r\n    gS.fillStyle='rgba(251,191,36,.6)';\r\n    gS.fillText(`${o.m>0?'+':''}${o.m}`, px-4, y0+11);\r\n  }\r\n  // the detector's own position — the playhead of this trace\r\n  const dy=R.screenY;\r\n  if(Math.abs(dy)<=yMax){\r\n    const px=X(dy);\r\n    gS.strokeStyle='rgba(52,211,153,.85)'; gS.lineWidth=1;\r\n    gS.beginPath(); gS.moveTo(px,y1); gS.lineTo(px,y0); gS.stroke();\r\n    gS.fillStyle='#34d399';\r\n    gS.beginPath(); gS.arc(px, Y(R.I), 3.4, 0, Math.PI*2); gS.fill();\r\n  }\r\n  gS.fillStyle='rgba(150,170,200,.62)'; gS.font='9px '+cssMono();\r\n  gS.fillText(`detector at ${(dy*100).toFixed(1)} cm · ${(R.I*100).toFixed(R.I<0.01?2:1)} % of centre`, x0+8, HS-7);\r\n}\r\n\r\n/* ============================================================ WIDTH-vs-N PLOT */\r\nfunction widthPoints(){\r\n  if(S._widths) return S._widths;\r\n  const out=[];\r\n  for(const N of [1,2,8,32,128]){\r\n    const strips=srcFor(N,dEff(),aEff());\r\n    const w=fwhmRadWith(strips,N);\r\n    if(isFinite(w)) out.push({N, w});\r\n  }\r\n  S._widths=out;\r\n  return out;\r\n}\r\nfunction drawWidthPlot(){\r\n  gW.clearRect(0,0,WW,HW);\r\n  gW.fillStyle='#070a12'; gW.fillRect(0,0,WW,HW);\r\n  const padL=46,padR=14,padT=32,padB=24;\r\n  const x0=padL,x1=WW-padR,y0=HW-padB,y1=padT;\r\n  gW.strokeStyle='rgba(120,150,190,.18)'; gW.lineWidth=1;\r\n  gW.beginPath(); gW.moveTo(x0,y1); gW.lineTo(x0,y0); gW.lineTo(x1,y0); gW.stroke();\r\n  gW.fillStyle='rgba(150,170,200,.5)'; gW.font='9px '+cssMono();\r\n  gW.fillText('width [°]',6,y1-4); gW.fillText('number of slits N →', x1-108, HW-7);\r\n\r\n  const lnMin=0, lnMax=Math.log10(2048);\r\n  const dv=dEff(), L=lamUm();\r\n  const guide=N=>deg(0.8859*L/(N*dv));                 // asymptotic FWHM, degrees\r\n  const wTop=Math.max(guide(1), 90), wBot=Math.max(guide(2048), 1e-3);\r\n  const ldTop=Math.log10(wTop), ldBot=Math.log10(wBot);\r\n  const X=N=>x0+(Math.log10(Math.max(N,1))-lnMin)/(lnMax-lnMin)*(x1-x0);\r\n  const Y=w=>y0-(Math.log10(clamp(w,wBot,wTop))-ldBot)/(ldTop-ldBot)*(y0-y1);\r\n\r\n  gW.fillStyle='rgba(150,170,200,.42)'; gW.font='9px '+cssMono();\r\n  for(const N of [1,10,100,1000]){\r\n    const px=X(N);\r\n    gW.strokeStyle='rgba(120,150,190,.10)';\r\n    gW.beginPath(); gW.moveTo(px,y1); gW.lineTo(px,y0); gW.stroke();\r\n    gW.fillText(String(N), px-5, y0+12);\r\n  }\r\n  for(const w of [0.01,0.1,1,10]){\r\n    if(w<wBot||w>wTop) continue;\r\n    const py=Y(w);\r\n    gW.strokeStyle='rgba(120,150,190,.10)';\r\n    gW.beginPath(); gW.moveTo(x0,py); gW.lineTo(x1,py); gW.stroke();\r\n    gW.fillText(w<1?w.toFixed(2):w.toFixed(0), x0-32, py+3);\r\n  }\r\n  // reference slope 1: peak-to-first-null half width λ/(Nd cosθ)\r\n  gW.strokeStyle='rgba(120,150,190,.35)'; gW.setLineDash([4,4]); gW.lineWidth=1;\r\n  gW.beginPath(); gW.moveTo(X(1),Y(deg(L/dv))); gW.lineTo(X(2048),Y(deg(L/(2048*dv)))); gW.stroke();\r\n  gW.setLineDash([]);\r\n  gW.fillStyle='rgba(120,150,190,.5)';\r\n  gW.fillText('λ/(N d cosθ) — peak to first null', X(1)+5, Y(deg(L/dv))-4);\r\n  // reference slope 2: the true FWHM asymptote\r\n  gW.strokeStyle='rgba(251,191,36,.55)'; gW.lineWidth=1.4;\r\n  gW.beginPath(); gW.moveTo(X(1),Y(guide(1))); gW.lineTo(X(2048),Y(guide(2048))); gW.stroke();\r\n  gW.fillStyle='rgba(251,191,36,.75)';\r\n  gW.fillText('0.886 λ/(N d cosθ) — FWHM', X(24), Y(guide(24))+12);\r\n  // measured points, straight off the emergent kernel\r\n  for(const p of widthPoints()){\r\n    gW.fillStyle='rgba(251,191,36,.85)';\r\n    gW.beginPath(); gW.arc(X(p.N), Y(deg(p.w)), 2.6, 0, Math.PI*2); gW.fill();\r\n  }\r\n  // the sodium-doublet line: R = mN = λ/Δλ ≈ 982 at m = 1\r\n  const px=X(982);\r\n  gW.strokeStyle='rgba(248,113,113,.40)'; gW.setLineDash([2,3]);\r\n  gW.beginPath(); gW.moveTo(px,y1); gW.lineTo(px,y0); gW.stroke(); gW.setLineDash([]);\r\n  gW.fillStyle='rgba(248,113,113,.62)'; gW.font='8px '+cssMono();\r\n  gW.fillText('Na D doublet resolved (R = mN ≈ 982)', Math.min(px+4, x1-150), y1+9);\r\n  // where we are now\r\n  const wNow=derived().fwhm;\r\n  if(isFinite(wNow)){\r\n    gW.fillStyle='#34d399';\r\n    gW.beginPath(); gW.arc(X(S.nSlits), Y(deg(wNow)), 4.2, 0, Math.PI*2); gW.fill();\r\n    gW.fillStyle='rgba(230,238,247,.9)'; gW.font='9px '+cssMono();\r\n    gW.fillText(`N = ${S.nSlits} · FWHM ≈ ${deg(wNow).toFixed(3)}°`, x0+8, HW-7);\r\n  }else{\r\n    gW.fillStyle='rgba(150,170,200,.5)'; gW.font='9px '+cssMono();\r\n    gW.fillText('no half‑maximum inside ±85° at this setting', x0+8, HW-7);\r\n  }\r\n}\r\n\r\n/* ============================================================ READOUTS */\r\nfunction readRow(k,v,cls,tip){\r\n  const t = tip ? ` title=\"${tip}\"` : '';\r\n  return `<dt${t}>${k}<\/dt><dd class=\"${cls||''}\"${t}>${v}<\/dd>`;\r\n}\r\nfunction updateReadouts(){\r\n  const R=S.res; if(!R){rdl.innerHTML='';return;}\r\n  const pk=S._peak;\r\n  let rows='';\r\n  if(pk){\r\n    rows+=readRow('⌖ Orders predicted', pk.where, '',\r\n      'Worked out up front from N, d, a and λ alone — how many orders exist and where the outermost one lands, before any light has crossed the stage');\r\n    rows+=readRow('   brightest order',\r\n      pk.best ? `m = ${pk.best.m>0?'+':''}${pk.best.m} · ≈ ${(pk.best.I*100).toFixed(1)} % at ${deg(pk.best.th).toFixed(1)}°` : '—',\r\n      pk.best?'hi':'');\r\n    rows+='<div class=\"sep\"><\/div>';\r\n  }\r\n  const statusCls = !R.ready ? (R.status==='incoming'?'ok':'') : (R.ramp<1?'ok':'hi');\r\n  const statusTxt = R.status==='incoming' ? `incoming · ${R.countdown.toFixed(1)} fs`\r\n                  : !R.ready ? `dark · wave arrives in ${R.countdown.toFixed(0)} fs`\r\n                  : R.ramp<1 ? 'settling' : 'reading';\r\n  rows+=readRow('Detector', statusTxt, statusCls);\r\n  rows+=readRow('Detector θ', `${S.det>0?'+':''}${S.det.toFixed(1)}°`, '',\r\n    'Direction from the aperture to the detector. Drag the green marker on the far-field arc to change it');\r\n  rows+=readRow('Detector order m',\r\n    S.nSlits<2 ? '—' : `${R.mFrac>=0?'+':''}${R.mFrac.toFixed(3)}${R.onPeak?' · principal max':''}`,\r\n    R.onPeak?'hi':'',\r\n    'The path difference between neighbouring slits, in wavelengths: m = d·sinθ/λ. Whole numbers are the bright orders — the one exact relation on this panel');\r\n  rows+=readRow('Detector power',\r\n    R.ready ? `${(R.I*100).toFixed(R.I<0.01?3:2)} %${R.onNull?' · null':''}` : '—',\r\n    R.ready ? (R.I>0.35?'hi':R.onNull?'warn':'') : '',\r\n    'Intensity at the detector as a percentage of the pattern centre. It stays “—” until the light has actually reached the arc');\r\n  rows+=readRow('Screen position',\r\n    R.ready ? `${(R.screenY*100).toFixed(2)} cm` : '—', '',\r\n    'Where this direction lands on a flat screen at distance L: y = L·tanθ');\r\n  rows+='<div class=\"sep\"><\/div>';\r\n  rows+=readRow('Orders visible', S.nSlits<2 ? '—' : String(R.orders.length),\r\n    (S.nSlits>=2 && R.orders.length===1)?'warn':'',\r\n    'How many principal maxima leave the plate at all, counting m = 0. Orders with |mλ/d| ≥ 1 do not exist, and an order that lands on an envelope zero is missing');\r\n  // an order that is not there gets no angle: \"—\" if it cannot exist at all, \"extinct\" if\r\n  // the single-slit envelope has put a zero exactly on it (a/d = 1/m kills order m)\r\n  const ordTxt = o => o.state==='ok' && o.th!==null ? `${deg(o.th).toFixed(2)}°`\r\n                    : o.state==='extinct' ? '— extinct (envelope null)' : '—';\r\n  rows+=readRow('1st-order angle', ordTxt(R.ord1),\r\n    R.ord1.state==='ok'?'hi':R.ord1.state==='extinct'?'warn':'',\r\n    'Where the m = 1 principal maximum actually sits, read off the computed pattern. It exists only while λ < d and the single-slit envelope does not put a zero on it; when it does, this reads \"extinct\" instead of a direction');\r\n  rows+=readRow('2nd-order angle', ordTxt(R.ord2),\r\n    R.ord2.state==='extinct'?'warn':'',\r\n    'Same
