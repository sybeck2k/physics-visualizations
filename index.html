d var(--line); border-radius:6px;\r\n    padding:8px 4px; cursor:pointer; transition:.15s;\r\n  }\r\n  .btns button:hover{border-color:var(--cyan); color:#fff}\r\n  .btns button.play{background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.4)}\r\n  label.fld{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim)}\r\n  label.fld .v{color:var(--ink); font-family:var(--mono); font-size:11px}\r\n  input[type=range]{width:100%; accent-color:var(--cyan); cursor:pointer}\r\n  label.chk{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); cursor:pointer}\r\n  label.chk input{accent-color:var(--cyan); cursor:pointer}\r\n\r\n  #stagewrap{position:relative; min-width:0; display:flex; flex-direction:column}\r\n  #stage{position:relative; flex:1 1 auto; min-height:0; background:#04060b}\r\n  #stage canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  #inset3d{\r\n    position:absolute; top:12px; right:10px; width:272px; height:190px;\r\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.96);\r\n    backdrop-filter:blur(3px); z-index:3;\r\n  }\r\n  #inset3d canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  #inset3d .cap{\r\n    position:absolute; left:9px; top:7px; font-family:var(--mono); font-size:9px;\r\n    letter-spacing:.12em; text-transform:uppercase; color:var(--faint); z-index:1;\r\n  }\r\n  #readouts{\r\n    position:absolute; top:206px; right:10px; bottom:8px; width:306px; z-index:3;\r\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.97);\r\n    backdrop-filter:blur(3px); padding:9px 12px; font-family:var(--mono);\r\n    overflow-y:auto;\r\n  }\r\n  #readouts h3{\r\n    font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);\r\n    margin:0 0 6px;\r\n  }\r\n  #readouts dl{display:grid; grid-template-columns:1fr auto; gap:2px 10px; margin:0; font-size:10.5px}\r\n  #readouts dt{color:var(--dim); white-space:nowrap}\r\n  #readouts dt[title]{cursor:help; text-decoration:underline dotted var(--faint); text-underline-offset:2px}\r\n  #readouts dd{margin:0; text-align:right; color:var(--ink)}\r\n  #readouts dd.hi{color:var(--amber)}\r\n  #readouts dd.warn{color:var(--red)}\r\n  #readouts dd.ok{color:var(--green)}\r\n  #readouts .sep{grid-column:1/-1; height:1px; background:var(--line); margin:5px 0}\r\n\r\n  #plots{\r\n    flex:0 0 168px; display:grid; grid-template-columns:1fr 1fr; gap:1px;\r\n    background:var(--line); border-top:1px solid var(--line);\r\n  }\r\n  .plot{position:relative; background:#070a12}\r\n  .plot canvas{position:absolute; inset:0; width:100%; height:100%}\r\n  .plot .cap{\r\n    position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:9px;\r\n    letter-spacing:.13em; text-transform:uppercase; color:var(--faint); z-index:1;\r\n  }\r\n\r\n  #explain{\r\n    flex:0 0 auto; max-height:clamp(180px,26vh,300px); overflow-y:auto; border-top:1px solid var(--line);\r\n    background:var(--panel); padding:11px 16px 13px; display:grid;\r\n    grid-template-columns:repeat(5,1fr); gap:12px;\r\n  }\r\n  #explain .ex{\r\n    border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 12px;\r\n    max-height:clamp(164px,24vh,280px); overflow-y:auto;\r\n  }\r\n  #explain .ex::-webkit-scrollbar{width:5px}\r\n  #explain .ex::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}\r\n  #explain h4{\r\n    margin:0 0 5px; font-family:var(--mono); font-size:10px;\r\n    letter-spacing:.1em; text-transform:uppercase; color:var(--cyan);\r\n  }\r\n  #explain p{margin:5px 0 0; color:var(--dim); font-size:11.5px}\r\n  #explain p.cav{margin-top:6px; color:var(--faint); font-size:10px; font-style:italic; line-height:1.45}\r\n  #explain b{color:var(--ink); font-weight:600}\r\n  #explain code{font-family:var(--mono); color:var(--amber); font-size:11px}\r\n  .hint{font-size:10.5px; color:var(--faint); margin-top:4px}\r\n  @media (max-width:1400px){ #explain{grid-template-columns:repeat(3,1fr); max-height:34vh} }\r\n  @media (max-width:820px){ #explain{grid-template-columns:1fr 1fr; max-height:40vh} }\r\n<\/style>\r\n\r\n<div id=\"app\">\r\n  <header>\r\n    <h1>SOFAR&nbsp;<span>Sound<\/span>&nbsp;Channel<\/h1>\r\n    <div class=\"tabs\" id=\"tabs\">\r\n      <button data-s=\"deepchannel\" class=\"on\">1 · Deep channel<\/button>\r\n      <button data-s=\"surfaceduct\">2 · Surface duct<\/button>\r\n      <button data-s=\"doubleduct\">3 · Double duct<\/button>\r\n      <button data-s=\"arctic\">4 · Arctic<\/button>\r\n      <button data-s=\"shadow\">5 · Shadow zone<\/button>\r\n    <\/div>\r\n  <\/header>\r\n\r\n  <main>\r\n    <aside>\r\n      <div class=\"grp\">\r\n        <h2>Simulation<\/h2>\r\n        <div class=\"btns\">\r\n          <button id=\"playBtn\" class=\"play\">▶ Play<\/button>\r\n          <button id=\"restartBtn\">↻ Restart<\/button>\r\n        <\/div>\r\n        <label class=\"fld\">Time rate <span class=\"v\" id=\"rateV\">1.0×<\/span>\r\n          <input type=\"range\" id=\"rate\" min=\"0.15\" max=\"5\" step=\"0.05\" value=\"1\">\r\n        <\/label>\r\n        <label class=\"fld\">Timeline <span class=\"v\" id=\"progV\">0.0 s<\/span>\r\n          <input type=\"range\" id=\"prog\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\">\r\n        <\/label>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Source &amp; hydrophone<\/h2>\r\n        <label class=\"fld\">Source depth <span class=\"v\" id=\"srcV\">1300 m<\/span>\r\n          <input type=\"range\" id=\"src\" min=\"10\" max=\"4500\" step=\"10\" value=\"1300\">\r\n        <\/label>\r\n        <label class=\"fld\">Launch fan half-width <span class=\"v\" id=\"fanV\">12.0°<\/span>\r\n          <input type=\"range\" id=\"fan\" min=\"1\" max=\"20\" step=\"0.5\" value=\"12\">\r\n        <\/label>\r\n        <label class=\"fld\">Hydrophone range <span class=\"v\" id=\"rngV\">300 km<\/span>\r\n          <input type=\"range\" id=\"rng\" min=\"5\" max=\"500\" step=\"1\" value=\"300\">\r\n        <\/label>\r\n        <label class=\"fld\">Hydrophone depth <span class=\"v\" id=\"rcvdV\">1300 m<\/span>\r\n          <input type=\"range\" id=\"rcvd\" min=\"10\" max=\"4900\" step=\"10\" value=\"1300\">\r\n        <\/label>\r\n        <div class=\"hint\">Drag the green hydrophone anywhere in the water · drag the cyan\r\n        source up and down.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Sound-speed profile<\/h2>\r\n        <label class=\"fld\" data-scen=\"deepchannel doubleduct shadow\">Channel axis depth <span class=\"v\" id=\"axisV\">1300 m<\/span>\r\n          <input type=\"range\" id=\"axis\" min=\"500\" max=\"2500\" step=\"10\" value=\"1300\">\r\n        <\/label>\r\n        <label class=\"fld\" data-scen=\"deepchannel doubleduct shadow\">Channel strength ε <span class=\"v\" id=\"epsV\">7.37 ×10⁻³<\/span>\r\n          <input type=\"range\" id=\"eps\" min=\"0\" max=\"14\" step=\"0.01\" value=\"7.37\">\r\n        <\/label>\r\n        <label class=\"fld\" data-scen=\"surfaceduct\">Mixed-layer depth <span class=\"v\" id=\"mldV\">120 m<\/span>\r\n          <input type=\"range\" id=\"mld\" min=\"20\" max=\"300\" step=\"5\" value=\"120\">\r\n        <\/label>\r\n        <div class=\"btns\"><button id=\"cpReset\">↺ Reset profile drags<\/button><\/div>\r\n        <div class=\"hint\">Drag the five cyan handles on the <b>c(z)<\/b> panel at the left of the\r\n        stage to sculpt the profile by hand. ε&nbsp;→&nbsp;0 flattens the channel away.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>View<\/h2>\r\n        <div class=\"btns\">\r\n          <button id=\"panL\">◂ Pan<\/button>\r\n          <button id=\"panR\">Pan ▸<\/button>\r\n          <button id=\"recenter\">⊙ Center<\/button>\r\n        <\/div>\r\n        <div class=\"hint\">Scroll to zoom the range axis · drag the water to pan ·\r\n        double-click to fit.<\/div>\r\n      <\/div>\r\n\r\n      <div class=\"grp\">\r\n        <h2>Overlays<\/h2>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oRays\" checked> Ray fan<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oWf\" checked> Wavefront through the fan<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oEnv\" checked> Turning-point envelope<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oProf\" checked> c(z) panel &amp; channel axis<\/label>\r\n      <\/div>\r\n    <\/aside>\r\n\r\n    <div id=\"stagewrap\">\r\n      <div id=\"stage\">\r\n        <canvas id=\"main2d\"><\/canvas>\r\n        <div id=\"inset3d\">\r\n          <span class=\"cap\">1:1 near-source fan (true angles, schematic)<\/span>\r\n          <canvas id=\"c3d\"><\/canvas>\r\n        <\/div>\r\n        <div id=\"readouts\">\r\n          <h3>Live readout<\/h3>\r\n          <dl id=\"rdl\"><\/dl>\r\n        <\/div>\r\n      <\/div>\r\n      <div id=\"plots\">\r\n        <div class=\"plot\">\r\n          <span class=\"cap\">Hydrophone arrival train<\/span>\r\n          <canvas id=\"cArr\"><\/canvas>\r\n        <\/div>\r\n        <div class=\"plot\">\r\n          <span class=\"cap\">Transmission loss vs range<\/span>\r\n          <canvas id=\"cTL\"><\/canvas>\r\n        <\/div>\r\n      <\/div>\r\n    <\/div>\r\n  <\/main>\r\n\r\n  <section id=\"explain\">\r\n    <div class=\"ex\">\r\n      <h4>Rays bend toward slow water<\/h4>\r\n      <p>Sound in the sea travels at about <b>1500 m/s<\/b>, but not exactly: it speeds up in warm\r\n      water and under pressure. A ray crossing that layered water refracts, and Snell's law keeps\r\n      one number fixed all the way along it — <code>cos θ(z) / c(z) = const<\/code>.<\/p>\r\n      <p>So a ray always <b>curves toward the slower water<\/b>. Where the speed rises with depth the\r\n      ray bends back up; where it falls with depth the ray bends down. In a layer of constant\r\n      gradient <code>g = dc/dz<\/code> the path is exactly a <b>circular arc<\/b> of radius\r\n      <code>R = c₀ / (g·cos θ₀)<\/code>.<\/p>\r\n      <p>Wherever <code>c(z) = c_source / cos θ₀<\/code> the ray goes momentarily horizontal — its\r\n      <b>turning point<\/b> — and heads back. Steeper launch ⇒ deeper turn.<\/p>\r\n      <p data-scen=\"deepchannel shadow\">This ocean is the canonical mid‑latitude profile: <code>c<\/code> <b>falls<\/b> to a minimum on\r\n      the axis, then <b>rises<\/b> again below it. Rays bend down above the axis and up below it — both\r\n      sides push them back toward the minimum.<\/p>\r\n      <p data-scen=\"surfaceduct\">This ocean has a wind‑mixed layer on top: inside it, pressure alone makes <code>c<\/code> <b>rise<\/b>\r\n      with depth, so rays launched in the layer bend <b>up<\/b> toward the surface instead of down.<\/p>\r\n      <p data-scen=\"doubleduct\">This ocean is the deep channel plus a <b>second, shallower notch<\/b> in sound speed (near\r\n      280 m), so the profile has <b>two minima<\/b> and rays can be bent back toward either one.<\/p>\r\n      <p data-scen=\"arctic\">This ocean has no minimum at all: under the ice, <code>c<\/code> rises steadily with depth\r\n      (<code>1435 + 0.0165·z<\/code> m/s), so <b>every ray bends upward<\/b>.<\/p>\r\n      <p class=\"cav\">The stage is drawn with a large <b>vertical exaggeration<\/b> (printed in the\r\n      corner), because a ducted ray leans over less than 12° and would otherwise be a flat line.\r\n      The small inset is the same fan at a true 1:1 aspect. Angles on the main stage are steepened;\r\n      angles in the inset are real.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"deepchannel doubleduct shadow\">\r\n      <h4>A speed minimum is a waveguide<\/h4>\r\n      <p>Warm surface water is fast; cold deep water is slow; below about a kilometre the pressure\r\n      takes over and speeds sound up again. That leaves a <b>minimum<\/b> — the <b>SOFAR axis<\/b>,\r\n      near <b>1000–1300 m<\/b> at mid latitudes.<\/p>\r\n      <p>A ray launched near the axis shallow enough (here within roughly <code>±13°<\/code>) turns\r\n      back <b>before<\/b> it can reach the surface or the seabed. It never touches either, so it\r\n      never loses energy to scattering or bottom absorption — it just oscillates about the axis\r\n      forever, spreading <b>cylindrically<\/b> instead of spherically.<\/p>\r\n      <p data-scen=\"doubleduct\">With two minima there are two ducts. A source in the shallow notch traps its steepest\r\n      rays there; flatter rays are carried on into the deep channel. The same click rides both.<\/p>\r\n      <p>That is why the 1991 <b>Heard Island Feasibility Test<\/b> put a source on the axis in the\r\n      southern Indian Ocean and was detected on hydrophones roughly <b>18 000 km<\/b> away, on both\r\n      coasts of North America.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"surfaceduct\">\r\n      <h4>A mixed layer is a leaky waveguide<\/h4>\r\n      <p>Wind churns the top of the sea into a uniform‑temperature layer. Inside it <code>c<\/code> rises with\r\n      depth, so rays bend <b>up<\/b>, hit the surface, bounce, and bend up again — hop after hop, trapped\r\n      between the surface and the layer's base.<\/p>\r\n      <p>Unlike the deep channel, this duct <b>touches the surface<\/b>. Each bounce loses a little energy,\r\n      and a rough sea scatters far more than this calm‑water model does. Thicken the layer with the\r\n      slider and more rays — steeper ones — are trapped.<\/p>\r\n      <p>Submarines sit just below such a layer on purpose: sound from a ship above can't easily get\r\n      down to them.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"arctic\">\r\n      <h4>Half a channel, with ice for a lid<\/h4>\r\n      <p>The Arctic is cold from the top, so <code>c<\/code> has its minimum <b>at the surface<\/b> and rises with depth.\r\n      There is only the lower half of a SOFAR channel: rays bend up, hit the underside of the ice, and\r\n      bounce back down along a chain of arcs.<\/p>\r\n      <p>Because that duct is pinned to the surface, sound <b>never stops touching it<\/b>. Ice is rough\r\n      and absorbs, so real Arctic propagation loses far more per bounce than the open‑water value used\r\n      here — the model is flattering.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"deepchannel doubleduct\">\r\n      <h4>What the hydrophone hears<\/h4>\r\n      <p>Not one arrival — a <b>train<\/b>. Each trapped ray takes a different path, so the same\r\n      click reaches the phone several times. Steep rays swing far off the axis through <b>faster<\/b>\r\n      water and arrive <b>first<\/b>; the near-axial ray takes the shortest, slowest path and arrives\r\n      <b>last and loudest<\/b>.<\/p>\r\n      <p>So a SOFAR arrival is a rising stutter that ends in a bang — a crescendo cut off sharply.\r\n      That signature is the fingerprint of the duct; drag the hydrophone and it reshapes.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"surfaceduct arctic\">\r\n      <h4>What the hydrophone hears<\/h4>\r\n      <p>Still a <b>train<\/b>, but a different one: each arrival is a ray with its own launch angle, and each\r\n      has bounced off the surface a different number of times. Every bounce costs a little level, so\r\n      arrivals are not simply “quiet early, loud late” as in the deep channel.<\/p>\r\n      <p>Drag the hydrophone <b>below<\/b> the duct and the train thins out and then stops — the\r\n      surface‑trapped sound never gets that deep.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\" data-scen=\"shadow\">\r\n      <h4>What the hydrophone hears<\/h4>\r\n      <p>Here: <b>nothing<\/b>. Same ocean as tab 1, same source on the axis, but the hydrophone is up at 300 m —\r\n      above the shallowest depth the fan ever turns. The arrival panel reads “no ray path”, and the transmission‑loss\r\n      curve has nothing to mark.<\/p>\r\n      <p>Drag the phone down toward the axis and the stutter returns: a train of arrivals ending in a bang.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>Shadow zones sit beside loud paths<\/h4>\r\n      <p>Rays leave gaps. Move the hydrophone a few hundred metres and you can fall in a\r\n      <b>shadow zone<\/b>: geometrically <b>no ray reaches you at all<\/b>, while a phone on the axis\r\n      at the same range is hearing a dozen arrivals. Loud and silent are neighbours.<\/p>\r\n      <p data-scen=\"deepchannel doubleduct shadow\">The opposite also happens. Where neighbouring rays pile back together the tube collapses\r\n      and the sound is refocused — a <b>convergence zone<\/b>, a ring of loud water every\r\n      <b>50–65 km<\/b> in the deep ocean, with quiet in between.<\/p>\r\n      <p data-scen=\"surfaceduct arctic\">In a surface duct the shadow is <b>beneath<\/b> it: sound trapped near the surface leaks little\r\n      downward, so a phone under the duct is quiet while a phone inside it is loud.<\/p>\r\n      <p>Turn on the turning-point envelope to see the caustics that bound both.<\/p>\r\n    <\/div>\r\n    <div class=\"ex\">\r\n      <h4>Reading the units<\/h4>\r\n      <p><b>c — metres per second.<\/b> The <b>sound speed<\/b>, ~1450–1550 m/s: a 1% change bends a\r\n      ray by degrees. A whole ocean's profile spans about <b>100 m/s<\/b>, less than the width of\r\n      the <code>c(z)<\/code> panel.<\/p>\r\n      <p><b>TL — transmission loss, decibels.<\/b> How much fainter than 1 m from the source.\r\n      Logarithmic: <code>+20 dB ≈ ten times fainter in pressure<\/code>, and <b>70 dB of loss is a\r\n      ten-million-fold drop in intensity<\/b>. Ducted sound loses about <code>10 log R<\/code>;\r\n      unducted sound loses <code>20 log R<\/code> — that gap is the whole trick.<\/p>\r\n      <p><b>Range — kilometres; arrival spread — seconds.<\/b> 300 km is London to Paris; a\r\n      <b>blue whale<\/b> call rides the channel across an ocean basin. The arrivals dribble in over\r\n      a second or two — the drawn-out, stuttering <b>echo of a shout in a canyon<\/b>, not a\r\n      single click.<\/p>\r\n      <p class=\"cav\">This is a ray (high-frequency) model: no diffraction, no modes, no\r\n      frequency dependence, flat seabed, no currents or eddies. Amplitudes are ray-tube\r\n      estimates — treat every level as ±~5 dB and every count of arrivals as the strongest few.<\/p>\r\n    <\/div>\r\n  <\/section>\r\n<\/div>\r\n\r\n<script>\r\n\"use strict\";\r\n/* ============================================================ constants */\r\n/* Munk (1974), \"Sound channel in an exponentially stratified ocean, with application to SOFAR\",\r\n   JASA 55, 220. Canonical mid-latitude deep sound channel. */\r\nconst C_MUNK1   = 1492.0;     // sound speed on the channel axis, m/s\r\nconst EPS_MUNK  = 0.00737;    // Munk perturbation parameter, dimensionless\r\nconst B_MUNK    = 1300.0;     // Munk stratification scale depth, m\r\nconst ZAX_MUNK  = 1300.0;     // canonical SOFAR axis depth at mid latitude, m\r\nconst D_OCEAN   = 5000.0;     // deep-ocean seabed for this section, m\r\nconst DZ_LAYER  = 50.0;       // layer thickness of the horizontally stratified model, m\r\nconst NLAY      = Math.round(D_OCEAN/DZ_LAYER);\r\n/* Arctic half-channel: sound speed rises linearly from a cold, fresh surface.\r\n   c(z) = 1435 + 0.0165 z  (m/s) — a standard upward-refracting Arctic gradient. */\r\nconst ARCTIC_C0 = 1435.0, ARCTIC_G = 0.0165;\r\nconst MLD_GRAD  = 0.017;      // adiabatic gradient inside a wind-mixed layer, s^-1\r\nconst D2_Z=280, D2_W=130, D2_AMP=16;   // secondary (shallow) duct: Gaussian notch, m / m / (m/s)\r\n/* Losses. Thorp (1967) volume absorption at ~100 Hz ≈ 0.0035 dB/km. Bottom loss is a\r\n   low-grazing-angle sand/silt figure; surface reflection is near-lossless in calm water. */\r\nconst ALPHA_DB_KM = 0.0035, BOT_LOSS_DB = 8.0, SURF_LOSS_DB = 0.5;\r\nconst TSCALE = 20.0;          // seconds of propagation per second of wall clock at rate 1×\r\nconst NRAY = 144, NR = 481, DRAW_EVERY = 8;   // calculation fan · range samples · drawn subset\r\nconst SHADOW_DB = 14;         // a spot this far below the best depth at its range, with at most one\r\n                              // path reaching it, is called a shadow zone (14 dB = 5x in pressure)\r\nconst RECV_FRAC = 0.8;        // the hydrophone sits at 0.8 of the traced range: grid index 384\r\nconst RIDX0 = Math.round((NR-1)*RECV_FRAC);\r\nconst DEG = Math.PI/180;\r\n\r\n/* ============================================================ helpers */\r\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\r\nconst lerp=(a,b,t)=>a+(b-a)*t;\r\nconst smooth=t=>t*t*t*(t*(t*6-15)+10);\r\nfunction keyf(pairs,x){\r\n  if(x<=pairs[0][0])return pairs[0][1];\r\n  for(let i=1;i<pairs.length;i++){\r\n    if(x<=pairs[i][0]){\r\n      const[x0,y0]=pairs[i-1],[x1,y1]=pairs[i];\r\n      return lerp(y0,y1,(x-x0)/(x1-x0));\r\n    }\r\n  }\r\n  return pairs[pairs.length-1][1];\r\n}\r\nconst log10=x=>Math.log(Math.max(x,1e-300))/Math.LN10;\r\nconst fmt=(v,n)=>Number.isFinite(v)?v.toFixed(n):'—';\r\n\r\n/* ============================================================ medium model */\r\n// The one sound-speed kernel. Every profile in the piece is this function plus, optionally,\r\n// a hand-dragged offset table — so the rays, the c(z) panel and the readouts can never disagree.\r\nfunction munk(z, zax, eps){\r\n  const eta = 2*(z-zax)/B_MUNK;\r\n  return C_MUNK1*(1 + eps*(eta + Math.exp(-eta) - 1));\r\n}\r\nfunction presetC(z){\r\n  if(S.scen==='arctic')      return ARCTIC_C0 + ARCTIC_G*z;\r\n  if(S.scen==='surfaceduct'){\r\n    const m=S.mld;\r\n    return z<m ? munk(m,S.axisSet,S.eps) - MLD_GRAD*(m-z) : munk(z,S.axisSet,S.eps);\r\n  }\r\n  if(S.scen==='doubleduct')\r\n    return munk(z,S.axisSet,S.eps) - D2_AMP*Math.exp(-Math.pow((z-D2_Z)/D2_W,2));\r\n  return munk(z,S.axisSet,S.eps);            // deepchannel · shadow\r\n}\r\nconst rawC = z => presetC(z) + keyf(S.cp, z);\r\n\r\n/* the layered table the ray march actually walks: c is linear inside every layer, so each\r\n   step is an exact circular arc and the ray invariant is conserved by construction */\r\nconst LAYC = new Float64Array(NLAY+1);\r\nfunction buildProfile(){\r\n  for(let i=0;i<=NLAY;i++) LAYC[i]=rawC(i*DZ_LAYER);\r\n  let mi=0; for(let i=1;i<=NLAY;i++) if(LAYC[i]<LAYC[mi]) mi=i;\r\n  S.axisZ=mi*DZ_LAYER; S.axisC=LAYC[mi];\r\n  S.cMin=LAYC[mi]; S.cMax=LAYC[0];\r\n  for(let i=0;i<=NLAY;i++) if(LAYC[i]>S.cMax) S.cMax=LAYC[i];\r\n}\r\nfunction cAt(z){\r\n  z=clamp(z,0,D_OCEAN);\r\n  const f=z/DZ_LAYER; const i=Math.min(Math.floor(f),NLAY-1);\r\n  return lerp(LAYC[i],LAYC[i+1],f-i);\r\n}\r\n\r\n/* ============================================================ scenarios */\r\n// SCEN holds only the per-scenario differences: display name, control defaults, framing.\r\nconst SCEN={\r\n  deepchannel :{name:'Deep sound channel', d:{src:1300, rcvd:1300, rng:300, fan:12, axis:1300, eps:7.37, rate:2.5}},\r\n  surfaceduct :{name:'Surface duct',       d:{src:60,   rcvd:60,   rng:120, fan:8,  axis:1300, eps:7.37, rate:2.5, mld:120}},\r\n  doubleduct  :{name:'Double duct',        d:{src:280,  rcvd:280,  rng:150, fan:9,  axis:1300, eps:7.37, rate:2.5}},\r\n  arctic      :{name:'Arctic half-channel',d:{src:100,  rcvd:100,  rng:120, fan:10, rate:2.5}},\r\n  // same ocean as scenario 1 — only the hydrophone moves, up above the fan's upper turning depth\r\n  shadow      :{name:'Shadow zone',        d:{src:1300, rcvd:300,  rng:200, fan:14, axis:1300, eps:7.37, rate:2.5}},\r\n};\r\n\r\n/* ============================================================ state */\r\nconst S={\r\n  scen:'deepchannel', playing:false, t:0, rate:2.5,\r\n  // controls\r\n  src:1300, rcvd:1300, rng:300, fan:12, axisSet:1300, eps:0.00737, mld:120,\r\n  cp:[[0,0],[300,0],[1300,0],[3000,0],[5000,0]],   // hand-dragged c(z) offsets, m/s\r\n  ov:{rays:true, wf:true, env:true, prof:true},\r\n  // derived medium\r\n  axisZ:1300, axisC:C_MUNK1, cMin:C_MUNK1, cMax:C_MUNK1+50,\r\n  // derived acoustics (rebuilt by retrace / recomputeEig)\r\n  xMax:375000, ridx:RIDX0, maxDucted:0, drawn:[], eig:[], tl:null,\r\n  pan:0, span:375000,\r\n  // transient caches\r\n  _peak:null, _srcUserMoved:false, _res:null,\r\n};\r\n\r\n/* the traced fan, as flat typed arrays: index i*NR + k */\r\nconst RX = new Float64Array(NR);            // range grid, m\r\nconst gZ = new Float32Array(NRAY*NR);       // depth of ray i at range k\r\nconst gT = new Float32Array(NRAY*NR);       // travel time\r\nconst gS = new Int16Array(NRAY*NR);         // surface reflections so far\r\nconst gB = new Int16Array(NRAY*NR);         // bottom reflections so far\r\nconst gN = new Int16Array(NRAY*NR);         // turning points so far\r\nconst gA = new Uint8Array(NRAY*NR);         // 1 once the ray has reached this range\r\nconst TH = new Float64Array(NRAY);          // launch angles, rad (+ = downward)\r\n\r\n/* ============================================================ the ray kernel\r\n * One ray, refracted layer by layer. Inside a layer c is linear, so the path is an exact\r\n * circular arc of radius R = c/(g·cosθ) and the ray invariant  cosθ(z)/c(z) = ξ  is conserved\r\n * by construction. Everything else in the piece — the drawn fan, the eigenrays, the arrival\r\n * train, the transmission-loss curve and the up-front prediction — is built from this one\r\n * function, so the picture and the numbers cannot drift apart.\r\n *\r\n *   x = (sinθa − sinθb) / (ξ·g·u)          u = +1 descending, −1 ascending\r\n *   t = ln[(1+sinθa)·cb / ((1+sinθb)·ca)] / (g·u)\r\n */\r\nfunction traceRay(th0, zs, xMax, idx, poly, samples){\r\n  const zStart = clamp(zs, 0.5, D_OCEAN-0.5);\r\n  const c0 = cAt(zStart);\r\n  const xi = Math.cos(Math.abs(th0))/Math.max(c0,1e-3);   // the ray invariant\r\n  let z=zStart, x=0, t=0, u = th0>=0 ? 1 : -1;\r\n  let ns=0, nb=0, nt=0, turnUp=NaN, turnDn=NaN;\r\n  const ev=[];                                            // range at each \"starts descending\" event\r\n  const base = idx>=0 ? idx*NR : 0;\r\n  let k=0;\r\n  if(idx>=0){ gZ[base]=z; gT[base]=0; gS[base]=0; gB[base]=0; gN[base]=0; gA[base]=1; k=1; }\r\n  if(poly){ poly.x=[0]; poly.z=[z]; poly.t=[0]; }\r\n  if(samples) samples.push({x:0, z, thDeg:Math.abs(th0)/DEG});\r\n\r\n  for(let step=0; step<16000 && x<xMax; step++){\r\n    const li = clamp(Math.floor(z/DZ_LAYER + (u>0?1e-9:-1e-9)), 0, NLAY-1);\r\n    const zT = u>0 ? (li+1)*DZ_LAYER : li*DZ_LAYER;       // layer boundary we head for\r\n    const cA_ = cAt(z), cB_ = cAt(zT);\r\n    const dzL = zT - z;\r\n    const g = Math.abs(dzL)<1e-9 ? 0 : (cB_-cA_)/dzL;\r\n    let cosA = clamp(xi*cA_, -1, 1), sinA = Math.sqrt(Math.max(1-cosA*cosA, 0));\r\n    let turned=false, zEnd, cEnd, sinB, dx, dt;\r\n\r\n    if(Math.abs(g)>1e-12){\r\n      const cTurn = 1/xi;\r\n      if(xi*cB_ >= 1 && cB_ > cA_){                       // turning point inside this layer\r\n        turned=true; zEnd = z + (cTurn-cA_)/g; cEnd=cTurn; sinB=0;\r\n      }else{\r\n        zEnd = zT; cEnd = cB_; sinB = Math.sqrt(Math.max(1-Math.min(xi*cB_,1)**2, 0));\r\n      }\r\n      dx = (sinA - sinB)/(xi*g*u);\r\n      dt = Math.log(Math.max((1+sinA)*cEnd/Math.max((1+sinB)*cA_,1e-9), 1e-12))/(g*u);\r\n    }else{                                                // isovelocity layer: a straight line\r\n      zEnd = zT; cEnd = cA_; sinB = sinA;\r\n      const sA = Math.max(sinA, 1e-7);\r\n      dx = Math.abs(dzL)*cosA/sA;\r\n      dt = Math.abs(dzL)/(sA*cA_);\r\n    }\r\n    if(!(dx>0) || !isFinite(dx) || !isFinite(dt)){ dx=Math.max(dx||0,1e-3); dt=Math.max(dt||0,1e-6); }\r\n    dx = Math.min(dx, 4e6); dt = Math.min(dt, 4e4);\r\n\r\n    // --- resample onto the uniform range grid, using the exact arc inside the step ---\r\n    if(idx>=0){\r\n      while(k<NR && RX[k] <= x+dx){\r\n        const dd = RX[k]-x;\r\n        let zk, tk;\r\n        if(Math.abs(g)>1e-12){\r\n          const sK = clamp(sinA - dd*xi*g*u, 0, 1);\r\n          const cK = Math.sqrt(Math.max(1-sK*sK,0))/xi;\r\n          zk = z + (cK-cA_)/g;\r\n          tk = t + Math.log(Math.max((1+sinA)*cK/Math.max((1+sK)*cA_,1e-9),1e-12))/(g*u);\r\n        }else{\r\n          const sA = Math.max(sinA,1e-7);\r\n          zk = z + u*dd*sA/Math.max(cosA,1e-9);\r\n          tk = t + dd/Math.max(cosA*cA_,1e-9);\r\n        }\r\n        const p=base+k;\r\n        gZ[p]=clamp(zk,0,D_OCEAN); gT[p]=tk; gS[p]=ns; gB[p]=nb; gN[p]=nt; gA[p]=1;\r\n        k++;\r\n      }\r\n    }\r\n    x += dx; t += dt; z = zEnd;\r\n    if(poly && (step%2===0 || turned)){ poly.x.push(x); poly.z.push(z); poly.t.push(t); }\r\n    if(samples) samples.push({x, z, thDeg:Math.asin(clamp(sinB,0,1))/DEG});\r\n\r\n    if(turned){\r\n      nt++;\r\n      if(u>0){ if(!isFinite(turnDn)) turnDn=z; u=-1; }\r\n      else   { if(!isFinite(turnUp)) turnUp=z; u=1; ev.push(x); }\r\n    }else if(z<=1e-6){                                    // surface reflection\r\n      ns++; u=1; z=0; ev.push(x);\r\n    }else if(z>=D_OCEAN-1e-6){                            // seabed reflection\r\n      nb++; u=-1; z=D_OCEAN;\r\n    }\r\n  }\r\n  if(idx>=0) for(; k<NR; k++){ const p=base+k; gZ[p]=z; gT[p]=t; gS[p]=ns; gB[p]=nb; gN[p]=nt; gA[p]=0; }\r\n  const cycle = ev.length>=2 ? ev[1]-ev[0] : NaN;\r\n  return {th0, xi, c0, zs:zStart, ns, nb, nt, turnUp, turnDn, cycle,\r\n          ducted: ns===0 && nb===0 && nt>0, xEnd:x, tEnd:t};\r\n}\r\n\r\n/* ============================================================ trace the whole fan */\r\n// a heavily bouncing ray can be tens of thousands of segments long; thin it for drawing only,\r\n// never for the physics (the resampled grid above is untouched)\r\nfunction decimate(p){\r\n  const n=p.x.length; if(n<=1200) return;\r\n  const st=Math.ceil(n/1200), X=[],Z=[],T=[];\r\n  for(let j=0;j<n;j+=st){ X.push(p.x[j]); Z.push(p.z[j]); T.push(p.t[j]); }\r\n  X.push(p.x[n-1]); Z.push(p.z[n-1]); T.push(p.t[n-1]);\r\n  p.x=X; p.z=Z; p.t=T;\r\n}\r\nfunction retrace(){\r\n  buildProfile();\r\n  S.xMax = S.rng*1000/RECV_FRAC;\r\n  for(let k=0;k<NR;k++) RX[k]=S.xMax*k/(NR-1);\r\n  S.ridx = RIDX0;\r\n  const h = S.fan*DEG;\r\n  S.drawn.length=0;\r\n  let maxD=0;\r\n  for(let i=0;i<NRAY;i++){\r\n    // half-step offset: no ray is launched at exactly 0°, which would be a degenerate eigenray\r\n    TH[i] = -h + 2*h*(i+0.5)/NRAY;\r\n    const wantPoly = (i%DRAW_EVERY===0);\r\n    const poly = wantPoly ? {} : null;\r\n    const r = traceRay(TH[i], S.src, S.xMax, i, poly, null);\r\n    if(poly){ poly.info=r; decimate(poly); S.drawn.push(poly); }\r\n    // furthest range at which this ray is still trapped: turned at least once, never touched\r\n    // the surface or the seabed\r\n    for(let k=NR-1;k>=0;k--){\r\n      const p=i*NR+k;\r\n      if(gA[p] && gS[p]===0 && gB[p]===0 && gN[p]>0){ if(RX[k]>maxD) maxD=RX[k]; break; }\r\n    }\r\n  }\r\n  S.maxDucted = maxD;\r\n  // the steepest downgoing ray, kept for the cycle-distance and turning-depth readouts\r\n  S._probe = traceRay(TH[NRAY-1], S.src, S.xMax, -1, null, null);\r\n  recomputeEig();\r\n}\r\n\r\n/* ---- eigenrays: where a ray of the fan crosses the hydrophone depth at its range ---- */\r\nfunction eigenraysAt(k, zr){\r\n  const R = Math.max(RX[k], 1);\r\n  const out=[];\r\n  for(let i=0;i<NRAY-1;i++){\r\n    const p=i*NR+k, q=(i+1)*NR+k;\r\n    if(!gA[p] || !gA[q]) continue;\r\n    const f0=gZ[p]-zr, f1=gZ[q]-zr;\r\n    if(!(f0*f1<0)) continue;                              // strict sign change = one eigenray\r\n    const w = f0/(f0-f1);\r\n    const th0 = lerp(TH[i],TH[i+1],w);\r\n    const tt  = lerp(gT[p],gT[q],w);\r\n    const dzdth = (gZ[q]-gZ[p])/Math.max(TH[i+1]-TH[i],1e-9);\r\n    const ns = w<0.5?gS[p]:gS[q], nb = w<0.5?gB[p]:gB[q], nt = w<0.5?gN[p]:gN[q];\r\n    // ray-tube spreading: I ∝ cosθ₀ / (R·|∂z/∂θ₀|).  In isovelocity water ∂z/∂θ₀ = R/cos²θ₀,\r\n    // which returns exactly 20·log R — spherical spreading — so the plot's guide slopes are real.\r\n    const TL = 10*log10(Math.max(R*Math.abs(dzdth)/Math.max(Math.cos(th0),1e-3), 1e-6))\r\n             + BOT_LOSS_DB*nb + SURF_LOSS_DB*ns + ALPHA_DB_KM*(R/1000);\r\n    if(!isFinite(TL) || !isFinite(tt)) continue;\r\n    out.push({t:tt, TL, th0, ns, nb, nt, ducted: ns===0&&nb===0&&nt>0});\r\n  }\r\n  out.sort((a,b)=>a.t-b.t);\r\n  if(!out.length) return out;\r\n  // keep what a hydrophone would actually resolve: the arrivals within 45 dB of the strongest\r\n  let best=Infinity; for(const e of out) if(e.TL<best) best=e.TL;\r\n  return out.filter(e=>e.TL <= best+45).slice(0,40);\r\n}\r\nconst sumTL = eig => eig.length ? -10*log10(eig.reduce((s,e)=>s+Math.pow(10,-e.TL/10),0)) : NaN;\r\n\r\nfunction recomputeEig(){\r\n  S.eig = eigenraysAt(S.ridx, S.rcvd);\r\n  // transmission loss vs range at the hydrophone depth (the second plot)\r\n  const tl=new Float64Array(NR);\r\n  for(let k=1;k<NR;k++) tl[k]=sumTL(eigenraysAt(k,S.rcvd));\r\n  tl[0]=tl[1]; S.tl=tl;\r\n  S._peak = bestListening();\r\n}\r\n\r\n// Predict, from the profile and the source alone, WHERE at this range the sound is loudest and\r\n// how loud — before the run has played out. Same kernel as everything else.\r\nfunction bestListening(){\r\n  let bz=NaN, bTL=Infinity;\r\n  const probe=[];\r\n  for(let z=12.5; z<D_OCEAN; z+=25) probe.push(z);\r\n  probe.push(S.axisZ, S.src);         // the two depths the physics singles out — a coarse grid\r\n  for(const z of probe){              // straddles the axis peak and would under-read the best\r\n    if(z<=0 || z>=D_OCEAN) continue;\r\n    const v=sumTL(eigenraysAt(S.ridx,z));\r\n    if(isFinite(v) && v<bTL){ bTL=v; bz=z; }\r\n  }\r\n  return {z:bz, TL:bTL, R:RX[S.ridx]};\r\n}\r\n\r\n/* ============================================================ time model */\r\n// The timeline is propagation time. Nothing is \"heard\" until S.t passes its travel time, so\r\n// scrubbing to a pre-arrival instant can never show a phantom arrival.\r\nfunction simDuration(){\r\n  if(S.eig.length) return S.eig[S.eig.length-1].t*1.02 + 1.5;\r\n  return (RX[S.ridx]/Math.max(S.cMin,1))*1.35 + 4;\r\n}\r\nfunction computeObserver(){\r\n  const eig=S.eig, R={\r\n    state:'', shadow:false, starved:false, ducted:false, nArr:0, nGeo:eig.length,\r\n    tFirst:NaN, tLast:NaN, spread:NaN, TL:NaN, arrived:[], countdown:NaN,\r\n  };\r\n  if(!eig.length){\r\n    R.shadow=true;\r\n    R.state='shadow zone — no ray reaches here';\r\n    return R;\r\n  }\r\n  const arr = eig.filter(e=>e.t<=S.t);\r\n  R.arrived=arr; R.nArr=arr.length;\r\n  if(!arr.length){\r\n    R.countdown = eig[0].t - S.t;\r\n    R.state=`listening — first arrival in ≈ ${R.countdown.toFixed(1)} s`;\r\n    return R;\r\n  }\r\n  R.tFirst=arr[0].t; R.tLast=arr[arr.length-1].t; R.spread=R.tLast-R.tFirst;\r\n  R.TL=sumTL(arr);\r\n  R.ducted = arr.some(e=>e.ducted);\r\n  R.state = R.ducted ? 'trapped in the channel — ducted'\r\n                     : 'not ducted — surface & bottom bounces';\r\n  // A shadow zone is ray-STARVED, not always ray-free: a spot the geometry leaves with at most\r\n  // one feeble path while some other depth at the same range is being showered with them.\r\n  // `S._peak.TL` is the best loss anywhere in the column at this range, so the gap is measurable.\r\n  const best = S._peak && isFinite(S._peak.TL) ? S._peak.TL : NaN;\r\n  if(isFinite(best) && isFinite(R.TL) && R.nGeo<=1 && (R.TL-best)>=SHADOW_DB){\r\n    R.starved=true;\r\n    R.state=`shadow zone — ray-starved, ${(R.TL-best).toFixed(0)} dB below the best depth here`;\r\n  }\r\n  return R;\r\n}\r\n\r\n/* ============================================================ canvases */\r\nconst main2d=document.getElementById('main2d'), g2=main2d.getContext('2d');\r\nconst c3d=document.getElementById('c3d'), g3=c3d.getContext('2d');\r\nconst cArr=document.getElementById('cArr'), gAr=cArr.getContext('2d');\r\nconst cTL=document.getElementById('cTL'), gTl=cTL.getContext('2d');\r\nlet DPR=1, W=0,H=0, W3=0,H3=0, WA=0,HA=0, WT=0,HT=0;\r\nfunction fit(cv,ctx){\r\n  DPR=Math.min(window.devicePixelRatio||1,2);\r\n  const r=cv.getBoundingClientRect();\r\n  cv.width=Math.max(1,Math.round(r.width*DPR));\r\n  cv.height=Math.max(1,Math.round(r.height*DPR));\r\n  ctx.setTransform(DPR,0,0,DPR,0,0);\r\n  return [r.width,r.height];\r\n}\r\nfunction resize(){\r\n  [W,H]=fit(main2d,g2); [W3,H3]=fit(c3d,g3);\r\n  [WA,HA]=fit(cArr,gAr); [WT,HT]=fit(cTL,gTl);\r\n  draw();\r\n}\r\nwindow.addEventListener('resize',resize);\r\nconst cssMono=()=>getComputedStyle(document.body).getPropertyValue('--mono');\r\n\r\n/* ---- world <-> screen for the range–depth section ----\r\n   Range and depth CANNOT share one scale here: a ducted ray leans over by at most ~13°, so at\r\n   1:1 a 300 km section would be a hairline. The stage is therefore vertically exaggerated by\r\n   `cam.vex`, printed on the stage; the 1:1 inset carries the true angles. */\r\nconst PW=158;                                   // width of the c(z) panel, px\r\nlet cam={x0:0, span:1, sx:1, sy:1, top:26, vex:1};\r\nfunction updateCam(){\r\n  cam.span = clamp(S.span, S.xMax/60, S.xMax);\r\n  cam.x0   = clamp(S.pan, 0, Math.max(S.xMax-cam.span, 0));\r\n  cam.sx   = Math.max(W-PW-14,10)/cam.span;\r\n  cam.top  = 26;\r\n  cam.sy   = Math.max(H-cam.top-28,10)/D_OCEAN;\r\n  cam.vex  = cam.sy/cam.sx;\r\n}\r\nconst sxp = wx => PW + (wx-cam.x0)*cam.sx;\r\nconst syp = wz => cam.top + wz*cam.sy;\r\nconst wxFromPx = px => cam.x0 + (px-PW)/cam.sx;\r\nconst wzFromPy = py => (py-cam.top)/cam.sy;\r\n// the c(z) panel maps the whole profile's speed range across the panel width\r\nconst cLo = () => S.cMin - 3, cHi = () => S.cMax + 3;\r\nconst cxp = c => 14 + (c-cLo())/Math.max(cHi()-cLo(),1e-6)*(PW-30);\r\nconst cFromPx = px => cLo() + (px-14)/Math.max(PW-30,1)*(cHi()-cLo());\r\n\r\n/* ============================================================ 2D DRAW */\r\nfunction draw(){\r\n  updateCam();\r\n  const R=S._res;\r\n\r\n  // water column\r\n  const grd=g2.createLinearGradient(0,syp(0),0,syp(D_OCEAN));\r\n  grd.addColorStop(0,'#0a1a2c'); grd.addColorStop(0.5,'#070e1c'); grd.addColorStop(1,'#04070f');\r\n  g2.fillStyle='#04060b'; g2.fillRect(0,0,W,H);\r\n  g2.fillStyle=grd; g2.fillRect(PW,syp(0),W-PW,syp(D_OCEAN)-syp(0));\r\n\r\n  // surface + seabed\r\n  g2.strokeStyle='rgba(150,190,230,.45)'; g2.lineWidth=1.5;\r\n  g2.beginPath(); g2.moveTo(PW,syp(0)); g2.lineTo(W,syp(0)); g2.stroke();\r\n  g2.fillStyle='#0a0d14'; g2.fillRect(PW,syp(D_OCEAN),W-PW,H-syp(D_OCEAN));\r\n  g2.strokeStyle='rgba(160,140,110,.45)';\r\n  g2.beginPath(); g2.moveTo(PW,syp(D_OCEAN)); g2.lineTo(W,syp(D_OCEAN)); g2.stroke();\r\n  g2.font='9px '+cssMono(); g2.fillStyle='rgba(150,170,200,.45)';\r\n  g2.fillText('SEA SURFACE', PW+8, syp(0)-4);\r\n  g2.fillText(`SEABED · ${(D_OCEAN/1000).toFixed(0)} km`, PW+8, syp(D_OCEAN)+12);\r\n\r\n  // depth grid + range ticks\r\n  g2.font='9px '+cssMono();\r\n  for(let z=1000;z<D_OCEAN;z+=1000){\r\n    const y=syp(z);\r\n    g2.strokeStyle='rgba(120,150,190,.09)'; g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(PW,y); g2.lineTo(W,y); g2.stroke();\r\n    g2.fillStyle='rgba(150,170,200,.35)'; g2.fillText(`${z} m`, W-46, y-3);\r\n  }\r\n  const spanKm=cam.span/1000;\r\n  const stepKm = spanKm>400?100: spanKm>200?50: spanKm>80?20: spanKm>30?10: spanKm>12?5:2;\r\n  g2.fillStyle='rgba(150,170,200,.4)';\r\n  for(let km=Math.ceil(cam.x0/1000/stepKm)*stepKm; km*1000<cam.x0+cam.span; km+=stepKm){\r\n    const X=sxp(km*1000); if(X<PW-2||X>W) continue;\r\n    g2.strokeStyle='rgba(120,150,190,.14)';\r\n    g2.beginPath(); g2.moveTo(X,syp(D_OCEAN)); g2.lineTo(X,syp(D_OCEAN)-6); g2.stroke();\r\n    g2.fillText(km+' km', X+3, syp(D_OCEAN)-9);\r\n  }\r\n\r\n  // channel axis\r\n  if(S.ov.prof){\r\n    const y=syp(S.axisZ);\r\n    g2.strokeStyle='rgba(251,191,36,.35)'; g2.setLineDash([6,5]); g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(PW,y); g2.lineTo(W,y); g2.stroke(); g2.setLineDash([]);\r\n    g2.fillStyle='rgba(251,191,36,.65)';\r\n    g2.fillText(`CHANNEL AXIS · ${S.axisZ.toFixed(0)} m · c_min ${S.axisC.toFixed(1)} m/s`, PW+8, y-4);\r\n  }\r\n\r\n  if(S.ov.rays) drawRays();\r\n  if(S.ov.env)  drawEnvelope();\r\n  if(S.ov.wf)   drawWavefront();\r\n\r\n  drawPredicted(R);\r\n  drawSource();\r\n  drawReceiver(R);\r\n\r\n  // vertical exaggeration disclosure — the drawn angles are NOT the true angles\r\n  g2.fillStyle='rgba(150,170,200,.55)'; g2.font='9px '+cssMono();\r\n  g2.fillText(`VERTICAL EXAGGERATION ×${cam.vex.toFixed(0)} at this window shape — drawn ray angles are steepened; the 1:1 inset is true`,\r\n    PW+8, H-8);\r\n\r\n  if(S.ov.prof) drawProfilePanel();\r\n  drawInset();\r\n  drawArrivals();\r\n  drawTLPlot();\r\n  updateReadouts();\r\n}\r\n\r\n/* the fan itself — the physically meaningful object (the duct) is the EMERGENT envelope of\r\n   these individually traced rays, not a shape asserted on top of them */\r\nfunction drawRays(){\r\n  for(const p of S.drawn){\r\n    const info=p.info;\r\n    const col = info.nb>0 ? 'rgba(248,113,113,'   // touched the seabed\r\n              : info.ns>0 ? 'rgba(125,155,195,'   // touched the surface\r\n                          : 'rgba(251,191,36,';   // trapped: never touches either\r\n    g2.strokeStyle=col+(info.ducted?0.8:0.5)+')';\r\n    g2.lineWidth=info.ducted?1.2:1.0;\r\n    g2.beginPath();\r\n    let started=false, drewAny=false;\r\n    for(let j=0;j<p.x.length;j++){\r\n      if(p.t[j]>S.t){                       // stop at the current propagation time\r\n        if(j>0){\r\n          const f=(S.t-p.t[j-1])/Math.max(p.t[j]-p.t[j-1],1e-9);\r\n          const X=sxp(lerp(p.x[j-1],p.x[j],f)), Y=syp(lerp(p.z[j-1],p.z[j],f));\r\n          g2.lineTo(X,Y); drewAny=true;\r\n        }\r\n        break;\r\n      }\r\n      const X=sxp(p.x[j]), Y=syp(p.z[j]);\r\n      if(!started){ g2.moveTo(X,Y); started=true; } else g2.lineTo(X,Y);\r\n      drewAny=true;\r\n    }\r\n    if(drewAny) g2.stroke();\r\n  }\r\n}\r\n\r\n// the wavefront: the locus of \"where each ray is right now\". It is never stored — it is drawn\r\n// by joining the current point of every drawn ray, exactly as the fan defines it.\r\nfunction drawWavefront(){\r\n  const pts=[];\r\n  for(const p of S.drawn){\r\n    let j=1; while(j<p.t.length && p.t[j]<S.t) j++;\r\n    if(j>=p.t.length) continue;\r\n    const f=(S.t-p.t[j-1])/Math.max(p.t[j]-p.t[j-1],1e-9);\r\n    if(f<0||f>1) continue;\r\n    pts.push([sxp(lerp(p.x[j-1],p.x[j],f)), syp(lerp(p.z[j-1],p.z[j],f))]);\r\n  }\r\n  if(pts.length<2) return;\r\n  g2.strokeStyle='rgba(56,189,248,.85)'; g2.lineWidth=1.6;\r\n  g2.beginPath(); pts.forEach((q,i)=>i?g2.lineTo(q[0],q[1]):g2.moveTo(q[0],q[1])); g2.stroke();\r\n  g2.fillStyle='rgba(56,189,248,.9)';\r\n  for(const q of pts){ g2.beginPath(); g2.arc(q[0],q[1],1.6,0,7); g2.fill(); }\r\n  const last=pts[pts.length-1];\r\n  g2.font='9px '+cssMono();\r\n  g2.fillText(`WAVEFRONT · t = ${S.t.toFixed(1)} s`, clamp(last[0]+8,PW+8,W-150), last[1]-6);\r\n}\r\n\r\n// caustics: the upper and lower turning depths of the fan bound where any sound can be\r\nfunction drawEnvelope(){\r\n  let zHi=Infinity, zLo=-Infinity;\r\n  for(let i=0;i<NRAY;i++){\r\n    for(let k=0;k<NR;k+=4){\r\n      const p=i*NR+k; if(!gA[p]) break;\r\n      if(gZ[p]<zHi) zHi=gZ[p];\r\n      if(gZ[p]>zLo) zLo=gZ[p];\r\n    }\r\n  }\r\n  if(!isFinite(zHi)||!isFinite(zLo)) return;\r\n  g2.strokeStyle='rgba(167,139,250,.45)'; g2.setLineDash([3,4]); g2.lineWidth=1;\r\n  for(const z of [zHi,zLo]){\r\n    const y=syp(z);\r\n    g2.beginPath(); g2.moveTo(PW,y); g2.lineTo(W,y); g2.stroke();\r\n  }\r\n  g2.setLineDash([]);\r\n  g2.fillStyle='rgba(167,139,250,.6)'; g2.font='9px '+cssMono();\r\n  g2.fillText(`turning-point envelope · ${zHi.toFixed(0)}–${zLo.toFixed(0)} m — no ray of this fan leaves it`,\r\n    PW+8, syp(zHi)+12);\r\n}\r\n\r\nfunction drawPredicted(R){\r\n  const pk=S._peak; if(!pk||!isFinite(pk.z)) return;\r\n  const X=sxp(pk.R), Y=syp(pk.z);\r\n  if(X<PW||X>W) return;\r\n  g2.strokeStyle='rgba(248,113,113,.55)'; g2.setLineDash([3,3]); g2.lineWidth=1;\r\n  g2.beginPath(); g2.moveTo(X-12,Y); g2.lineTo(X+12,Y); g2.moveTo(X,Y-12); g2.lineTo(X,Y+12); g2.stroke();\r\n  g2.setLineDash([]);\r\n  g2.fillStyle='rgba(248,113,113,.75)'; g2.font='9px '+cssMono();\r\n  g2.fillText(`predicted best listening depth · ≈ ${pk.TL.toFixed(0)} dB`, X-190, Y-6);\r\n}\r\nfunction drawSource(){\r\n  const X=sxp(0), Y=syp(S.src);\r\n  g2.strokeStyle='#38bdf8'; g2.fillStyle='rgba(56,189,248,.9)'; g2.lineWidth=2;\r\n  g2.beginPath(); g2.arc(X,Y,4.5,0,7); g2.fill();\r\n  g2.beginPath(); g2.arc(X,Y,9,0,7); g2.stroke();\r\n  g2.font='9px '+cssMono(); g2.fillText(`source ${S.src.toFixed(0)} m`, X+12, Y-8);\r\n}\r\nfunction drawReceiver(R){\r\n  const X=sxp(RX[S.ridx]), Y=syp(S.rcvd);\r\n  const hot = R && R.nArr>0 && !R.starved;\r\n  g2.strokeStyle = R&&(R.shadow||R.starved) ? '#f87171' : hot?'#fff':'#34d399';\r\n  g2.fillStyle   = R&&(R.shadow||R.starved) ? 'rgba(248,113,113,.9)' : hot?'rgba(255,255,255,.95)':'rgba(52,211,153,.9)';\r\n  g2.lineWidth=2;\r\n  g2.beginPath(); g2.arc(X,Y,4.5,0,7); g2.fill();\r\n  g2.beginPath(); g2.moveTo(X,Y-9); g2.lineTo(X,Y+9); g2.stroke();\r\n  g2.font='9px '+cssMono();\r\n  g2.fillText(`hydrophone ${S.rcvd.toFixed(0)} m`, X-104, Y+16);\r\n  if(R && (R.shadow||R.starved)){\r\n    g2.fillStyle='rgba(248,113,113,.95)'; g2.font='10px '+cssMono();\r\n    g2.fillText(R.shadow ? 'SHADOW ZONE — no ray path reaches this spot'\r\n      : 'SHADOW ZONE — ray-starved; the loud water is a few hundred metres away',\r\n      clamp(X-300,PW+6,W-360), Y-14);\r\n  }else if(hot && R.nArr>=3){\r\n    g2.fillStyle='rgba(52,211,153,.9)'; g2.font='10px '+cssMono();\r\n    g2.fillText(`${R.nArr} ARRIVALS — one click, many paths`, clamp(X-250,PW+6,W-300), Y-14);\r\n  }\r\n}\r\n\r\n/* the c(z) panel: the medium itself, dragged by hand */\r\nfunction drawProfilePanel(){\r\n  g2.fillStyle='rgba(8,12,22,.97)'; g2.fillRect(0,0,PW,H);\r\n  g2.strokeStyle='rgba(27,36,54,1)';\r\n  g2.beginPath(); g2.moveTo(PW-0.5,0); g2.lineTo(PW-0.5,H); g2.stroke();\r\n  g2.font='9px '+cssMono(); g2.fillStyle='rgba(150,170,200,.5)';\r\n  g2.fillText('c(z)  m/s', 12, 14);\r\n  g2.fillText(cLo().toFixed(0), 8, H-6);\r\n  g2.fillText(cHi().toFixed(0), PW-38, H-6);\r\n  // the profile\r\n  g2.strokeStyle='rgba(56,189,248,.9)'; g2.lineWidth=1.8;\r\n  g2.beginPath();\r\n  for(let i=0;i<=NLAY;i++){\r\n    const X=cxp(LAYC[i]), Y=syp(i*DZ_LAYER);\r\n    i?g2.lineTo(X,Y):g2.moveTo(X,Y);\r\n  }\r\n  g2.stroke();\r\n  // the minimum\r\n  g2.strokeStyle='rgba(251,191,36,.5)'; g2.setLineDash([4,4]);\r\n  g2.beginPath(); g2.moveTo(4,syp(S.axisZ)); g2.lineTo(PW-4,syp(S.axisZ)); g2.stroke(); g2.setLineDash([]);\r\n  // draggable control points\r\n  for(let i=0;i<S.cp.length;i++){\r\n    const z=S.cp[i][0], X=cxp(rawC(z)), Y=syp(z);\r\n    g2.fillStyle = S.cp[i][1]!==0 ? 'rgba(251,191,36,.95)' : 'rgba(56,189,248,.95)';\r\n    g2.beginPath(); g2.arc(X,Y,4,0,7); g2.fill();\r\n    g2.strokeStyle='rgba(255,255,255,.35)'; g2.lineWidth=1;\r\n    g2.beginPath(); g2.arc(X,Y,7,0,7); g2.stroke();\r\n  }\r\n  // source & receiver depth ticks\r\n  for(const [z,col] of [[S.src,'rgba(56,189,248,.7)'],[S.rcvd,'rgba(52,211,153,.7)']]){\r\n    g2.strokeStyle=col; g2.lineWidth=1;\r\n    g2.beginPath(); g2.moveTo(0,syp(z)); g2.lineTo(7,syp(z)); g2.stroke();\r\n  }\r\n}\r\n\r\n/* ============================================================ 1:1 INSET (hand-rolled)\r\n   The same fan, near the source, with range and depth on ONE scale — so the angles here are\r\n   the real angles. A trapped ray leans over by only a few degrees; that is the point. */\r\nfunction drawInset(){\r\n  g3.clearRect(0,0,W3,H3);\r\n  g3.fillStyle='#070b14'; g3.fillRect(0,0,W3,H3);\r\n  const Xw=6000, sc=W3/Xw, Dh=H3/sc/2;\r\n  const z0=clamp(S.src-Dh, 0-Dh*0.15, D_OCEAN), zc=clamp(S.src, 0, D_OCEAN);\r\n  const top=zc-Dh;\r\n  const px=wx=>wx*sc, py=wz=>(wz-top)*sc;\r\n  if(top<0){ g3.strokeStyle='rgba(150,190,230,.4)'; g3.lineWidth=1;\r\n    g3.beginPath(); g3.moveTo(0,py(0)); g3.lineTo(W3,py(0)); g3.stroke(); }\r\n  if(top+2*Dh>D_OCEAN){ g3.strokeStyle='rgba(160,140,110,.4)'; g3.lineWidth=1;\r\n    g3.beginPath(); g3.moveTo(0,py(D_OCEAN)); g3.lineTo(W3,py(D_OCEAN)); g3.stroke(); }\r\n  for(const p of S.drawn){\r\n    g3.strokeStyle = p.info.ducted?'rgba(251,191,36,.75)':'rgba(125,155,195,.5)';\r\n    g3.lineWidth=1;\r\n    g3.beginPath();\r\n    let st=false;\r\n    for(let j=0;j<p.x.length;j++){\r\n      if(p.x[j]>Xw*1.05) break;\r\n      if(p.t[j]>S.t) break;\r\n      const X=px(p.x[j]), Y=py(p.z[j]);\r\n      if(!st){ g3.moveTo(X,Y); st=true; } else g3.lineTo(X,Y);\r\n    }\r\n    if(st) g3.stroke();\r\n  }\r\n  g3.fillStyle='rgba(56,189,248,.95)';\r\n  g3.beginPath(); g3.arc(px(0),py(zc),3,0,7); g3.fill();\r\n  g3.fillStyle='rgba(150,170,200,.55)'; g3.font='9px '+cssMono();\r\n  g3.fillText(`±${S.fan.toFixed(1)}°  ·  ${(Xw/1000).toFixed(0)} km wide, 1:1`, 8, H3-8);\r\n}\r\n\r\n/* ============================================================ ARRIVAL TRAIN (the lived signal) */\r\nfunction drawArrivals(){\r\n  gAr.clearRect(0,0,WA,HA);\r\n  gAr.fillStyle='#070a12'; gAr.fillRect(0,0,WA,HA);\r\n  const padL=46,padR=14,padT=36,padB=24;\r\n  const x0=padL,x1=WA-padR,y0=HA-padB,y1=padT;\r\n  gAr.strokeStyle='rgba(120,150,190,.18)'; gAr.lineWidth=1;\r\n  gAr.beginPath(); gAr.moveTo(x0,y1); gAr.lineTo(x0,y0); gAr.lineTo(x1,y0); gAr.stroke();\r\n  gAr.fillStyle='rgba(150,170,200,.5)'; gAr.font='9px '+cssMono();\r\n  gAr.fillText('amplitude',6,y1-6); gAr.fillText('arrival time →',x1-84,HA-8);\r\n  const R=S._res;\r\n  if(!R || !R.arrived.length){\r\n    gAr.fillStyle='rgba(150,170,200,.45)';\r\n    const msg = !R ? 'no rays traced yet'\r\n      : R.shadow ? 'shadow zone — no ray path reaches the hydrophone at all'\r\n      : `listening — first arrival in ≈ ${R.countdown.toFixed(1)} s   (nothing heard yet)`;\r\n    gAr.fillText(msg, x0+8, (y0+y1)/2);\r\n    return;\r\n  }\r\n  const arr=R.arrived;\r\n  const tA=arr[0].t, span=Math.max(R.spread*1.25, 0.35);\r\n  const tp=t=>x0+((t-tA)/span)*(x1-x0);\r\n  let best=Infinity; for(const e of arr) if(e.TL<best) best=e.TL;\r\n  const amp=e=>Math.pow(10,-(e.TL-best)/20);\r\n  for(const e of arr){\r\n    const X=tp(e.t); if(X<x0-1||X>x1+1) continue;\r\n    const hgt=(y0-y1-6)*clamp(amp(e),0.015,1);\r\n    const col = e.nb>0 ? 'rgba(248,113,113,.9)' : e.ns>0 ? 'rgba(125,155,195,.9)' : 'rgba(251,191,36,.95)';\r\n    gAr.strokeStyle=col; gAr.lineWidth=2;\r\n    gAr.beginPath(); gAr.moveTo(X,y0); gAr.lineTo(X,y0-hgt); gAr.stroke();\r\n    gAr.fillStyle=col; gAr.beginPath(); gAr.arc(X,y0-hgt,2,0,7); gAr.fill();\r\n  }\r\n  // playhead: the arrivals appear one at a time as propagation time passes them\r\n  const XP=tp(S.t);\r\n  if(XP>=x0&&XP<=x1){\r\n    gAr.strokeStyle='rgba(255,255,255,.75)'; gAr.lineWidth=1;\r\n    gAr.beginPath(); gAr.moveTo(XP,y1); gAr.lineTo(XP,y0); gAr.stroke();\r\n  }\r\n  gAr.fillStyle='rgba(150,170,200,.6)'; gAr.font='9px '+cssMono();\r\n  gAr.fillText(`${arr.length} arrivals  ·  first ${tA.toFixed(1)} s  ·  spread ${(R.spread*1000).toFixed(0)} ms  ·  ${R.TL.toFixed(0)} dB`, x0+8, HA-8);\r\n  gAr.fillStyle='rgba(251,191,36,.75)';\r\n  gAr.fillText('amber = trapped   grey = surface-reflected   red = bottom-bounce', x0+8, y1-6);\r\n  // time ticks\r\n  gAr.fillStyle='rgba(150,170,200,.4)';\r\n  for(let f=0;f<=1.0001;f+=0.25){\r\n    const X=x0+f*(x1-x0);\r\n    gAr.fillText(`+${(f*span).toFixed(2)}s`, X-16, y0+12);\r\n  }\r\n}\r\n\r\n/* ============================================================ TRANSMISSION LOSS PLOT */\r\nfunction drawTLPlot(){\r\n  gTl.clearRect(0,0,WT,HT);\r\n  gTl.fillStyle='#070a12'; gTl.fillRect(0,0,WT,HT);\r\n  const padL=46,padR=14,padT=36,padB=24;\r\n  const x0=padL,x1=WT-padR,y0=HT-padB,y1=padT;\r\n  gTl.strokeStyle='rgba(120,150,190,.18)'; gTl.lineWidth=1;\r\n  gTl.beginPath(); gTl.moveTo(x0,y1); gTl.lineTo(x0,y0); gTl.lineTo(x1,y0); gTl.stroke();\r\n  gTl.fillStyle='rgba(150,170,200,.5)'; gTl.font='9px '+cssMono();\r\n  gTl.fillText('TL [dB]',6,y1-6); gTl.fillText('range (log) →',x1-78,HT-8);\r\n  if(!S.tl){ return; }\r\n  const rMin=Math.max(RX[1],200), rMax=S.xMax;\r\n  const lo=log10(rMin), hi=log10(rMax);\r\n  const X=r=>x0+(log10(clamp(r,rMin,rMax))-lo)/Math.max(hi-lo,1e-6)*(x1-x0);\r\n  let tMin=Infinity,tMax=-Infinity;\r\n  for(let k=1;k<NR;k++){ const v=S.tl[k]; if(isFinite(v)){ if(v<tMin)tMin=v; if(v>tMax)tMax=v; } }\r\n  if(!isFinite(tMin)){ tMin=40; tMax=120; }\r\n  tMin=Math.min(tMin, 20*log10(rMin)); tMax=Math.max(tMax, 20*log10(rMax));\r\n  const dLo=tMin-4, dHi=tMax+4;\r\n  const Y=d=>y0-(dHi-clamp(d,dLo,dHi))/Math.max(dHi-dLo,1e-6)*(y0-y1);   // more loss = lower\r\n  // grid\r\n  gTl.fillStyle='rgba(150,170,200,.45)';\r\n  for(const rk of [0.2,1,3,10,30,100,300,1000]){\r\n    const r=rk*1000; if(r<rMin||r>rMax) continue;\r\n    gTl.strokeStyle='rgba(120,150,190,.10)';\r\n    gTl.beginPath(); gTl.moveTo(X(r),y1); gTl.lineTo(X(r),y0); gTl.stroke();\r\n    gTl.fillText((rk<1?rk*1000+' m':rk+' km'), X(r)-10, y0+12);\r\n  }\r\n  for(let d=Math.ceil(dLo/20)*20; d<dHi; d+=20){\r\n    gTl.strokeStyle='rgba(120,150,190,.10)';\r\n    gTl.beginPath(); gTl.moveTo(x0,Y(d)); gTl.lineTo(x1,Y(d)); gTl.stroke();\r\n    gTl.fillText(d+'', x0-30, Y(d)+3);\r\n  }\r\n  // reference slopes\r\n  const guide=(f,col,lab,yoff)=>{\r\n    gTl.strokeStyle=col; gTl.setLineDash([4,4]); gTl.lineWidth=1;\r\n    gTl.beginPath();\r\n    for(let i=0;i<=60;i++){ const r=Math.pow(10, lo+(hi-lo)*i/60);\r\n      i?gTl.lineTo(X(r),Y(f(r))):gTl.moveTo(X(r),Y(f(r))); }\r\n    gTl.stroke(); gTl.setLineDash([]);\r\n    gTl.fillStyle=col; gTl.fillText(lab, x1-136, Y(f(rMax))+yoff);\r\n  };\r\n  guide(r=>20*log10(r), 'rgba(248,113,113,.55)', '20 log R  spherical', -4);\r\n  guide(r=>10*log10(r)+30, 'rgba(52,211,153,.55)', '10 log R  cylindrical (ducted)', 12);\r\n  // the measured curve\r\n  gTl.strokeStyle='rgba(251,191,36,.95)'; gTl.lineWidth=1.8;\r\n  gTl.beginPath();\r\n  let st=false;\r\n  for(let k=1;k<NR;k++){\r\n    const v=S.tl[k]; if(!isFinite(v)){ st=false; continue; }\r\n    const px=X(RX[k]), py=Y(v);\r\n    if(!st){ gTl.moveTo(px,py); st=true; } else gTl.lineTo(px,py);\r\n  }\r\n  gTl.stroke();\r\n  // the hydrophone\r\n  const R=S._res;\r\n  const vr=S.tl[S.ridx];\r\n  if(isFinite(vr)){\r\n    gTl.fillStyle=(R&&R.nArr>0)?'#fff':'#34d399';\r\n    gTl.beginPath(); gTl.arc(X(RX[S.ridx]),Y(vr),4,0,7); gTl.fill();\r\n    gTl.fillStyle='rgba(230,238,247,.9)';\r\n    gTl.fillText(`hydrophone ≈ ${vr.toFixed(0)} dB @ ${(RX[S.ridx]/1000).toFixed(0)} km`, x0+8, y1-6);\r\n  }else{\r\n    gTl.fillStyle='rgba(248,113,113,.8)';\r\n    gTl.fillText('hydrophone: no ray path (shadow zone)', x0+8, y1-6);\r\n  }\r\n}\r\n\r\n/* ============================================================ READOUTS */\r\nfunction readRow(k,v,cls,tip){\r\n  const t = tip ? ` title=\"${tip}\"` : '';\r\n  return `<dt${t}>${k}<\/dt><dd class=\"${cls||''}\"${t}>${v}<\/dd>`;\r\n}\r\nfunction updateReadouts(){\r\n  const R=S._res; if(!R){ rdl.innerHTML=''; return; }\r\n  const pk=S._peak;\r\n  let rows='';\r\n  rows+=readRow('⌖ Best listening depth',\r\n    pk&&isFinite(pk.z) ? `${pk.z.toFixed(0)} m` : '— none at this range', '',\r\n    'Worked out up front from the profile and the source alone — the depth at this range with the least transmission loss, before the run has played out');\r\n  rows+=readRow('   loss there', pk&&isFinite(pk.TL)?`≈ ${pk.TL.toFixed(0)} dB`:'—', 'hi');\r\n  rows+='<div class=\"sep\"><\/div>';\r\n  rows+=readRow('Scenario', SCEN[S.scen].name);\r\n  rows+=readRow('Channel axis', `${S.axisZ.toFixed(0)} m · ${S.axisC.toFixed(1)} m/s`, 'hi',\r\n    'Depth of the sound-speed MINIMUM in the current profile — the axis of the duct. Mid-latitude oceans put it near 1000–1300 m');\r\n  rows+=readRow('c at source', `${cAt(S.src).toFixed(1)} m/s`, '',\r\n    'Sound speed at the source depth, read straight off the layered c(z) the rays are marched through');\r\n  rows+=readRow('Source depth', `${S.src.toFixed(0)} m`);\r\n  rows+=readRow('Hydrophone', `${(RX[S.ridx]/1000).toFixed(1)} km · ${S.rcvd.toFixed(0)} m`);\r\n  rows+='<div class=\"sep\"><\/div>';\r\n  const stCls = (R.shadow||R.starved)?'warn':R.ducted?'ok':R.nArr?'':'ok';\r\n  rows+=readRow('Duct state', R.state, stCls,\r\n    'Ducted = at least one arriving ray turned back before it could touch the surface or the seabed, so it loses nothing to either');\r\n  rows+=readRow('Max ducted range', `${(S.maxDucted/1000).toFixed(1)} km${S.maxDucted>0?'':' · none trapped'}`,\r\n    S.maxDucted>0?'ok':'warn',\r\n    'Furthest range at which some ray of the fan is still trapped — it has turned at least once and never touched the surface or the seabed');\r\n  rows+=readRow('Arrivals', R.nArr>0?`${R.nArr}${R.nGeo>R.nArr?` of ${R.nGeo}`:''}`:'—',\r\n    R.nArr>=3?'hi':'',\r\n    'How many separate ray paths have reached the hydrophone SO FAR. Nothing is counted before its travel time has elapsed');\r\n  rows+=readRow('First arrival', R.nArr?`${R.tFirst.toFixed(2)} s`:'—');\r\n  rows+=readRow('Arrival spread', R.nArr?`${(R.spread*1000).toFixed(0)} ms`:'—', '',\r\n    'Last arrival minus first — how drawn out the click has become after all these paths');\r\n  rows+=readRow('Transmission loss', R.nArr?`${R.TL.toFixed(0)} dB`:'—', R.nArr?'hi':'',\r\n    'Decibels fainter than 1 m from the source, summed over every arrival. +20 dB ≈ ten times fainter in pressure');\r\n  rows+='<div class=\"sep\"><\/div>';\r\n  const r0=probeRay();\r\n  rows+=readRow('Cycle distance', isFinite(r0.cycle)?`${(r0.cycle/1000).toFixed(1)} km`:'—', '',\r\n    'Horizontal period of the steepest ray in the fan — surface bounce to surface bounce, or turning point to turning point');\r\n  rows+=readRow('Turning depths',\r\n    (isFinite(r0.turnUp)?r0.turnUp.toFixed(0):'—')+' ↕ '+(isFinite(r0.turnDn)?r0.turnDn.toFixed(0):'—')+' m', '',\r\n    'Where that ray goes momentarily horizontal: c(z) = c_source / cos θ₀ — the one exact relation here');\r\n  rows+=readRow('Vertical exaggeration', `×${cam.vex.toFixed(0)}`, '',\r\n    'The stage stretches depth against range by this factor, so drawn angles are steeper than the real ones. The 1:1 inset shows the true fan');\r\n  rdl.innerHTML=rows;\r\n}\r\n// the steepest downgoing ray of the fan, re-traced on demand (cheap, and never cached stale)\r\nfunction probeRay(){ return S._probe || {cycle:NaN,turnUp:NaN,turnDn:NaN}; }\r\n\r\n/* ============================================================ LOOP */\r\nlet lastTS=0;\r\nfunction frame(ts){\r\n  requestAnimationFrame(frame);\r\n  const dtReal=Math.min((ts-lastTS)/1000||0, 0.05); lastTS=ts;\r\n  if(S.playing){\r\n    // fixed sub-steps so the animation is frame-rate independent\r\n    const dt=dtReal*S.rate*TSCALE;\r\n    const D=simDuration();\r\n    S.t=Math.min(S.t+dt, D);\r\n    if(S.t>=D){ S.playing=false; playBtn.textContent='▶ Play'; }\r\n    syncProg();\r\n  }\r\n  S._res=computeObserver();\r\n  draw();\r\n}\r\n\r\n/* ============================================================ UI WIRING */\r\nconst $=id=>document.getElementById(id);\r\nconst playBtn=$('playBtn'), rdl=$('rdl');\r\nfunction syncProg(){\r\n  const D=Math.max(simDuration(), S.t, 1e-3);\r\n  $('prog').value=clamp(S.t/D,0,1);\r\n  $('progV').textContent=`${S.t.toFixed(1)} / ${D.toFixed(0)} s`;\r\n}\r\n// Scrubbing must equal playing. rebuildTo(t) replays the deterministic ray march from scratch\r\n// and then sets the clock, so landing on t by dragging gives exactly the frame that playing to\r\n// t would have given — the rays are a pure function of the profile, the source and the fan.\r\nfunction rebuildTo(tt){ retrace(); S.t=tt; }\r\nfunction resetSim(){\r\n  S.t=0; S.playing=false; S.pan=0;\r\n  retrace(); S.span=S.xMax;\r\n  playBtn.textContent='▶ Play';\r\n  S._res=computeObserver(); syncProg(); draw();\r\n}\r\nconst reparam=()=>{ retrace(); S._res=computeObserver(); syncProg(); if(!S.playing) draw(); };\r\nconst nudge  =()=>{ recomputeEig(); S._res=computeObserver(); syncProg(); if(!S.playing) draw(); };\r\n\r\nplayBtn.onclick=()=>{ S.playing=!S.playing; playBtn.textContent=S.playing?'❚❚ Pause':'▶ Play'; };\r\n$('restartBtn').onclick=()=>{ S.t=0; S.playing=false; playBtn.textContent='▶ Play';\r\n  S._res=computeObserver(); syncProg(); draw(); };\r\n$('prog').oninput=e=>{\r\n  S.playing=false; playBtn.textContent='▶ Play';\r\n  const D=simDuration();\r\n  rebuildTo(parseFloat(e.target.value)*D);\r\n  S._res=computeObserver(); syncProg(); draw();\r\n};\r\n\r\nfunction refreshSliderLabels(){\r\n  $('rateV').textContent=S.rate.toFixed(2)+'×';\r\n  $('srcV').textContent=S.src.toFixed(0)+' m';\r\n  $('fanV').textContent=S.fan.toFixed(1)+'°';\r\n  $('rngV').textContent=S.rng.toFixed(0)+' km';\r\n  $('rcvdV').textContent=S.rcvd.toFixed(0)+' m';\r\n  $('axisV').textContent=S.axisSet.toFixed(0)+' m';\r\n  $('epsV').textContent=(S.eps*1000).toFixed(2)+' ×10⁻³';\r\n  $('mldV').textContent=S.mld.toFixed(0)+' m';\r\n}\r\n$('rate').oninput=e=>{S.rate=parseFloat(e.target.value);refreshSliderLabels();};\r\n$('src') .oninput=e=>{S.src=parseFloat(e.target.value);S._srcUserMoved=true;refreshSliderLabels();reparam();};\r\n$('fan') .oninput=e=>{S.fan=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('rng') .oninput=e=>{S.rng=parseFloat(e.target.value);refreshSliderLabels();S.pan=0;reparam();S.span=S.xMax;};\r\n$('rcvd').oninput=e=>{S.rcvd=parseFloat(e.target.value);refreshSliderLabels();nudge();};\r\n$('axis').oninput=e=>{S.axisSet=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('eps') .oninput=e=>{S.eps=parseFloat(e.target.value)/1000;refreshSliderLabels();reparam();};\r\n$('mld') .oninput=e=>{S.mld=parseFloat(e.target.value);refreshSliderLabels();reparam();};\r\n$('cpReset').onclick=()=>{ for(const p of S.cp) p[1]=0; reparam(); };\r\n\r\n$('oRays').onchange=e=>{S.ov.rays=e.target.checked;draw();};\r\n$('oWf')  .onchange=e=>{S.ov.wf  =e.target.checked;draw();};\r\n$('oEnv') .onchange=e=>{S.ov.env =e.target.checked;draw();};\r\n$('oProf').onchange=e=>{S.ov.prof=e.target.checked;draw();};\r\n\r\n/* tabs re-key everything: per-scenario defaults, clear the hand-drags, then reset */\r\ndocument.querySelectorAll('#tabs button').forEach(b=>{\r\n  b.onclick=()=>{\r\n    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));\r\n    b.classList.add('on');\r\n    S.scen=b.dataset.s;\r\n    document.querySelectorAll('[data-scen]').forEach(el=>{\r\n      el.style.display = el.dataset.scen.split(' ').includes(S.scen)?'':'none';\r\n    });\r\n    const D=SCEN[S.scen].d;\r\n    for(const p of S.cp) p[1]=0;\r\n    if(D.rate!=null) S.rate=D.rate;\r\n    if(D.src !=null) S.src =D.src;\r\n    if(D.rcvd!=null) S.rcvd=D.rcvd;\r\n    if(D.rng !=null) S.rng =D.rng;\r\n    if(D.fan !=null) S.fan =D.fan;\r\n    if(D.axis!=null) S.axisSet=D.axis;\r\n    if(D.eps !=null) S.eps =D.eps/1000;\r\n    if(D.mld !=null) S.mld =D.mld;\r\n    S._srcUserMoved=false;\r\n    $('rate').value=S.rate; $('src').value=S.src; $('rcvd').value=S.rcvd;\r\n    $('rng').value=S.rng;   $('fan').value=S.fan; $('axis').value=S.axisSet;\r\n    $('eps').value=(S.eps*1000).toFixed(2); $('mld').value=S.mld;\r\n    refreshSliderLabels();\r\n    resetSim();\r\n  };\r\n});\r\n\r\n/* ---- the stage is directly manipulable ---- */\r\nlet dragMode=null, dragCp=-1, lastMx=0;\r\nmain2d.addEventListener('mousedown',e=>{\r\n  const r=main2d.getBoundingClientRect();\r\n  const px=e.clientX-r.left, py=e.clientY-r.top;\r\n  lastMx=e.clientX; dragMode=null; dragCp=-1;\r\n  if(S.ov.prof && px<PW){\r\n    for(let i=0;i<S.cp.length;i++){\r\n      if(Math.hypot(px-cxp(rawC(S.cp[i][0])), py-syp(S.cp[i][0]))<11){ dragMode='cp'; dragCp=i; break; }\r\n    }\r\n    if(!dragMode) return;\r\n  }else if(Math.hypot(px-sxp(RX[S.ridx]), py-syp(S.rcvd))<16) dragMode='rcv';\r\n  else if(Math.hypot(px-sxp(0), py-syp(S.src))<16) dragMode='src';\r\n  else dragMode='pan';\r\n  document.body.style.cursor = dragMode==='pan'?'grabbing':'crosshair';\r\n  e.preventDefault();\r\n});\r\nwindow.addEventListener('mousemove',e=>{\r\n  if(!dragMode) return;\r\n  const r=main2d.getBoundingClientRect();\r\n  const px=e.clientX-r.left, py=e.clientY-r.top;\r\n  if(dragMode==='cp'){\r\n    const z=S.cp[dragCp][0];\r\n    S.cp[dragCp][1]=clamp(cFromPx(px)-presetC(z), -25, 25);\r\n    retrace();\r\n  }else if(dragMode==='rcv'){\r\n    S.rcvd=clamp(Math.round(wzFromPy(py)/10)*10, 10, D_OCEAN-10);\r\n    const wx=clamp(wxFromPx(px), RX[1], S.xMax);\r\n    S.ridx=clamp(Math.round(wx/(S.xMax/(NR-1))), 1, NR-1);\r\n    S.rng=clamp(Math.round(RX[S.ridx]/1000), 5, 500);\r\n    $('rcvd').value=S.rcvd; $('rng').value=S.rng; refreshSliderLabels();\r\n    recomputeEig();\r\n  }else if(dragMode==='src'){\r\n    S.src=clamp(Math.round(wzFromPy(py)/10)*10, 10, D_OCEAN-100);\r\n    S._srcUserMoved=true; $('src').value=S.src; refreshSliderLabels();\r\n    retrace();\r\n  }else{\r\n    S.pan -= (e.clientX-lastMx)/cam.sx; lastMx=e.clientX;\r\n  }\r\n  S._res=computeObserver(); syncProg(); if(!S.playing) draw();\r\n});\r\nwindow.addEventListener('mouseup',()=>{\r\n  if(dragMode==='rcv'){ retrace(); S._res=computeObserver(); syncProg(); if(!S.playing) draw(); }\r\n  dragMode=null; dragCp=-1; document.body.style.cursor='';\r\n});\r\nmain2d.addEventListener('dblclick',()=>{ S.pan=0; S.span=S.xMax; if(!S.playing) draw(); });\r\nmain2d.addEventListener('wheel',e=>{\r\n  e.preventDefault();\r\n  const r=main2d.getBoundingClientRect();\r\n  const wx=wxFromPx(e.clientX-r.left);\r\n  S.span=clamp(S.span*(e.deltaY>0?1.18:1/1.18), S.xMax/60, S.xMax);\r\n  S.pan=clamp(wx-(e.clientX-r.left-PW)/(Math.max(W-PW-14,10)/S.span), 0, Math.max(S.xMax-S.span,0));\r\n  if(!S.playing) draw();\r\n},{passive:false});\r\n$('panL').onclick=()=>{ S.pan=clamp(S.pan-0.18*cam.span,0,Math.max(S.xMax-cam.span,0)); if(!S.playing)draw(); };\r\n$('panR').onclick=()=>{ S.pan=clamp(S.pan+0.18*cam.span,0,Math.max(S.xMax-cam.span,0)); if(!S.playing)draw(); };\r\n$('recenter').onclick=()=>{ S.pan=0; S.span=S.xMax; if(!S.playing)draw(); };\r\n\r\n/* ---- verification hook: one ray, with its (z, θ) samples, so the ray invariant and the\r\n   turning-point condition can be checked from outside ---- */\r\nwindow.__ray=function(i){\r\n  const idx=clamp(Math.round(i),0,NRAY-1);\r\n  const samples=[];\r\n  const r=traceRay(TH[idx], S.src, S.xMax, -1, null, samples);\r\n  return {th0Deg:TH[idx]/DEG, zs:r.zs, c0:r.c0, xi:r.xi, dzLayer:DZ_LAYER,\r\n          turnUp:r.turnUp, turnDn:r.turnDn, cycle:r.cycle, ducted:r.ducted,\r\n          ns:r.ns, nb:r.nb, nt:r.nt, xEnd:r.xEnd,\r\n          // CONSECUTIVE marched points (x,z) — the integrated ray path, so the ray invariant can\r\n          // be re-measured from the geometry instead of from the angle the march carries along\r\n          samples:samples.slice(0,600)};\r\n};\r\nwindow.__nray=NRAY;\r\n\r\n/* ============================================================ go */\r\ndocument.querySelectorAll('[data-scen]').forEach(el=>{\r\n  el.style.display = el.dataset.scen.split(' ').includes(S.scen)?'':'none';\r\n});\r\nresize();\r\ndocument.querySelector('#tabs button.on').click();   // first paint runs the scenario-switch path\r\nrequestAnimationFrame(frame);\r\n<\/script>\r\n","roadster":"<title>Tesla Roadster · Air &amp; Suction<\/title>\r\n<style>\r\n  /* Dark instrument panel for the chrome; the 3-D stage itself is 8-bit synthwave (see header comment in the script). */\r\n  :root{\r\n    color-scheme:dark;\r\n    --bg:#06080d; --panel:#0b0f1a; --panel2:#0e1424; --line:#1b2436;\r\n    --ink:#c9d4e3; --dim:#7c8aa0; --faint:#4a5568;\r\n    --cyan:#38bdf8; --amber:#fbbf24; --green:#34d399; --red:#f87171; --violet:#a78bfa; --pink:#ff2e97;\r\n    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,\"Liberation Mono\",monospace;\r\n    --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;\r\n  }\r\n  *{box-sizing:border-box}\r\n  html,body{margin:0;height:100%}\r\n  body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:13px; line-height:1.5; overflow:hidden}\r\n  #app{display:flex; flex-direction:column; height:100vh; width:100vw}\r\n\r\n  header{display:flex; align-items:center; gap:14px 18px; padding:10px 16px; flex-wrap:wrap;\r\n    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0a0e18,#070a12); flex:0 0 auto}\r\n  header h1{font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin:0; color:#e6edf6}\r\n  header h1 span{color:var(--pink)}\r\n  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}\r\n  .tabs button{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--dim); background:var(--panel2);\r\n    border:1px solid var(--line); padding:7px 12px; border-radius:7px; cursor:pointer; transition:.15s}\r\n  .tabs button:hover{color:var(--ink); border-color:#2b3550}\r\n  .tabs button.on{color:#06202b; background:var(--cyan); border-color:var(--cyan); font-weight:600}\r\n\r\n  main{flex:1 1 auto; display:grid; grid-template-columns:250px 1fr; min-height:0}\r\n  aside{border-right:1px solid var(--line); background:var(--panel); padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:16px}\r\n  .grp{display:flex; flex-direction:column; gap:9px}\r\n  .grp h2{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);\r\n    margin:0 0 2px; border-bottom:1px solid var(--line); padding-bottom:6px}\r\n  .btns{display:flex; gap:6px; flex-wrap:wrap}\r\n  .btns button{flex:1; min-width:64px; font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--panel2);\r\n    border:1px solid var(--line); border-radius:6px; padding:8px 4px; cursor:pointer; transition:.15s}\r\n  .btns button:hover{border-color:var(--cyan); color:#fff}\r\n  .btns button.play{background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.4)}\r\n  .btns button.on{background:rgba(255,46,151,.16); border-color:rgba(255,46,151,.6); color:#fff}\r\n  label.fld{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim)}\r\n  label.fld .v{color:var(--ink); font-family:var(--mono); font-size:11px}\r\n  input[type=range]{width:100%; accent-color:var(--cyan); cursor:pointer}\r\n  label.chk{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); cursor:pointer}\r\n  label.chk input{accent-color:var(--cyan); cursor:pointer}\r\n  select{font-family:var(--mono); font-size:11px; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px}\r\n  .hint{font-size:10.5px; color:var(--faint); margin-top:2px}\r\n  .hide{display:none !important}\r\n\r\n  #stagewrap{position:relative; min-width:0; display:flex; flex-direction:column}\r\n  #stage{position:relative; flex:1 1 auto; min-height:0; background:#0d0221; overflow:hidden}\r\n  #gl{position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none}\r\n  #gl:active{cursor:grabbing}\r\n  #nogl{position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:40px;\r\n    font-family:var(--mono); color:var(--amber); background:#0d0221; z-index:2}\r\n  #inset{position:absolute; top:12px; right:10px; width:272px; height:190px; border:1px solid var(--line); border-radius:9px;\r\n    background:rgba(7,10,18,.94); z-index:3}\r\n  #inset canvas{position:absolute; inset:0; width:100%; height:100%; cursor:ns-resize}\r\n  .cap{position:absolute; left:9px; top:7px; font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); z-index:1; pointer-events:none}\r\n  #readouts{position:absolute; top:206px; right:10px; bottom:8px; width:322px; z-index:3; border:1px solid var(--line); border-radius:9px;\r\n    background:rgba(7,10,18,.95); padding:9px 12px; font-family:var(--mono); overflow-y:auto}\r\n  #readouts h3{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0 0 6px}\r\n  #readouts dl{display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin:0; font-size:10.5px}\r\n  #readouts dt{color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}\r\n  #readouts dt[title]{cursor:help; text-decoration:underline dotted var(--faint); text-underline-offset:2px}\r\n  #readouts dd{margin:0; text-align:right; color:var(--ink); white-space:nowrap}\r\n  #readouts dd.hi{color:var(--amber)} #readouts dd.warn{color:var(--red)} #readouts dd.ok{color:var(--green)}\r\n  #readouts .sep{grid-column:1/-1; height:1px; background:var(--line); margin:5px 0}\r\n  i.tg{font-style:normal; font-size:8px; letter-spacing:.06em; padding:0 3px; margin-left:5px; border-radius:3px; border:1px solid; vertical-align:1px; cursor:help}\r\n  i.tg.OFF{color:#34d399;border-color:#34d39966} i.tg.INT{color:#38bdf8;border-color:#38bdf866} i.tg.REP{color:#7aa2ff;border-color:#7aa2ff66}\r\n  i.tg.DER{color:#fbbf24;border-color:#fbbf2466} i.tg.EST{color:#a78bfa;border-color:#a78bfa66} i.tg.ASM{color:#f87171;border-color:#f8717166}\r\n\r\n  #plots{flex:0 0 150px; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border-top:1px solid var(--line)}\r\n  .plot{position:relative; background:#070a12}\r\n  .plot canvas{position:absolute; inset:0; width:100%; height:100%}\r\n\r\n  #explain{flex:0 0 auto; max-height:clamp(150px,22vh,260px); overflow-y:auto; border-top:1px solid var(--line); background:var(--panel);\r\n    padding:11px 16px 13px; display:grid; grid-template-columns:repeat(5,1fr); gap:12px}\r\n  #explain .ex{border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 12px; max-height:clamp(134px,20vh,240px); overflow-y:auto}\r\n  #explain .ex::-webkit-scrollbar{width:5px} #explain .ex::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}\r\n  #explain h4{margin:0 0 5px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--pink)}\r\n  #explain p{margin:5px 0 0; color:var(--dim); font-size:11.5px}\r\n  #explain p.cav{margin-top:6px; color:var(--faint); font-size:10px; font-style:italic; line-height:1.45}\r\n  #explain b{color:var(--ink); font-weight:600}\r\n  #explain code{font-family:var(--mono); color:var(--amber); font-size:11px}\r\n  @media (max-width:1100px){ #inset{display:none} #readouts{top:10px; width:280px} }\r\n  @media (max-width:1400px){ #explain{grid-template-columns:repeat(3,1fr); max-height:34vh} }\r\n  @media (max-width:820px){ #explain{grid-template-columns:1fr 1fr; max-height:40vh} }\r\n<\/style>\r\n\r\n<div id=\"app\">\r\n  <header>\r\n    <h1>Tesla&nbsp;<span>Roadster<\/span>&nbsp;·&nbsp;Air&nbsp;&amp;&nbsp;Suction<\/h1>\r\n    <div class=\"tabs\" id=\"tabs\">\r\n      <button data-s=\"air\" class=\"on\">1 · Air budget<\/button>\r\n      <button data-s=\"wall\">2 · Stick to the wall<\/button>\r\n    <\/div>\r\n  <\/header>\r\n  <main>\r\n    <aside>\r\n      <div class=\"grp\">\r\n        <h2>Playback<\/h2>\r\n        <div class=\"btns\"><button id=\"playBtn\" class=\"play\">▶ Play<\/button><button id=\"restartBtn\">↺ Restart<\/button><\/div>\r\n        <label class=\"fld\">Time rate <span class=\"v\" id=\"rateV\">1.00×<\/span><input type=\"range\" id=\"rate\" min=\"0.05\" max=\"3\" step=\"0.05\" value=\"1\"><\/label>\r\n        <label class=\"fld\">Timeline <span class=\"v\" id=\"progV\">0.00 s<\/span><input type=\"range\" id=\"prog\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\"><\/label>\r\n      <\/div>\r\n      <div class=\"grp\">\r\n        <h2>Run<\/h2>\r\n        <div class=\"btns\" id=\"presets\">\r\n          <button data-p=\"launch\" data-scen=\"air\" class=\"on\">0–60 launch<\/button>\r\n          <button data-p=\"hover\" data-scen=\"air\">Hover hop<\/button>\r\n          <button data-p=\"roll\" data-scen=\"air\">Barrel roll<\/button>\r\n          <button data-p=\"climb\" data-scen=\"wall\">Wall climb<\/button>\r\n          <button data-p=\"park\" data-scen=\"wall\">Park &amp; fade<\/button>\r\n          <button data-p=\"corner\" data-scen=\"wall\">2 g corner<\/button>\r\n        <\/div>\r\n      <\/div>\r\n      <div class=\"grp\" id=\"params\">\r\n        <h2>Parameters<\/h2>\r\n        <label class=\"fld\" data-scen=\"launch hover roll climb park\">Tank fill pressure <span class=\"v\" id=\"presV\"><\/span><input type=\"range\" id=\"pres\" min=\"200\" max=\"689\" step=\"1\" value=\"437\"><\/label>\r\n        <label class=\"fld\" data-scen=\"launch hover roll climb park\">Specific impulse <span class=\"v\" id=\"ispV\"><\/span><input type=\"range\" id=\"isp\" min=\"54\" max=\"70.7\" step=\"0.1\" value=\"60\"><\/label>\r\n        <label class=\"fld\" data-scen=\"launch hover roll climb park corner\">Car mass <span class=\"v\" id=\"massV\"><\/span><input type=\"range\" id=\"mass\" min=\"1700\" max=\"2350\" step=\"10\" value=\"1700\"><\/label>\r\n        <label class=\"fld\" data-scen=\"roll\">Drive-in speed <span class=\"v\" id=\"v0V\"><\/span><input type=\"range\" id=\"v0\" min=\"2\" max=\"12\" step=\"0.5\" value=\"7\"><\/label>\r\n        <label class=\"fld\" data-scen=\"roll\">Target height <span class=\"v\" id=\"apxV\"><\/span><input type=\"range\" id=\"apx\" min=\"3\" max=\"30\" step=\"0.1\" value=\"7.9\"><\/label>\r\n        <label class=\"fld\" data-scen=\"roll\">Roll time <span class=\"v\" id=\"rtV\"><\/span><input type=\"range\" id=\"rt\" min=\"1\" max=\"2.5\" step=\"0.1\" value=\"2\"><\/label>\r\n        <label class=\"fld\" data-scen=\"launch climb park corner\">Fan suction <span class=\"v\" id=\"supV\"><\/span><input type=\"range\" id=\"sup\" min=\"0\" max=\"2\" step=\"0.05\" value=\"2\"><\/label>\r\n        <label class=\"fld\" data-scen=\"launch climb park corner\">Tyre grip μ <span class=\"v\" id=\"muV\"><\/span><input type=\"range\" id=\"mu\" min=\"0.8\" max=\"1.4\" step=\"0.01\" value=\"1.26\"><\/label>\r\n        <label class=\"fld\" data-scen=\"climb\">Climb speed <span class=\"v\" id=\"vcV\"><\/span><input type=\"range\" id=\"vc\" min=\"2\" max=\"12\" step=\"0.5\" value=\"6\"><\/label>\r\n        <label class=\"fld\" data-scen=\"park\">Park at pitch <span class=\"v\" id=\"th0V\"><\/span><input type=\"range\" id=\"th0\" min=\"30\" max=\"180\" step=\"1\" value=\"180\"><\/label>\r\n        <label class=\"fld\" data-scen=\"park\">Fan fade rate <span class=\"v\" id=\"fadeV\"><\/span><input type=\"range\" id=\"fade\" min=\"0.1\" max=\"1\" step=\"0.05\" value=\"0.25\"><\/label>\r\n        <label class=\"chk\" data-scen=\"climb park corner\"><input type=\"checkbox\" id=\"fixed\"> Use Tesla's 4,700 kg readout (46.1 kN)<\/label>\r\n        <div class=\"hint\" id=\"hint\"><\/div>\r\n      <\/div>\r\n      <div class=\"grp\">\r\n        <h2>Overlays<\/h2>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ovForce\" checked> Force arrows<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ovPlume\" checked> Exhaust plume<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ovFlow\"> Underbody airflow<\/label>\r\n        <label class=\"chk\"><input type=\"checkbox\" id=\"ovXray\"> X-ray (tanks · fans · nozzles)<\/label>\r\n        <label class=\"chk\" data-scen=\"launch\"><input type=\"checkbox\" id=\"ovGhost\" checked> Ghost cars (claims)<\/label>\r\n      <\/div>\r\n      <div class=\"grp\">\r\n        <h2>View<\/h2>\r\n        <div class=\"btns\" id=\"cams\"><button data-c=\"chase\" class=\"on\">Chase<\/button><button data-c=\"pad\">Pad<\/button><button data-c=\"top\">Top<\/button><\/div>\r\n        <label class=\"fld\">Pixel size <select id=\"ps\"><option value=\"2\">2 px<\/option><option value=\"3\" selected>3 px<\/option><option value=\"4\">4 px<\/option><option value=\"6\">6 px<\/option><\/select><\/label>\r\n
