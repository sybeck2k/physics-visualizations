--line); border-top:1px solid var(--line);\n  }\n  .plot{position:relative; background:#070a12}\n  .plot canvas{position:absolute; inset:0; width:100%; height:100%}\n  .plot .cap{\n    position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:9px;\n    letter-spacing:.13em; text-transform:uppercase; color:var(--faint); z-index:1;\n  }\n\n  #explain{\n    flex:0 0 auto; max-height:clamp(180px,26vh,300px); overflow-y:auto; border-top:1px solid var(--line);\n    background:var(--panel); padding:11px 16px 13px; display:grid;\n    grid-template-columns:repeat(5,1fr); gap:12px;\n  }\n  #explain .ex{\n    border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 12px;\n    max-height:clamp(164px,24vh,280px); overflow-y:auto;\n  }\n  #explain .ex::-webkit-scrollbar{width:5px}\n  #explain .ex::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}\n  #explain h4{\n    margin:0 0 5px; font-family:var(--mono); font-size:10px;\n    letter-spacing:.1em; text-transform:uppercase; color:var(--cyan);\n  }\n  #explain p{margin:5px 0 0; color:var(--dim); font-size:11.5px}\n  #explain p.cav{margin-top:6px; color:var(--faint); font-size:10px; font-style:italic; line-height:1.45}\n  #explain b{color:var(--ink); font-weight:600}\n  #explain code{font-family:var(--mono); color:var(--amber); font-size:11px}\n  .hint{font-size:10.5px; color:var(--faint); margin-top:4px}\n  @media (max-width:1400px){ #explain{grid-template-columns:repeat(3,1fr); max-height:34vh} }\n  @media (max-width:820px){ #explain{grid-template-columns:1fr 1fr; max-height:40vh} }\n<\/style>\n\n<div id=\"app\">\n  <header>\n    <h1>Gravitational&nbsp;<span>Slingshot<\/span><\/h1>\n    <div class=\"tabs\" id=\"tabs\">\n      <button data-s=\"trailing\" class=\"on\">1 · Trailing pass<\/button>\n      <button data-s=\"leading\">2 · Leading pass<\/button>\n      <button data-s=\"retro\">3 · Retrograde arrival<\/button>\n      <button data-s=\"voyager\">4 · Voyager&nbsp;2 at Jupiter<\/button>\n    <\/div>\n  <\/header>\n\n  <main>\n    <aside>\n      <div class=\"grp\">\n        <h2>Simulation<\/h2>\n        <div class=\"btns\">\n          <button id=\"playBtn\" class=\"play\">▶ Play<\/button>\n          <button id=\"restartBtn\">↻ Restart<\/button>\n        <\/div>\n        <label class=\"fld\">Time rate <span class=\"v\" id=\"rateV\">1.00×<\/span>\n          <input type=\"range\" id=\"rate\" min=\"0.15\" max=\"5\" step=\"0.05\" value=\"1\">\n        <\/label>\n        <label class=\"fld\">Timeline <span class=\"v\" id=\"progV\">0 d<\/span>\n          <input type=\"range\" id=\"prog\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\">\n        <\/label>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>Aim the flyby<\/h2>\n        <label class=\"fld\">Approach speed v∞ <span class=\"v\" id=\"vinfV\">9.0 km/s<\/span>\n          <input type=\"range\" id=\"vinf\" min=\"2\" max=\"25\" step=\"0.1\" value=\"9\">\n        <\/label>\n        <label class=\"fld\">Impact parameter b <span class=\"v\" id=\"bV\">+12.0 R<sub>J<\/sub><\/span>\n          <input type=\"range\" id=\"b\" min=\"-30\" max=\"30\" step=\"0.5\" value=\"12\">\n        <\/label>\n        <label class=\"fld\">Arrival direction α <span class=\"v\" id=\"alphaV\">90°<\/span>\n          <input type=\"range\" id=\"alpha\" min=\"60\" max=\"180\" step=\"1\" value=\"90\">\n        <\/label>\n        <label class=\"fld\">Planet mass <span class=\"v\" id=\"mpV\">1.00 M<sub>J<\/sub><\/span>\n          <input type=\"range\" id=\"mp\" min=\"0.2\" max=\"4\" step=\"0.02\" value=\"1\">\n        <\/label>\n        <div class=\"hint\">b&nbsp;&gt;&nbsp;0 passes the <b>trailing<\/b> edge (behind the planet) · b&nbsp;&lt;&nbsp;0 the\n        <b>leading<\/b> edge. Scrub to the encounter, then drag the green&nbsp;⌖ aim point across the planet.<\/div>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>View<\/h2>\n        <div class=\"btns\">\n          <button id=\"panL\">◂ Pan<\/button>\n          <button id=\"panR\">Pan ▸<\/button>\n          <button id=\"recenter\">⊙ Center<\/button>\n        <\/div>\n        <div class=\"hint\">Drag empty space to pan · double‑click to recenter. The camera dives with\n        the probe: wide on the Sun far out, tight on the planet at closest approach.<\/div>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>Overlays<\/h2>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oPath\" checked> Integrated probe path<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oPf\" checked> Path in the planet's frame<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oHyp\" checked> Patched‑conic hyperbola<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oSoi\" checked> Encounter sphere<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oVec\" checked> Velocity vectors<\/label>\n      <\/div>\n    <\/aside>\n\n    <div id=\"stagewrap\">\n      <div id=\"stage\">\n        <canvas id=\"main2d\"><\/canvas>\n        <div id=\"inset3d\">\n          <span class=\"cap\">Velocity space (schematic)<\/span>\n          <canvas id=\"c3d\"><\/canvas>\n        <\/div>\n        <div id=\"readouts\">\n          <h3>Live readout<\/h3>\n          <dl id=\"rdl\"><\/dl>\n        <\/div>\n      <\/div>\n      <div id=\"plots\">\n        <div class=\"plot\">\n          <span class=\"cap\">Probe speed — Sun frame vs planet frame<\/span>\n          <canvas id=\"cSpeed\"><\/canvas>\n        <\/div>\n        <div class=\"plot\">\n          <span class=\"cap\">Δv (Sun frame) vs where you aim<\/span>\n          <canvas id=\"cGain\"><\/canvas>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <section id=\"explain\">\n    <div class=\"ex\">\n      <h4>The trick<\/h4>\n      <p>The probe falls into the planet's gravity well and climbs back out. It arrives at the well\n      with speed <code>w<\/code> relative to the planet and it leaves with <b>exactly that same\n      speed<\/b> — energy is conserved in the planet's frame. All the flyby does is <b>turn<\/b>\n      <code>w<\/code>, by <code>δ = 2·arcsin(1/e)<\/code>.<\/p>\n      <p>But the planet is <b>moving<\/b>, at 13.1 km/s. Your speed in the Sun's frame is\n      <code>v = v_planet + w<\/code>. Turn <code>w<\/code> so it points more nearly along\n      <code>v_planet<\/code> and that sum gets longer — you speed up ⇒ free Δv. Turn it the other way\n      and the sum shortens ⇒ you brake.<\/p>\n      <p>Nothing is free, of course: the probe pulls back on the planet just as hard, and Jupiter\n      loses exactly the momentum the probe gains — about one part in 10²⁵ of its orbit.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>What the probe measures<\/h4>\n      <p>Watch the two speed curves. The <b>green<\/b> one is what an observer riding on the planet\n      sees: it rises as the probe falls in, peaks at closest approach, and comes back down to\n      <b>the value it started at<\/b>. Nothing happened. The encounter is elastic.<\/p>\n      <p>The <b>amber<\/b> one is the same motion in the Sun's frame — and it <b>steps<\/b>. Same\n      probe, same instant, two frames, two different stories. The gain is real, and it is\n      frame‑dependent: it is momentum borrowed from the planet's orbit.<\/p>\n      <p>Between the two, read the <b>Frame check<\/b> row: it prints how far apart the planet‑frame\n      in and out speeds actually came out in the integration.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>Where you aim<\/h4>\n      <p>Two numbers set everything. <b>b<\/b>, the impact parameter, is how far off‑centre your\n      incoming line misses the planet: small b ⇒ a deep pass ⇒ a big turn <code>δ<\/code>. And the\n      <b>sign<\/b> of b picks the side.<\/p>\n      <p>Pass the <b>trailing<\/b> edge — the side the planet is retreating from — and the planet\n      tows you forward: <b>boost<\/b>. Pass the <b>leading<\/b> edge and it pulls you backwards:\n      <b>brake<\/b>. The right‑hand plot sweeps b across both sides at your current settings, so you\n      can see the whole aim curve before you fly it.<\/p>\n      <p>Aim too deep and you hit the planet — the red band on that plot. That, not physics, is the\n      real limit on how much a single flyby can buy you.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>Real missions<\/h4>\n      <p><b>Voyager 2 at Jupiter, July 1979.<\/b> Its speed relative to the Sun rose from about\n      <b>10 km/s<\/b> to about <b>25 km/s<\/b> across the encounter (NASA/JPL trajectory data) — a\n      ~15 km/s gain no rocket it could carry would have given it. That single pass put it on a\n      solar‑escape orbit; Saturn, Uranus and Neptune followed.<\/p>\n      <p><b>Parker Solar Probe<\/b> runs the trick backwards: seven <b>leading‑edge<\/b> Venus flybys,\n      each one <i>shedding<\/i> speed, to drop its perihelion inside 10 solar radii. <b>Cassini<\/b>\n      strung together Venus–Venus–Earth–Jupiter to reach Saturn.<\/p>\n      <p class=\"cav\">Model caveats: the planet rides a perfect circular, coplanar orbit and the probe\n      is massless, so this is the circular restricted three‑body problem, not an ephemeris. The\n      Voyager preset reproduces the published speed change with a deeper ~4 R_J pass than the real\n      ~10 R_J, because the true approach was out of plane. The inset is a schematic. Treat every\n      figure as an engineering estimate, ±~10%.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>Reading the units<\/h4>\n      <p><b>km/s — speed.<\/b> Earth circles the Sun at 30 km/s, Jupiter at 13.1. A chemical upper\n      stage buys a deep‑space probe maybe 3–4 km/s of <b>propellant<\/b> budget in its whole life. So\n      <code>+10 km/s<\/code> from one flyby is worth roughly a decade of rocket you could never\n      launch — which is why every outer‑planet mission flies one.<\/p>\n      <p><b>MJ/kg — specific orbital energy.<\/b> <code>ε = v²/2 − GM☉/r<\/code>, energy per kilogram\n      of spacecraft. Negative ⇒ bound to the Sun. Zero ⇒ exactly escaping. Positive ⇒ gone. Jupiter\n      moved Voyager 2 from about −28 to +3 MJ/kg.<\/p>\n      <p><b>R_J — Jupiter radii, 71 492 km.<\/b> How close you skim. Aim at the trailing edge — the\n      side the planet is moving away from, so you are pushed from <b>behind<\/b> — and you gain; aim\n      ahead of it and you pay.<\/p>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============================================================ constants */\nconst G      = 6.67430e-11;        // m³ kg⁻¹ s⁻²   Newtonian constant (CODATA 2018)\nconst MSUN   = 1.98892e30;         // kg            solar mass\nconst MJUP   = 1.89813e27;         // kg            Jupiter mass\nconst RJUP   = 71.492e6;           // m             Jupiter equatorial radius\nconst AORB   = 7.78479e11;         // m             Jupiter semi-major axis (5.2044 AU)\nconst AU     = 1.495978707e11;     // m\nconst DAY    = 86400;              // s\nconst GMS    = G * MSUN;           // m³/s²         1.3275e20\nconst OMEGA  = Math.sqrt(GMS / (AORB * AORB * AORB));   // rad/s  mean motion\nconst VPL    = OMEGA * AORB;       // m/s           13 056 — Jupiter's orbital speed\nconst VESC   = Math.sqrt(2 * GMS / AORB);               // m/s  18 468 — solar escape at 5.2 AU\nconst THETA0 = 0.5 * Math.PI;      // rad           planet phase at t = 0\nconst STEP_CAP = 900000;           // hard ceiling on integration steps per run\nconst RUN_WALL = 22;               // s of wall clock for one full run at rate 1×\n\n/* ============================================================ medium: the Sun's field + the planet's circular orbit */\n// The planet is held on an exact circular Kepler orbit; the probe is massless.\n// That is the circular restricted three-body problem — the standard model for a flyby.\nconst pPos = t => { const th = THETA0 + OMEGA * t; return [AORB * Math.cos(th), AORB * Math.sin(th)]; };\nconst pVel = t => { const th = THETA0 + OMEGA * t; return [-VPL * Math.sin(th), VPL * Math.cos(th)]; };\n// Laplace sphere of influence, r_SOI = a·(m/M)^(2/5); we measure the encounter at a quarter of it,\n// where the planet outpulls the Sun's tidal term by >100× and the two-body conic is excellent.\nconst soiOf  = mpJ => AORB * Math.pow(mpJ * MJUP / MSUN, 0.4);\nconst rencOf = mpJ => 0.25 * soiOf(mpJ);\n\n/* ============================================================ helpers */\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nconst lerp  = (a, b, t) => a + (b - a) * t;\nconst smooth = t => t * t * t * (t * (t * 6 - 15) + 10);\nfunction rot(x, y, ang){ const c = Math.cos(ang), s = Math.sin(ang); return [x * c - y * s, x * s + y * c]; }\nconst fin = v => (typeof v === 'number' && isFinite(v));\nconst kms = v => fin(v) ? (v / 1000).toFixed(2) + ' km/s' : '—';\n// planet-frame speeds get an extra digit: the claim being made about them is an equality\nconst kms3 = v => fin(v) ? (v / 1000).toFixed(3) + ' km/s' : '—';\nconst sgnk = v => fin(v) ? (v >= 0 ? '+' : '−') + Math.abs(v / 1000).toFixed(2) + ' km/s' : '—';\n\n/* ============================================================ the shared flyby kernel\n   One closed-form patched-conic solution, used by (a) the initial conditions, (b) the up-front\n   prediction printed before the run plays, (c) the analytic hyperbola overlay and (d) the\n   Δv-vs-b curve — so the prediction and the thing predicted can't drift apart. */\nfunction flyby(vinfMS, bRJ, mpJ, alphaDeg){\n  const mu = G * mpJ * MJUP;\n  const v  = Math.max(vinfMS, 50);\n  const a  = mu / (v * v);                       // |semi-major axis| of the hyperbola\n  const b  = bRJ * RJUP;\n  const e  = Math.sqrt(1 + (b / a) * (b / a));   // eccentricity from the aim offset alone\n  const rp = a * (e - 1);                        // periapsis distance\n  const delta = 2 * Math.asin(1 / Math.max(e, 1 + 1e-12));   // turn angle of w\n  const sgn = b >= 0 ? 1 : -1;                   // +1 trailing-edge pass, −1 leading-edge\n  const al  = alphaDeg * Math.PI / 180;\n  const win  = [v * Math.cos(al), v * Math.sin(al)];         // w_in, in planet-velocity axes\n  const wout = rot(win[0], win[1], -sgn * delta);            // the flyby only ROTATES it\n  const H = p => Math.hypot(p[0], p[1]);\n  const vin  = H([VPL + win[0],  win[1]]);\n  const vout = H([VPL + wout[0], wout[1]]);\n  return {\n    mu, a, e, rp, rpRJ: rp / RJUP, delta, sgn, al, vinf: v,\n    vin, vout, dv: vout - vin,\n    vperi: Math.sqrt(v * v + 2 * mu / Math.max(rp, 1e5)),\n    renc: rencOf(mpJ), soi: soiOf(mpJ),\n    hits: rp < 1.02 * RJUP,                      // aim point inside the planet\n    // the 1-D elastic limits: w fully aligned with / fully against the planet's motion\n    dvMax: (VPL + v) - vin,\n    dvMin: Math.abs(VPL - v) - vin,\n  };\n}\n\n/* ============================================================ scenarios (only the differences) */\nconst SCEN = {\n  trailing: { name: 'Trailing pass — boost',  d: { vinf: 9,  b:  12, alpha:  90, mp: 1, rate: 1 } },\n  leading:  { name: 'Leading pass — brake',   d: { vinf: 9,  b: -12, alpha:  90, mp: 1, rate: 1 } },\n  retro:    { name: 'Retrograde arrival',     d: { vinf: 22, b:   8, alpha: 172, mp: 1, rate: 1 } },\n  voyager:  { name: 'Voyager 2 at Jupiter',   d: { vinf: 12, b:  11, alpha: 130, mp: 1, rate: 1 } },\n};\n\n/* ============================================================ state */\nconst S = {\n  scen: 'trailing', playing: false, rate: 1,\n  // controls\n  vinf: 9000, b: 12, alpha: 90, mp: 1,\n  ov: { path: true, pf: true, hyp: true, soi: true, vec: true },\n  // run definition (rebuilt whenever a control changes)\n  pred: null, mu: 0, renc: 0, h: 1, N: 1, nEnc: 0, T: 1, K: 1, ic: null,\n  // integrator state\n  n: 0, x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0,\n  // recorded history\n  trail: [], pf: [], hist: [],\n  // encounter latches + transient caches\n  _in: null, _out: null, _tIn: 0, _tOut: 0, _inSph: false,\n  _rpMin: Infinity, _tPeri: 0, _jac0: 0, _jacLo: Infinity, _jacHi: -Infinity,\n  _acc: 0, _aimDrag: false, _blown: false,\n  pan: { x: 0, y: 0 },\n};\nconst simT = () => S.n * S.h;\n\n/* ============================================================ derived quantities */\n// how long the run must be: in from four encounter-sphere radii, out to six — so the\n// \"before\" and \"after\" asymptotes both exist on screen, whatever the approach speed.\nfunction spanFor(p){\n  const tPre = 4 * p.renc / p.vinf, tPost = 6 * p.renc / p.vinf;\n  return { tPre, T: tPre + tPost };\n}\n// fixed step, small enough to resolve periapsis: a fixed fraction of the local orbital\n// period there. Clamped so a grazing aim can never explode the step count.\nfunction stepFor(p, T){\n  const Tperi = 2 * Math.PI * Math.max(p.rp, RJUP) / Math.max(p.vperi, 1);\n  let h = clamp(0.0015 * Tperi, 12, 200);\n  return Math.max(h, T / STEP_CAP);\n}\nfunction accel(x, y, t){\n  const rs = Math.max(Math.hypot(x, y), 1e8);\n  const p = pPos(t);\n  const dx = x - p[0], dy = y - p[1];\n  const d = Math.max(Math.hypot(dx, dy), 0.5 * RJUP);   // softened: the sim degrades, never throws\n  const ks = -GMS / (rs * rs * rs), kp = -S.mu / (d * d * d);\n  return [ks * x + kp * dx, ks * y + kp * dy];\n}\n// Jacobi constant of the circular restricted problem — the quantity that IS conserved here\n// (the probe's own orbital energy is not: the potential it moves in is time-dependent).\nfunction jacobi(x, y, vx, vy, t){\n  const rs = Math.max(Math.hypot(x, y), 1e8), p = pPos(t);\n  const d = Math.max(Math.hypot(x - p[0], y - p[1]), 0.5 * RJUP);\n  return 2 * OMEGA * (x * vy - y * vx) - (vx * vx + vy * vy) + 2 * (GMS / rs + S.mu / d);\n}\n// Read the incoming and outgoing ASYMPTOTES off one planet-relative state, by forming the\n// two-body orbital elements. This is what \"speed before / speed after\" means in patched conics:\n// the well's depth at the measuring point is taken back out.\nfunction asymptotes(x, y, vx, vy, t){\n  const P = pPos(t), V = pVel(t);\n  const rx = x - P[0], ry = y - P[1], wx = vx - V[0], wy = vy - V[1];\n  const d = Math.max(Math.hypot(rx, ry), 1e5), w2 = wx * wx + wy * wy;\n  const eps = w2 / 2 - S.mu / d;                       // planet-relative specific energy\n  if (!(eps > 0)) return null;                         // captured: no asymptote exists\n  const winf = Math.sqrt(2 * eps);\n  const L = rx * wy - ry * wx, sig = L >= 0 ? 1 : -1;\n  const c = w2 / S.mu - 1 / d, rv = (rx * wx + ry * wy) / S.mu;\n  const ex = c * rx - rv * wx, ey = c * ry - rv * wy;\n  const e = Math.hypot(ex, ey);\n  if (!(e > 1) || !fin(e)) return null;\n  const del = 2 * Math.asin(1 / e);\n  const ph = [ex / e, ey / e];                         // periapsis direction\n  const hin  = rot(ph[0], ph[1], sig * (Math.PI / 2 - del / 2));\n  const hout = rot(ph[0], ph[1], sig * (Math.PI / 2 + del / 2));\n  const rHel = Math.max(Math.hypot(x, y), 1e8);\n  const mk = hat => {\n    const vX = V[0] + winf * hat[0], vY = V[1] + winf * hat[1];\n    const sp = Math.hypot(vX, vY);\n    const eps2 = sp * sp / 2 - GMS / rHel;             // heliocentric specific energy\n    const Lz = x * vY - y * vX;\n    const aa = eps2 < 0 ? -GMS / (2 * eps2) : Infinity;\n    const ee = Math.sqrt(Math.max(0, 1 + 2 * eps2 * Lz * Lz / (GMS * GMS)));\n    return { sp, eps: eps2, a: aa, e: ee, vx: vX, vy: vY };\n  };\n  return { winf, e, delta: del, rp: (S.mu / (2 * eps)) * (e - 1), t,\n           inn: mk(hin), out: mk(hout) };\n}\n\n/* ============================================================ build / reset a run */\nfunction buildRun(){\n  const p = flyby(S.vinf, S.b, S.mp, S.alpha);\n  S.pred = p; S.mu = p.mu; S.renc = p.renc;\n  const sp = spanFor(p);\n  S.h = stepFor(p, sp.T);\n  S.nEnc = Math.max(1, Math.round(sp.tPre / S.h));\n  S.N = Math.max(S.nEnc + 2, Math.round(sp.T / S.h));\n  S.T = S.N * S.h;\n  S.K = Math.max(1, Math.ceil(S.N / 900));\n  // state at closest approach, from the closed form...\n  const tEnc = S.nEnc * S.h;\n  const PV = pVel(tEnc), PP = pPos(tEnc), ang = Math.atan2(PV[1], PV[0]);\n  const uh = rot(Math.cos(p.al), Math.sin(p.al), ang);          // w_in direction, inertial\n  const vh = rot(uh[0], uh[1], -p.sgn * p.delta / 2);           // velocity at periapsis\n  const rh = rot(vh[0], vh[1], p.sgn * Math.PI / 2);            // periapsis position direction\n  // If the aim point lies inside the planet there is no flyby to build. Fly the surface-grazing\n  // version of the same approach instead, so the incoming numbers stay physical; the integration\n  // then meets the surface and freezes there, and every \"after\" reads ⚠ impact.\n  const rpUse = Math.max(p.rp, RJUP);\n  const vpUse = Math.sqrt(p.vinf * p.vinf + 2 * p.mu / rpUse);\n  const st = { x: PP[0] + rpUse * rh[0], y: PP[1] + rpUse * rh[1],\n               vx: PV[0] + vpUse * vh[0], vy: PV[1] + vpUse * vh[1] };\n  // ...then run the SAME leapfrog backwards to t = 0. Velocity-Verlet is time-reversible,\n  // so integrating forward from the result lands back on this encounter.\n  let ax = accel(st.x, st.y, tEnc), a0 = ax[0], a1 = ax[1];\n  const dt = -S.h;\n  for (let i = 0; i < S.nEnc; i++){\n    st.vx += a0 * dt / 2; st.vy += a1 * dt / 2;\n    st.x  += st.vx * dt;  st.y  += st.vy * dt;\n    const A = accel(st.x, st.y, tEnc + (i + 1) * dt);\n    a0 = A[0]; a1 = A[1];\n    st.vx += a0 * dt / 2; st.vy += a1 * dt / 2;\n  }\n  S.ic = { x: st.x, y: st.y, vx: st.vx, vy: st.vy };\n  // exposed so an external checker can re-integrate exactly this problem independently\n  window.__ic = { x: st.x, y: st.y, vx: st.vx, vy: st.vy, t0: 0,\n                  GMS, mu: S.mu, AORB, OMEGA, THETA0, T: S.T, h: S.h, tEnc, N: S.N };\n  rewind();\n}\nfunction rewind(){\n  S.n = 0;\n  S.x = S.ic.x; S.y = S.ic.y; S.vx = S.ic.vx; S.vy = S.ic.vy;\n  const A = accel(S.x, S.y, 0); S.ax = A[0]; S.ay = A[1];\n  S.trail.length = 0; S.pf.length = 0; S.hist.length = 0;\n  S._in = null; S._out = null; S._inSph = false; S._tIn = 0; S._tOut = 0;\n  S._rpMin = Infinity; S._tPeri = 0; S._blown = false; S._hit = false;\n  S._jac0 = jacobi(S.x, S.y, S.vx, S.vy, 0); S._jacLo = S._jac0; S._jacHi = S._jac0;\n  record();\n}\nfunction record(){\n  const t = simT(), P = pPos(t);\n  const dx = S.x - P[0], dy = S.y - P[1], d = Math.hypot(dx, dy);\n  if (d < S._rpMin){ S._rpMin = d; S._tPeri = t; }\n  // aimed inside the planet: the flyby ends at the surface. Freeze there rather than let the\n  // probe whip through a softened core and print an invented \"after\".\n  if (d <= RJUP) S._hit = true;\n  if (!S._inSph && d < S.renc){ S._inSph = true; S._in = asymptotes(S.x, S.y, S.vx, S.vy, t); S._tIn = t; }\n  if (S._inSph && !S._out && d > S.renc){ S._out = asymptotes(S.x, S.y, S.vx, S.vy, t); S._tOut = t; }\n  const j = jacobi(S.x, S.y, S.vx, S.vy, t);\n  if (fin(j)){ if (j < S._jacLo) S._jacLo = j; if (j > S._jacHi) S._jacHi = j; }\n  if (S.n % S.K === 0){\n    const V = pVel(t);\n    S.trail.push(S.x, S.y);\n    S.pf.push(dx, dy);\n    S.hist.push(t, Math.hypot(S.vx, S.vy), Math.hypot(S.vx - V[0], S.vy - V[1]));\n  }\n}\nfunction stepOnce(){\n  const h = S.h;\n  S.vx += S.ax * h / 2; S.vy += S.ay * h / 2;\n  S.x  += S.vx * h;     S.y  += S.vy * h;\n  S.n++;\n  const A = accel(S.x, S.y, simT()); S.ax = A[0]; S.ay = A[1];\n  S.vx += S.ax * h / 2; S.vy += S.ay * h / 2;\n  if (!fin(S.x) || !fin(S.vx)){ S._blown = true; S.x = S.ic.x; S.y = S.ic.y; S.vx = S.ic.vx; S.vy = S.ic.vy; }\n  record();\n}\n// Land on step n. Going backwards replays the deterministic schedule from 0, so scrubbing the\n// timeline gives exactly the frame playing to that step would have given.\nfunction setStep(n){\n  n = clamp(Math.round(n), 0, S.N);\n  if (n < S.n) rewind();\n  let guard = 0;\n  while (S.n < n && !S._hit && guard++ < STEP_CAP + 10) stepOnce();\n}\nconst rebuildTo = t => setStep(t / S.h);\n\n/* ============================================================ canvases */\nconst main2d = document.getElementById('main2d'), g2 = main2d.getContext('2d');\nconst c3d = document.getElementById('c3d'), g3 = c3d.getContext('2d');\nconst cS = document.getElementById('cSpeed'), gS = cS.getContext('2d');\nconst cG = document.getElementById('cGain'),  gG = cG.getContext('2d');\nlet DPR = 1, W = 0, H = 0, W3 = 0, H3 = 0, WS = 0, HS = 0, WG = 0, HG = 0;\nfunction fit(cv, ctx){\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  const r = cv.getBoundingClientRect();\n  cv.width  = Math.max(1, Math.round(r.width  * DPR));\n  cv.height = Math.max(1, Math.round(r.height * DPR));\n  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n  return [r.width, r.height];\n}\nfunction resize(){\n  [W, H]   = fit(main2d, g2);\n  [W3, H3] = fit(c3d, g3);\n  [WS, HS] = fit(cS, gS);\n  [WG, HG] = fit(cG, gG);\n  draw();\n}\nwindow.addEventListener('resize', resize);\nconst cssMono = () => getComputedStyle(document.body).getPropertyValue('--mono');\n\n/* ---- world <-> screen, isotropic so angles are true: a drawn turn IS the real turn angle ---- */\nlet cam = { s: 1, cx: 0, cy: 0, span: AORB };\n// The camera is a director: it opens framed on the approach corridor, dives to the encounter\n// through closest approach, then — once past periapsis — pulls out to the whole heliocentric\n// orbit so the *changed* Sun-frame orbit is the reveal, not the preamble. `u` (1 far, 0 at\n// periapsis) drives the zoom; the sunward drift is gated on the span actually being wide, so\n// the framing can never disagree with the zoom.\nfunction updateCam(){\n  const P = pPos(simT());\n  const d = Math.max(Math.hypot(S.x - P[0], S.y - P[1]), 1e6);\n  const u = smooth(clamp(Math.log(d / (0.12 * S.renc)) / Math.log(40), 0, 1));\n  const near = clamp(24 * Math.max(S.pred.rp, RJUP), 22 * RJUP, 0.8 * S.renc);\n  // widest framing: the approach corridor coming in; the whole orbit only after closest approach\n  const post = S._inSph ? smooth(clamp((simT() - S._tPeri) / (2.4 * S.renc / S.pred.vinf), 0, 1)) : 0;\n  const far  = lerp(6 * S.renc, 2.6 * AORB, post);\n  cam.span = Math.exp(lerp(Math.log(near), Math.log(far), u));\n  cam.s = (H - 30) / cam.span;\n  // centre on the planet/probe until the view is genuinely orbit-wide, then slide to the Sun\n  const fx = lerp(P[0], S.x, 0.4), fy = lerp(P[1], S.y, 0.4);\n  const toSun = smooth(clamp((cam.span / AORB - 0.15) / 0.6, 0, 1));\n  cam.cx = lerp(fx, 0, toSun);\n  cam.cy = lerp(fy, 0, toSun);\n}\n// pan is a screen-pixel offset, applied here so one drag moves the view the same amount at\n// every zoom level (storing it in world metres made a pan done far out meaningless up close)\nconst sx = wx => W / 2 + (wx - cam.cx) * cam.s + S.pan.x;\nconst sy = wy => H / 2 - (wy - cam.cy) * cam.s + S.pan.y;\n\n/* ============================================================ 2D DRAW */\nfunction draw(){\n  if (!S.pred) return;\n  updateCam();\n  const t = simT(), P = pPos(t), V = pVel(t), p = S.pred;\n\n  // sunlight falls off — a real radial gradient, painted explicitly\n  g2.fillStyle = '#04060b'; g2.fillRect(0, 0, W, H);\n  const sunX = sx(0), sunY = sy(0);\n  const gr = g2.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 1.1);\n  gr.addColorStop(0, 'rgba(251,191,36,.20)');\n  gr.addColorStop(0.18, 'rgba(120,110,90,.055)');\n  gr.addColorStop(1, 'rgba(8,12,24,0)');\n  g2.fillStyle = gr; g2.fillRect(0, 0, W, H);\n  const gv = g2.createLinearGradient(0, 0, 0, H);\n  gv.addColorStop(0, 'rgba(12,20,40,.55)'); gv.addColorStop(1, 'rgba(4,6,12,.55)');\n  g2.fillStyle = gv; g2.fillRect(0, 0, W, H);\n\n  g2.font = '9px ' + cssMono();\n\n  // heliocentric distance rings (only while the view is wide enough to mean anything)\n  if (cam.span > 0.4 * AORB){\n    for (let k = 1; k <= 8; k++){\n      const R = k * AU;\n      g2.strokeStyle = 'rgba(120,150,190,.09)'; g2.lineWidth = 1;\n      g2.beginPath(); g2.arc(sunX, sunY, R * cam.s, 0, 7); g2.stroke();\n      if (k % 2 === 0 && R * cam.s < Math.max(W, H)){\n        g2.fillStyle = 'rgba(150,170,200,.30)';\n        g2.fillText(k + ' AU', sunX + R * cam.s + 4, sunY - 3);\n      }\n    }\n    // the planet's own orbit\n    g2.strokeStyle = 'rgba(56,189,248,.22)'; g2.setLineDash([4, 5]);\n    g2.beginPath(); g2.arc(sunX, sunY, AORB * cam.s, 0, 7); g2.stroke(); g2.setLineDash([]);\n  }\n\n  // the Sun\n  if (cam.span > 0.05 * AORB){\n    const rr = Math.max(3, Math.min(14, 0.02 * AORB * cam.s));\n    const sg = g2.createRadialGradient(sunX, sunY, 0, sunX, sunY, rr * 3.2);\n    sg.addColorStop(0, 'rgba(251,191,36,.95)'); sg.addColorStop(1, 'rgba(251,191,36,0)');\n    g2.fillStyle = sg; g2.beginPath(); g2.arc(sunX, sunY, rr * 3.2, 0, 7); g2.fill();\n    g2.fillStyle = '#fde68a'; g2.beginPath(); g2.arc(sunX, sunY, rr, 0, 7); g2.fill();\n    if (cam.span > 0.5 * AORB){\n      g2.fillStyle = 'rgba(251,191,36,.75)'; g2.fillText('SUN', sunX + rr + 5, sunY + 3);\n    }\n  }\n\n  const px = sx(P[0]), py = sy(P[1]);\n\n  // encounter sphere — where we call the flyby begun and ended\n  if (S.ov.soi){\n    const rs = S.renc * cam.s;\n    if (rs > 3 && rs < 40 * Math.max(W, H)){\n      g2.strokeStyle = 'rgba(167,139,250,.35)'; g2.setLineDash([3, 4]); g2.lineWidth = 1;\n      g2.beginPath(); g2.arc(px, py, rs, 0, 7); g2.stroke(); g2.setLineDash([]);\n      if (rs > 60){\n        g2.fillStyle = 'rgba(167,139,250,.6)';\n        g2.fillText('ENCOUNTER SPHERE · ¼ of the sphere of influence', px - rs + 6, py - rs + 12);\n      }\n    }\n  }\n\n  // the integrated path — this is the emergent object; everything analytic is a dashed overlay\n  if (S.ov.path && S.trail.length > 3){\n    g2.strokeStyle = 'rgba(251,191,36,.75)'; g2.lineWidth = 1.6;\n    g2.beginPath();\n    for (let i = 0; i < S.trail.length; i += 2){\n      const X = sx(S.trail[i]), Y = sy(S.trail[i + 1]);\n      if (i === 0) g2.moveTo(X, Y); else g2.lineTo(X, Y);\n    }\n    g2.stroke();\n  }\n\n  // the same motion redrawn in the planet's frame, anchored on the planet: the hyperbola,\n  // built out of the integration rather than asserted\n  if (S.ov.pf && S.pf.length > 3 && S.renc * cam.s > 12){\n    g2.strokeStyle = 'rgba(52,211,153,.55)'; g2.lineWidth = 1.2; g2.setLineDash([2, 3]);\n    g2.beginPath();\n    for (let i = 0; i < S.pf.length; i += 2){\n      const X = px + S.pf[i] * cam.s, Y = py - S.pf[i + 1] * cam.s;\n      if (i === 0) g2.moveTo(X, Y); else g2.lineTo(X, Y);\n    }\n    g2.stroke(); g2.setLineDash([]);\n  }\n\n  // the analytic patched-conic hyperbola — secondary, dashed, toggleable\n  if (S.ov.hyp && S.renc * cam.s > 12 && !p.hits) drawConic(px, py, p, t);\n\n  // the aim line and the draggable aim point\n  drawAim(px, py, p, t);\n\n  // the planet\n  const prR = Math.max(3, RJUP * cam.s);\n  const pg = g2.createRadialGradient(px, py, 0, px, py, prR * 2.4);\n  pg.addColorStop(0, 'rgba(56,189,248,.55)'); pg.addColorStop(1, 'rgba(56,189,248,0)');\n  g2.fillStyle = pg; g2.beginPath(); g2.arc(px, py, prR * 2.4, 0, 7); g2.fill();\n  g2.fillStyle = '#7dd3fc'; g2.beginPath(); g2.arc(px, py, prR, 0, 7); g2.fill();\n  g2.strokeStyle = 'rgba(255,255,255,.35)'; g2.lineWidth = 1; g2.stroke();\n  g2.fillStyle = 'rgba(125,211,252,.85)';\n  g2.fillText('JUPITER', px + prR + 6, py - prR - 2);\n\n  // the probe\n  const qx = sx(S.x), qy = sy(S.y);\n  g2.fillStyle = '#fbbf24';\n  g2.beginPath(); g2.arc(qx, qy, 3.6, 0, 7); g2.fill();\n  g2.strokeStyle = 'rgba(251,191,36,.35)'; g2.lineWidth = 1;\n  g2.beginPath(); g2.arc(qx, qy, 8, 0, 7); g2.stroke();\n  if (Math.hypot(qx - px, qy - py) > 46){\n    g2.fillStyle = 'rgba(251,191,36,.9)'; g2.fillText('PROBE', qx + 10, qy - 11);\n  }\n\n  // velocity vectors, drawn at a fixed pixels-per-km/s so the triangle is readable at any zoom\n  if (S.ov.vec){\n    const K = 34 / 10000;   // px per (m/s)\n    arrow(qx, qy, V[0] * K, -V[1] * K, 'rgba(56,189,248,.9)', 'v_planet', 12);\n    arrow(qx, qy, S.vx * K, -S.vy * K, 'rgba(251,191,36,.95)', 'v — Sun frame', -6);\n    arrow(qx + V[0] * K, qy - V[1] * K, (S.vx - V[0]) * K, -(S.vy - V[1]) * K,\n          'rgba(52,211,153,.9)', 'w — planet frame', 24);\n  }\n  drawLegend(p);\n\n  // stage events — short, shouty, anchored to the thing\n  let ev = null, evc = 'rgba(251,191,36,.95)';\n  if (p.hits || S._hit){ ev = '⚠ AIM INSIDE THE PLANET — this pass hits the surface, there is no flyby'; evc = 'rgba(248,113,113,.95)'; }\n  else if (S._out && t >= S._tOut){\n    const dv = S._out.out.sp - (S._in ? S._in.inn.sp : NaN);\n    ev = 'FLYBY COMPLETE — ' + sgnk(dv) + ' in the Sun frame, 0 in the planet frame';\n    evc = dv >= 0 ? 'rgba(52,211,153,.95)' : 'rgba(248,113,113,.95)';\n  }\n  else if (S._inSph && Math.abs(t - S._tPeri) < 3 * S.K * S.h)\n    ev = 'CLOSEST APPROACH — ' + (S._rpMin / RJUP).toFixed(2) + ' R_J';\n  else if (S._inSph) ev = 'INSIDE THE ENCOUNTER SPHERE — the planet now rules the motion';\n  else if (S.n > 0) ev = 'CRUISING IN — the flyby has not begun; no \"after\" exists yet';\n  if (ev){\n    g2.font = '11px ' + cssMono(); g2.fillStyle = evc;\n    g2.fillText(ev, 14, H - 14);\n  }\n  g2.font = '9px ' + cssMono(); g2.fillStyle = 'rgba(150,170,200,.45)';\n  g2.fillText('view ' + (cam.span > 0.3 * AORB ? (cam.span / AU).toFixed(2) + ' AU' :\n              (cam.span / RJUP).toFixed(0) + ' R_J') + ' tall · isotropic, so drawn angles are true',\n              14, H - 30);\n\n  drawInset();\n  drawSpeed();\n  drawGain();\n  updateReadouts();\n}\nfunction arrow(x, y, dx, dy, col, label, off){\n  const L = Math.hypot(dx, dy); if (!(L > 2)) return;\n  g2.strokeStyle = col; g2.fillStyle = col; g2.lineWidth = 1.6;\n  g2.beginPath(); g2.moveTo(x, y); g2.lineTo(x + dx, y + dy); g2.stroke();\n  const a = Math.atan2(dy, dx), hx = x + dx, hy = y + dy;\n  g2.beginPath(); g2.moveTo(hx, hy);\n  g2.lineTo(hx - 7 * Math.cos(a - 0.4), hy - 7 * Math.sin(a - 0.4));\n  g2.lineTo(hx - 7 * Math.cos(a + 0.4), hy - 7 * Math.sin(a + 0.4));\n  g2.closePath(); g2.fill();\n  g2.font = '9px ' + cssMono();\n  g2.fillText(label, hx + 5, hy + (off || -3));\n}\n// the closed-form hyperbola from the shared kernel, drawn in the planet's frame\nfunction drawConic(px, py, p, t){\n  const PV = pVel(S.nEnc * S.h), ang = Math.atan2(PV[1], PV[0]);\n  const uh = rot(Math.cos(p.al), Math.sin(p.al), ang);\n  const vh = rot(uh[0], uh[1], -p.sgn * p.delta / 2);\n  const rh = rot(vh[0], vh[1], p.sgn * Math.PI / 2);\n  const phi = Math.atan2(rh[1], rh[0]);                 // periapsis direction, inertial\n  const nuMax = Math.acos(-1 / p.e) * 0.985;\n  g2.strokeStyle = 'rgba(56,189,248,.55)'; g2.lineWidth = 1; g2.setLineDash([5, 4]);\n  g2.beginPath();\n  for (let i = 0; i <= 160; i++){\n    const nu = -nuMax + 2 * nuMax * i / 160;\n    const r = p.a * (p.e * p.e - 1) / (1 + p.e * Math.cos(nu));\n    if (!(r > 0) || r > 60 * S.renc) continue;\n    const th = phi + p.sgn * nu;\n    const X = px + r * Math.cos(th) * cam.s, Y = py - r * Math.sin(th) * cam.s;\n    if (i === 0) g2.moveTo(X, Y); else g2.lineTo(X, Y);\n  }\n  g2.stroke(); g2.setLineDash([]);\n}\n// where you aim: the offset line through the planet, perpendicular to the incoming asymptote\nlet aimScreen = null;\nfunction drawAim(px, py, p, t){\n  const PV = pVel(S.nEnc * S.h), ang = Math.atan2(PV[1], PV[0]);\n  const uh = rot(Math.cos(p.al), Math.sin(p.al), ang);\n  const nh = rot(uh[0], uh[1], Math.PI / 2);             // +b direction\n  const bm = S.b * RJUP;\n  const ax = px + nh[0] * bm * cam.s, ay = py - nh[1] * bm * cam.s;\n  aimScreen = { x: ax, y: ay, nx: nh[0], ny: nh[1], px, py };\n  if (S.renc * cam.s < 8) return;\n  const ext = clamp(34 * RJUP * cam.s, 30, Math.max(W, H));\n  g2.strokeStyle = 'rgba(52,211,153,.25)'; g2.lineWidth = 1; g2.setLineDash([2, 4]);\n  g2.beginPath();\n  g2.moveTo(px + nh[0] * ext, py - nh[1] * ext);\n  g2.lineTo(px - nh[0] * ext, py + nh[1] * ext);\n  g2.stroke(); g2.setLineDash([]);\n  g2.strokeStyle = p.hits ? 'rgba(248,113,113,.95)' : 'rgba(52,211,153,.95)'; g2.lineWidth = 1.6;\n  g2.beginPath(); g2.arc(ax, ay, 7, 0, 7); g2.stroke();\n  g2.beginPath(); g2.moveTo(ax - 11, ay); g2.lineTo(ax + 11, ay);\n  g2.moveTo(ax, ay - 11); g2.lineTo(ax, ay + 11); g2.stroke();\n}\n// one legend block, so nothing has to be captioned where it is drawn and pile up on the planet\nfunction drawLegend(p){\n  const x = 14, y0 = 18, dy = 14;\n  const items = [\n    ['rgba(251,191,36,.85)', 'solid',  'integrated path — the probe in the Sun’s frame'],\n    ['rgba(52,211,153,.6)',  'dot',    'the same motion in the planet’s frame'],\n    ['rgba(56,189,248,.6)',  'dash',   'patched‑conic hyperbola · δ = ' + (p.delta * 180 / Math.PI).toFixed(1) + '°'],\n    [p.hits ? 'rgba(248,113,113,.95)' : 'rgba(52,211,153,.95)', 'aim',\n      '⌖ aim · b = ' + (S.b >= 0 ? '+' : '−') + Math.abs(S.b).toFixed(1) + ' R_J · ' +\n      (S.b >= 0 ? 'trailing edge' : 'leading edge')],\n  ];\n  g2.font = '9px ' + cssMono();\n  items.forEach((it, i) => {\n    const y = y0 + i * dy;\n    g2.strokeStyle = it[0]; g2.fillStyle = it[0]; g2.lineWidth = 1.6;\n    if (it[1] === 'aim'){\n      g2.beginPath(); g2.arc(x + 9, y - 3, 4, 0, 7); g2.stroke();\n    } else {\n      g2.setLineDash(it[1] === 'dot' ? [2, 3] : it[1] === 'dash' ? [5, 4] : []);\n      g2.beginPath(); g2.moveTo(x, y - 3); g2.lineTo(x + 18, y - 3); g2.stroke();\n      g2.setLineDash([]);\n    }\n    g2.fillText(it[2], x + 24, y);\n  });\n}\n\n/* ============================================================ INSET — velocity space (schematic) */\nfunction drawInset(){\n  const p = S.pred;\n  g3.clearRect(0, 0, W3, H3);\n  g3.fillStyle = '#070a12'; g3.fillRect(0, 0, W3, H3);\n  const cx = W3 * 0.30, cy = H3 * 0.62;\n  const full = VPL + p.vinf;\n  const sc = (Math.min(W3 * 0.62, H3 * 0.72)) / Math.max(full, 1);\n  // drawn in axes where the planet's velocity points right — it rotates in reality\n  const A = S._in ? S._in.inn : { vx: null }, B = S._out ? S._out.out : { vx: null };\n  const w = S._in ? S._in.winf : (S._out ? S._out.winf : p.vinf);\n  const tipx = cx + VPL * sc, tipy = cy;\n  // the circle of every possible outcome: |w| is fixed, only its direction changes\n  g3.strokeStyle = 'rgba(52,211,153,.45)'; g3.setLineDash([3, 3]); g3.lineWidth = 1;\n  g3.beginPath(); g3.arc(tipx, tipy, w * sc, 0, 7); g3.stroke(); g3.setLineDash([]);\n  const av = (dx, dy, col, lw) => {\n    g3.strokeStyle = col; g3.fillStyle = col; g3.lineWidth = lw;\n    g3.beginPath(); g3.moveTo(cx, cy); g3.lineTo(cx + dx, cy + dy); g3.stroke();\n    const a = Math.atan2(dy, dx);\n    g3.beginPath(); g3.moveTo(cx + dx, cy + dy);\n    g3.lineTo(cx + dx - 6 * Math.cos(a - 0.4), cy + dy - 6 * Math.sin(a - 0.4));\n    g3.lineTo(cx + dx - 6 * Math.cos(a + 0.4), cy + dy - 6 * Math.sin(a + 0.4));\n    g3.closePath(); g3.fill();\n  };\n  av(VPL * sc, 0, 'rgba(56,189,248,.9)', 1.6);\n  const al = p.al, delta = p.delta * p.sgn;\n  const drawW = (phi, col, lw, tag) => {\n    const dx = w * sc * Math.cos(phi), dy = -w * sc * Math.sin(phi);\n    g3.strokeStyle = col; g3.lineWidth = lw;\n    g3.beginPath(); g3.moveTo(tipx, tipy); g3.lineTo(tipx + dx, tipy + dy); g3.stroke();\n    av(VPL * sc + dx, dy, col, lw);\n    g3.fillStyle = col; g3.font = '9px ' + cssMono();\n    g3.fillText(tag, cx + VPL * sc + dx + 4, cy + dy - 3);\n  };\n  drawW(al, 'rgba(148,163,184,.75)', 1.1, 'in ' + (p.vin / 1000).toFixed(1));\n  drawW(al - delta, 'rgba(251,191,36,.95)', 1.8, 'out ' + (p.vout / 1000).toFixed(1));\n  g3.fillStyle = 'rgba(56,189,248,.8)'; g3.font = '9px ' + cssMono();\n  g3.fillText('v_planet ' + (VPL / 1000).toFixed(1), cx + 6, cy + 13);\n  g3.fillStyle = 'rgba(52,211,153,.8)';\n  g3.fillText('|w| = ' + (w / 1000).toFixed(1) + ' km/s — fixed', 8, H3 - 8);\n  g3.fillStyle = 'rgba(120,140,170,.6)';\n  g3.fillText('both tips sit on one circle', 8, H3 - 19);\n  g3.fillText('v = v_planet + w', W3 - 96, H3 - 8);\n}\n\n/* ============================================================ PLOT 1 — the lived signal */\nfunction drawSpeed(){\n  gS.clearRect(0, 0, WS, HS); gS.fillStyle = '#070a12'; gS.fillRect(0, 0, WS, HS);\n  const L = 42, R = 8, Tp = 30, B = 20;\n  const w = Math.max(10, WS - L - R), h = Math.max(10, HS - Tp - B);\n  // Scale to the ASYMPTOTIC speeds, not the periapsis spike: the point of this panel is the\n  // step between before and after, and a 50 km/s spike would flatten it into nothing.\n  // The spike is drawn clipped against the top and its true peak is printed there.\n  let vmax = Math.max(S.pred.vin, S.pred.vout, S.pred.vinf + VPL, VESC);\n  if (S._in)  vmax = Math.max(vmax, S._in.inn.sp, S._in.winf);\n  if (S._out) vmax = Math.max(vmax, S._out.out.sp, S._out.winf);\n  vmax *= 1.30;\n  let peak = 0;\n  for (let i = 0; i < S.hist.length; i += 3) peak = Math.max(peak, S.hist[i + 1], S.hist[i + 2]);\n  const X = t => L + w * clamp(t / S.T, 0, 1);\n  const Y = v => Tp + h * (1 - clamp(v / vmax, 0, 1));\n  gS.font = '9px ' + cssMono();\n  // grid\n  gS.strokeStyle = 'rgba(120,150,190,.10)'; gS.lineWidth = 1;\n  for (let k = 0; k <= 4; k++){\n    const v = vmax * k / 4, y = Y(v);\n    gS.beginPath(); gS.moveTo(L, y); gS.lineTo(L + w, y); gS.stroke();\n    gS.fillStyle = 'rgba(150,170,200,.45)';\n    gS.fillText((v / 1000).toFixed(0), 6, y + 3);\n  }\n  gS.fillStyle = 'rgba(150,170,200,.45)';\n  gS.fillText('km/s', 6, Tp + 9);\n  gS.fillText('0 → ' + (S.T / DAY).toFixed(0) + ' d', L + w - 66, HS - 6);\n  // the encounter window\n  if (S._in){\n    const x0 = X(S._tIn), x1 = X(S._out ? S._tOut : simT());\n    gS.fillStyle = 'rgba(167,139,250,.10)'; gS.fillRect(x0, Tp, Math.max(1, x1 - x0), h);\n  }\n  // solar escape line\n  gS.strokeStyle = 'rgba(248,113,113,.35)'; gS.setLineDash([4, 4]);\n  gS.beginPath(); gS.moveTo(L, Y(VESC)); gS.lineTo(L + w, Y(VESC)); gS.stroke(); gS.setLineDash([]);\n  gS.fillStyle = 'rgba(248,113,113,.6)'; gS.fillText('solar escape at 5.2 AU', L + 4, Y(VESC) - 3);\n  // the two curves\n  const curve = (idx, col, lw) => {\n    gS.strokeStyle = col; gS.lineWidth = lw; gS.beginPath();\n    for (let i = 0; i < S.hist.length; i += 3){\n      const x = X(S.hist[i]), y = Y(S.hist[i + idx]);\n      if (i === 0) gS.moveTo(x, y); else gS.lineTo(x, y);\n    }\n    gS.stroke();\n  };\n  curve(2, 'rgba(52,211,153,.9)', 1.5);      // planet frame\n  curve(1, 'rgba(251,191,36,.95)', 1.8);     // Sun frame\n  // the claim, drawn: |w| in and out are the same level\n  if (S._in){\n    gS.strokeStyle = 'rgba(52,211,153,.45)'; gS.setLineDash([2, 3]);\n    gS.beginPath(); gS.moveTo(L, Y(S._in.winf)); gS.lineTo(L + w, Y(S._in.winf)); gS.stroke();\n    gS.setLineDash([]);\n    gS.fillStyle = 'rgba(52,211,153,.75)';\n    gS.fillText('|w| in = |w| out', L + w - 74, Y(S._in.winf) - 4);\n  }\n  if (S._out){\n    gS.strokeStyle = 'rgba(251,191,36,.4)'; gS.setLineDash([2, 3]);\n    gS.beginPath(); gS.moveTo(L, Y(S._out.out.sp)); gS.lineTo(L + w, Y(S._out.out.sp)); gS.stroke();\n    gS.setLineDash([]);\n  }\n  // now marker\n  gS.strokeStyle = 'rgba(200,220,255,.30)'; gS.lineWidth = 1;\n  gS.beginPath(); gS.moveTo(X(simT()), Tp); gS.lineTo(X(simT()), Tp + h); gS.stroke();\n  if (peak > vmax){\n    gS.fillStyle = 'rgba(200,220,255,.55)';\n    gS.fillText('peak ' + (peak / 1000).toFixed(0) + ' km/s at closest approach — off scale',\n                clamp(X(S._tPeri) + 5, L, L + w - 210), Tp + 10);\n  }\n  gS.fillStyle = 'rgba(251,191,36,.9)'; gS.fillText('■ Sun frame — steps', L + 4, HS - 6);\n  gS.fillStyle = 'rgba(52,211,153,.9)'; gS.fillText('■ planet frame — returns', L + 116, HS - 6);\n}\n\n/* ============================================================ PLOT 2 — Δv against where you aim */\nfunction drawGain(){\n  gG.clearRect(0, 0, WG, HG); gG.fillStyle = '#070a12'; gG.fillRect(0, 0, WG, HG);\n  const L = 44, R = 8, Tp = 30, B = 20;\n  const w = Math.max(10, WG - L - R), h = Math.max(10, HG - Tp - B);\n  const BMAX = 30;\n  const pts = [];\n  let lo = 0, hi = 0, hitLo = 0, hitHi = 0;\n  for (let i = 0; i <= 160; i++){\n    const bb = -BMAX + 2 * BMAX * i / 160;\n    const q = flyby(S.vinf, bb, S.mp, S.alpha);\n    if (q.hits){ hitLo = Math.min(hitLo, bb); hitHi = Math.max(hitHi, bb); pts.push([bb, null]); continue; }\n    lo = Math.min(lo, q.dv); hi = Math.max(hi, q.dv);\n    pts.push([bb, q.dv]);\n  }\n  const p = S.pred;\n  hi = Math.max(hi, p.dvMax, 1000); lo = Math.min(lo, p.dvMin, -1000);\n  const pad = 0.12 * (hi - lo); hi += pad; lo -= pad;\n  const X = bb => L + w * (bb + BMAX) / (2 * BMAX);\n  const Y = d => Tp + h * (1 - (d - lo) / Math.max(hi - lo, 1));\n  gG.font = '9px ' + cssMono();\n  gG.strokeStyle = 'rgba(120,150,190,.10)';\n  for (let k = 0; k <= 4; k++){\n    const v = lo + (hi - lo) * k / 4, y = Y(v);\n    gG.beginPath(); gG.moveTo(L, y); gG.lineTo(L + w, y); gG.stroke();\n    gG.fillStyle = 'rgba(150,170,200,.45)';\n    gG.fillText((v / 1000).toFixed(0), 6, y + 3);\n  }\n  gG.fillStyle = 'rgba(150,170,200,.45)';\n  gG.fillText('Δv km/s', 6, Tp + 9);\n  gG.fillText('−30', L - 6, HG - 6); gG.fillText('b (R_J)', L + w / 2 - 18, HG - 6);\n  gG.fillText('+30', L + w - 12, HG - 6);\n  // zero line and the forbidden band\n  gG.strokeStyle = 'rgba(200,220,255,.22)';\n  gG.beginPath(); gG.moveTo(L, Y(0)); gG.lineTo(L + w, Y(0)); gG.stroke();\n  if (hitHi > hitLo){\n    gG.fillStyle = 'rgba(248,113,113,.14)';\n    gG.fillRect(X(hitLo), Tp, Math.max(2, X(hitHi) - X(hitLo)), h);\n    gG.fillStyle = 'rgba(248,113,113,.65)';\n    gG.fillText('hits', X((hitLo + hitHi) / 2) - 9, Tp + 12);\n  }\n  // the 1-D elastic limits from the shared kernel\n  gG.strokeStyle = 'rgba(248,113,113,.45)'; gG.setLineDash([4, 4]);\n  gG.beginPath(); gG.moveTo(L, Y(p.dvMax)); gG.lineTo(L + w, Y(p.dvMax)); gG.stroke();\n  gG.beginPath(); gG.moveTo(L, Y(p.dvMin)); gG.lineTo(L + w, Y(p.dvMin)); gG.stroke();\n  gG.setLineDash([]);\n  gG.fillStyle = 'rgba(248,113,113,.7)';\n  gG.fillText('elastic limit  v_out = v_p + |w|', L + 4, Y(p.dvMax) - 3);\n  // the curve\n  gG.strokeStyle = 'rgba(251,191,36,.95)'; gG.lineWidth = 1.8; gG.beginPath();\n  let pen = false;\n  for (const [bb, d] of pts){\n    if (d === null){ pen = false; continue; }\n    const x = X(bb), y = Y(d);\n    if (!pen){ gG.moveTo(x, y); pen = true; } else gG.lineTo(x, y);\n  }\n  gG.stroke();\n  // the current aim\n  const cx = X(clamp(S.b, -BMAX, BMAX)), cy = Y(clamp(p.dv, lo, hi));\n  gG.strokeStyle = 'rgba(52,211,153,.95)'; gG.lineWidth = 1.5;\n  gG.beginPath(); gG.arc(cx, cy, 5, 0, 7); gG.stroke();\n  gG.beginPath(); gG.moveTo(cx, Tp); gG.lineTo(cx, Tp + h); gG.globalAlpha = .3; gG.stroke();\n  gG.globalAlpha = 1;\n  gG.fillStyle = 'rgba(52,211,153,.9)';\n  gG.fillText('you: ' + sgnk(p.dv), Math.min(cx + 8, L + w - 74), Math.max(cy - 7, Tp + 10));\n  gG.fillStyle = 'rgba(150,170,200,.5)';\n  gG.fillText('leading ◂ brake', L + 4, Tp + h - 4);\n  gG.fillText('boost ▸ trailing', L + w - 82, Tp + h - 4);\n}\n\n/* ============================================================ READOUTS */\nfunction readRow(k, v, cls, tip){\n  const t = tip ? ' title=\"' + tip + '\"' : '';\n  return '<dt' + t + '>' + k + '<\/dt><dd class=\"' + (cls || '') + '\"' + t + '>' + v + '<\/dd>';\n}\nfunction orbitWord(o){\n  if (!o || !fin(o.eps)) return '—';\n  if (o.eps >= 0) return 'hyperbolic · e ' + o.e.toFixed(2) + ' — unbound';\n  return 'ellipse · a ' + (o.a / AU).toFixed(2) + ' AU · e ' + o.e.toFixed(2);\n}\nfunction updateReadouts(){\n  const p = S.pred, t = simT(), P = pPos(t);\n  const d = Math.hypot(S.x - P[0], S.y - P[1]);\n  const V = pVel(t);\n  const spHel = Math.hypot(S.vx, S.vy), spPl = Math.hypot(S.vx - V[0], S.vy - V[1]);\n  const A = S._in, Bo = S._out;\n  const dv = (A && Bo) ? Bo.out.sp - A.inn.sp : NaN;\n  const wdiff = (A && Bo) ? 100 * Math.abs(Bo.winf - A.winf) / Math.max(A.winf, 1) : NaN;\n  const drift = 100 * (S._jacHi - S._jacLo) / Math.max(Math.abs(S._jac0), 1e-9);\n  let rows = '';\n\n  // up-front prediction, from the parameters alone, before the run plays out\n  rows += readRow('⌖ Predicted Δv', p.hits ? '⚠ impact' : '≈ ' + sgnk(p.dv),\n    p.hits ? 'warn' : (p.dv >= 0 ? 'ok' : 'warn'),\n    'Computed from the current sliders by the closed-form patched-conic kernel — before the integration runs. The same kernel draws the dashed hyperbola and the Δv-vs-b curve.');\n  rows += readRow('   predicted periapsis',\n    '≈ ' + p.rpRJ.toFixed(2) + ' R_J · ' + (S.b >= 0 ? 'trailing' : 'leading'),\n    p.hits ? 'warn' : '');\n  rows += '<div class=\"sep\"><\/div>';\n\n  rows += readRow('Probe → planet',\n    d > 3 * RJUP ? (d / 1e9).toFixed(3) + ' ×10⁶ km' : (d / RJUP).toFixed(2) + ' R_J');\n  rows += readRow('Heliocentric speed', kms(spHel), 'hi',\n    'The probe’s speed in the Sun’s frame right now — the number that decides where it can go next');\n  rows += readRow('Planet-frame speed', kms(spPl), 'ok',\n    'Speed relative to Jupiter right now: |v − v_planet|. It rises as the probe falls in and falls back as it climbs out');\n  rows += '<div class=\"sep\"><\/div>';\n\n  // nothing downstream of the encounter exists until the probe has actually left the sphere —\n  // and nothing at all exists if it hit the planet on the way in\n  const gated = v => (A && Bo && !S._hit) ? v : (S._hit ? '⚠ impact' : '—');\n  rows += readRow('Speed in (Sun)', A ? kms(A.inn.sp) : '—', '',\n    'Heliocentric speed on the incoming asymptote, read off the two-body elements at the moment the probe crossed into the encounter sphere');\n  rows += readRow('Speed out (Sun)', gated(Bo ? kms(Bo.out.sp) : '—'), 'hi',\n    'Heliocentric speed on the outgoing asymptote. It stays \"—\" until the probe has actually left the encounter sphere — there is no \"after\" before the flyby happens');\n  rows += readRow('Δv (Sun)', gated(sgnk(dv)),\n    fin(dv) ? (dv >= 0 ? 'ok' : 'warn') : '',\n    'Speed out minus speed in, in the Sun’s frame. Positive = the flyby paid; negative = it charged you');\n  rows += readRow('Speed in (planet)', A ? kms3(A.winf) : '—', '',\n    '|w| on the incoming asymptote — the approach speed at infinity relative to Jupiter');\n  rows += readRow('Speed out (planet)', gated(Bo ? kms3(Bo.winf) : '—'), '',\n    '|w| on the outgoing asymptote. The whole point: it equals the incoming value');\n  rows += readRow('Frame check',\n    fin(wdiff) ? '|w| same to ' + wdiff.toFixed(3) + '%' : '—',\n    fin(wdiff) ? (wdiff < 1 ? 'ok' : 'warn') : '',\n    'How far apart the measured in and out planet-frame speeds actually came out. Exactly zero in the two-body limit; the residue is the Sun’s pull during the pass');\n  rows += '<div class=\"sep\"><\/div>';\n\n  rows += readRow('Closest approach',\n    fin(S._rpMin) && S._rpMin < 50 * S.renc ? (S._rpMin / RJUP).toFixed(2) + ' R_J' : '—', '',\n    'Smallest planet-relative distance reached so far by the integration — compare it with the predicted periapsis above');\n  rows += readRow('Turn angle δ',\n    A ? (A.delta * 180 / Math.PI).toFixed(1) + '°' : '≈ ' + (p.delta * 180 / Math.PI).toFixed(1) + '°', '',\n    'δ = 2·arcsin(1/e) — how far the flyby rotates w. The one exact number here; everything else is an engineering estimate');\n  rows += readRow('Orbit after', gated(Bo ? orbitWord(Bo.out) : '—'),\n    (Bo && Bo.out.eps >= 0) ? 'hi' : '');\n  rows += readRow('Orbit energy ε',\n    A ? ((A.inn.eps / 1e6).toFixed(1) + (Bo ? ' → ' + (Bo.out.eps / 1e6).toFixed(1) : '') + ' MJ/kg') : '—',\n    '', 'Specific orbital energy about the Sun, ε = v²/2 − GM☉/r. Negative = bound, positive = leaving for good');\n  rows += readRow('Integrator drift',\n    fin(drift) ? drift.toFixed(4) + ' %' : '—', drift < 0.1 ? 'ok' : 'warn',\n    'Spread in the Jacobi constant over the run so far. That is the invariant of this problem — the probe’s own energy is NOT conserved, which is exactly why a slingshot works');\n  rows += '<div class=\"sep\"><\/div>';\n  rows += readRow('Regime', SCEN[S.scen].name);\n  rows += readRow('Planet', 'Jupiter · ' + S.mp.toFixed(2) + ' M_J');\n  rows += readRow('Planet speed', kms(VPL), '',\n    'v_planet = √(GM☉/a) on a circular orbit at 5.204 AU — the momentum reservoir the flyby borrows from');\n  if (S._blown) rows += readRow('Note', 'clamped', 'warn');\n  rdl.innerHTML = rows;\n}\n\n/* ============================================================ LOOP */\nlet lastTS = 0;\nfunction frame(ts){\n  requestAnimationFrame(frame);\n  const dtReal = Math.min((ts - lastTS) / 1000 || 0, 0.05); lastTS = ts;\n  if (S.playing){\n    // wall-clock seconds → simulated seconds, so one run always takes ~RUN_WALL/rate to watch\n    S._acc += dtReal * S.rate * (S.T / RUN_WALL);\n    let k = Math.floor(S._acc / S.h);\n    S._acc -= k * S.h;\n    k = Math.min(k, 200000);\n    for (let i = 0; i < k && S.n < S.N && !S._hit; i++) stepOnce();\n    if (S.n >= S.N || S._hit){ S.playing = false; playBtn.textContent = '▶ Play'; S._acc = 0; }\n    syncProg();\n  }\n  draw();\n}\n\n/* ============================================================ UI WIRING */\nconst $ = id => document.getElementById(id);\nconst playBtn = $('playBtn'), rdl = $('rdl');\nfunction syncProg(){\n  $('prog').value = clamp(S.n / Math.max(S.N, 1), 0, 1);\n  $('progV').textContent = (simT() / DAY).toFixed(1) + ' / ' + (S.T / DAY).toFixed(0) + ' d';\n}\nplayBtn.onclick = () => { S.playing = !S.playing; playBtn.textContent = S.playing ? '❚❚ Pause' : '▶ Play'; };\n$('restartBtn').onclick = () => { rewind(); S._acc = 0; syncProg(); draw(); };\n$('prog').oninput = e => {\n  S.playing = false; playBtn.textContent = '▶ Play'; S._acc = 0;\n  rebuildTo(parseFloat(e.target.value) * S.T);     // replay the deterministic schedule from t = 0\n  syncProg(); draw();\n};\n// a parameter changed the trajectory: rebuild the whole run, then land on the same fraction\nfunction reparam(){\n  const f = clamp(S.n / Math.max(S.N, 1), 0, 1);\n  buildRun();\n  setStep(f * S.N);\n  syncProg(); draw();\n}\nfunction refreshSliderLabels(){\n  $('rateV').textContent  = S.rate.toFixed(2) + '×';\n  $('vinfV').textContent  = (S.vinf / 1000).toFixed(1) + ' km/s';\n  $('bV').innerHTML       = (S.b >= 0 ? '+' : '−') + Math.abs(S.b).toFixed(1) + ' R<sub>J<\/sub> · ' +\n                            (S.b >= 0 ? 'trailing' : 'leading');\n  $('alphaV').textContent = S.alpha.toFixed(0) + '°';\n  $('mpV').innerHTML      = S.mp.toFixed(2) + ' M<sub>J<\/sub>';\n}\n$('rate').oninput  = e => { S.rate = parseFloat(e.target.value); refreshSliderLabels(); };\n$('vinf').oninput  = e => { S.vinf = parseFloat(e.target.value) * 1000; refreshSliderLabels(); reparam(); };\n$('b').oninput     = e => { S.b = parseFloat(e.target.value); refreshSliderLabels(); reparam(); };\n$('alpha').oninput = e => { S.alpha = parseFloat(e.target.value); refreshSliderLabels(); reparam(); };\n$('mp').oninput    = e => { S.mp = parseFloat(e.target.value); refreshSliderLabels(); reparam(); };\n\n$('oPath').onchange = e => { S.ov.path = e.target.checked; draw(); };\n$('oPf').onchange   = e => { S.ov.pf   = e.target.checked; draw(); };\n$('oHyp').onchange  = e => { S.ov.hyp  = e.target.checked; draw(); };\n$('oSoi').onchange  = e => { S.ov.soi  = e.target.checked; draw(); };\n$('oVec').onchange  = e => { S.ov.vec  = e.target.checked; draw(); };\n\ndocument.querySelectorAll('#tabs button').forEach(btn => {\n  btn.onclick = () => {\n    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));\n    btn.classList.add('on');\n    S.scen = btn.dataset.s;\n    const D = SCEN[S.scen].d;\n    S.vinf = D.vinf * 1000; S.b = D.b; S.alpha = D.alpha; S.mp = D.mp; S.rate = D.rate;\n    $('vinf').value = D.vinf; $('b').value = D.b; $('alpha').value = D.alpha;\n    $('mp').value = D.mp; $('rate').value = D.rate;\n    refreshSliderLabels();\n    S.pan.x = 0; S.pan.y = 0; S.playing = false; playBtn.textContent = '▶ Play'; S._acc = 0;\n    buildRun(); syncProg(); draw();\n  };\n});\n\n/* the stage is directly manipulable: drag the ⌖ aim point to re-aim, drag elsewhere to pan */\nlet dragMode = null, lastM = null;\nmain2d.addEventListener('mousedown', e => {\n  const r = main2d.getBoundingClientRect();\n  const mx = e.clientX - r.left, my = e.clientY - r.top;\n  lastM = [e.clientX, e.clientY];\n  const grabbable = aimScreen && S.renc * cam.s > 8;\n  dragMode = (grabbable && Math.hypot(mx - aimScreen.x, my - aimScreen.y) < 18) ? 'aim' : 'pan';\n  document.body.style.cursor = dragMode === 'pan' ? 'grabbing' : 'crosshair';\n});\nwindow.addEventListener('mousemove', e => {\n  if (!dragMode) return;\n  if (dragMode === 'aim' && aimScreen){\n    const r = main2d.getBoundingClientRect();\n    const mx = e.clientX - r.left, my = e.clientY - r.top;\n    // project the cursor onto the aim line: that projection IS the impact parameter\n    const bm = ((mx - aimScreen.px) * aimScreen.nx + (aimScreen.py - my) * aimScreen.ny) / cam.s;\n    S.b = clamp(Math.round(bm / RJUP * 2) / 2, -30, 30);\n    $('b').value = S.b; refreshSliderLabels(); reparam();\n  } else {\n    S.pan.x += e.clientX - lastM[0];\n    S.pan.y += e.clientY - lastM[1];\n    draw();\n  }\n  lastM = [e.clientX, e.clientY];\n});\nwindow.addEventListener('mouseup', () => { dragMode = null; document.body.style.cursor = ''; });\nmain2d.addEventListener('dblclick', () => { S.pan.x = 0; S.pan.y = 0; draw(); });\n$('panL').onclick = () => { S.pan.x += 0.22 * W; draw(); };\n$('panR').onclick = () => { S.pan.x -= 0.22 * W; draw(); };\n$('recenter').onclick = () => { S.pan.x = 0; S.pan.y = 0; draw(); };\n\n/* ============================================================ go */\nbuildRun();\nresize();\nrequestAnimationFrame(frame);\ndocument.querySelector('#tabs button.on').click();   // first paint runs the same path as a tab switch\n<\/script>\n","sofar":"<title>SOFAR Sound Channel<\/title>\n<style>\n  /* Committed dark instrument-panel aesthetic: single visual world, painted explicitly. */\n  :root{\n    color-scheme:dark;\n    --bg:#06080d; --panel:#0b0f1a; --panel2:#0e1424; --line:#1b2436;\n    --ink:#c9d4e3; --dim:#7c8aa0; --faint:#4a5568;\n    --cyan:#38bdf8; --amber:#fbbf24; --green:#34d399; --red:#f87171; --violet:#a78bfa;\n    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,\"Liberation Mono\",monospace;\n    --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%}\n  body{\n    background:var(--bg); color:var(--ink); font-family:var(--sans);\n    font-size:13px; line-height:1.5; overflow:hidden;\n  }\n  #app{display:flex; flex-direction:column; height:100vh; width:100vw}\n\n  header{\n    display:flex; align-items:center; gap:14px 18px; padding:10px 16px; flex-wrap:wrap;\n    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0a0e18,#070a12);\n    flex:0 0 auto;\n  }\n  header h1{\n    font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;\n    margin:0; color:#e6edf6;\n  }\n  header h1 span{color:var(--cyan)}\n  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}\n  .tabs button{\n    font-family:var(--mono); font-size:11px; letter-spacing:.06em;\n    color:var(--dim); background:var(--panel2); border:1px solid var(--line);\n    padding:7px 11px; border-radius:7px; cursor:pointer; transition:.15s;\n  }\n  .tabs button:hover{color:var(--ink); border-color:#2b3550}\n  .tabs button.on{color:#06202b; background:var(--cyan); border-color:var(--cyan); font-weight:600}\n\n  main{flex:1 1 auto; display:grid; grid-template-columns:250px 1fr; min-height:0}\n\n  aside{\n    border-right:1px solid var(--line); background:var(--panel);\n    padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;\n  }\n  .grp{display:flex; flex-direction:column; gap:9px}\n  .grp h2{\n    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;\n    color:var(--faint); margin:0 0 2px; border-bottom:1px solid var(--line); padding-bottom:6px;\n  }\n  .btns{display:flex; gap:6px}\n  .btns button{\n    flex:1; font-family:var(--mono); font-size:11px; color:var(--ink);\n    background:var(--panel2); border:1px solid var(--line); border-radius:6px;\n    padding:8px 4px; cursor:pointer; transition:.15s;\n  }\n  .btns button:hover{border-color:var(--cyan); color:#fff}\n  .btns button.play{background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.4)}\n  label.fld{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim)}\n  label.fld .v{color:var(--ink); font-family:var(--mono); font-size:11px}\n  input[type=range]{width:100%; accent-color:var(--cyan); cursor:pointer}\n  label.chk{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); cursor:pointer}\n  label.chk input{accent-color:var(--cyan); cursor:pointer}\n\n  #stagewrap{position:relative; min-width:0; display:flex; flex-direction:column}\n  #stage{position:relative; flex:1 1 auto; min-height:0; background:#04060b}\n  #stage canvas{position:absolute; inset:0; width:100%; height:100%}\n  #inset3d{\n    position:absolute; top:12px; right:10px; width:272px; height:190px;\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.96);\n    backdrop-filter:blur(3px); z-index:3;\n  }\n  #inset3d canvas{position:absolute; inset:0; width:100%; height:100%}\n  #inset3d .cap{\n    position:absolute; left:9px; top:7px; font-family:var(--mono); font-size:9px;\n    letter-spacing:.12em; text-transform:uppercase; color:var(--faint); z-index:1;\n  }\n  #readouts{\n    position:absolute; top:206px; right:10px; bottom:8px; width:306px; z-index:3;\n    border:1px solid var(--line); border-radius:9px; background:rgba(7,10,18,.97);\n    backdrop-filter:blur(3px); padding:9px 12px; font-family:var(--mono);\n    overflow-y:auto;\n  }\n  #readouts h3{\n    font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);\n    margin:0 0 6px;\n  }\n  #readouts dl{display:grid; grid-template-columns:1fr auto; gap:2px 10px; margin:0; font-size:10.5px}\n  #readouts dt{color:var(--dim); white-space:nowrap}\n  #readouts dt[title]{cursor:help; text-decoration:underline dotted var(--faint); text-underline-offset:2px}\n  #readouts dd{margin:0; text-align:right; color:var(--ink)}\n  #readouts dd.hi{color:var(--amber)}\n  #readouts dd.warn{color:var(--red)}\n  #readouts dd.ok{color:var(--green)}\n  #readouts .sep{grid-column:1/-1; height:1px; background:var(--line); margin:5px 0}\n\n  #plots{\n    flex:0 0 168px; display:grid; grid-template-columns:1fr 1fr; gap:1px;\n    background:var(--line); border-top:1px solid var(--line);\n  }\n  .plot{position:relative; background:#070a12}\n  .plot canvas{position:absolute; inset:0; width:100%; height:100%}\n  .plot .cap{\n    position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:9px;\n    letter-spacing:.13em; text-transform:uppercase; color:var(--faint); z-index:1;\n  }\n\n  #explain{\n    flex:0 0 auto; max-height:clamp(180px,26vh,300px); overflow-y:auto; border-top:1px solid var(--line);\n    background:var(--panel); padding:11px 16px 13px; display:grid;\n    grid-template-columns:repeat(5,1fr); gap:12px;\n  }\n  #explain .ex{\n    border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 12px;\n    max-height:clamp(164px,24vh,280px); overflow-y:auto;\n  }\n  #explain .ex::-webkit-scrollbar{width:5px}\n  #explain .ex::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}\n  #explain h4{\n    margin:0 0 5px; font-family:var(--mono); font-size:10px;\n    letter-spacing:.1em; text-transform:uppercase; color:var(--cyan);\n  }\n  #explain p{margin:5px 0 0; color:var(--dim); font-size:11.5px}\n  #explain p.cav{margin-top:6px; color:var(--faint); font-size:10px; font-style:italic; line-height:1.45}\n  #explain b{color:var(--ink); font-weight:600}\n  #explain code{font-family:var(--mono); color:var(--amber); font-size:11px}\n  .hint{font-size:10.5px; color:var(--faint); margin-top:4px}\n  @media (max-width:1400px){ #explain{grid-template-columns:repeat(3,1fr); max-height:34vh} }\n  @media (max-width:820px){ #explain{grid-template-columns:1fr 1fr; max-height:40vh} }\n<\/style>\n\n<div id=\"app\">\n  <header>\n    <h1>SOFAR&nbsp;<span>Sound<\/span>&nbsp;Channel<\/h1>\n    <div class=\"tabs\" id=\"tabs\">\n      <button data-s=\"deepchannel\" class=\"on\">1 · Deep channel<\/button>\n      <button data-s=\"surfaceduct\">2 · Surface duct<\/button>\n      <button data-s=\"doubleduct\">3 · Double duct<\/button>\n      <button data-s=\"arctic\">4 · Arctic<\/button>\n      <button data-s=\"shadow\">5 · Shadow zone<\/button>\n    <\/div>\n  <\/header>\n\n  <main>\n    <aside>\n      <div class=\"grp\">\n        <h2>Simulation<\/h2>\n        <div class=\"btns\">\n          <button id=\"playBtn\" class=\"play\">▶ Play<\/button>\n          <button id=\"restartBtn\">↻ Restart<\/button>\n        <\/div>\n        <label class=\"fld\">Time rate <span class=\"v\" id=\"rateV\">1.0×<\/span>\n          <input type=\"range\" id=\"rate\" min=\"0.15\" max=\"5\" step=\"0.05\" value=\"1\">\n        <\/label>\n        <label class=\"fld\">Timeline <span class=\"v\" id=\"progV\">0.0 s<\/span>\n          <input type=\"range\" id=\"prog\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\">\n        <\/label>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>Source &amp; hydrophone<\/h2>\n        <label class=\"fld\">Source depth <span class=\"v\" id=\"srcV\">1300 m<\/span>\n          <input type=\"range\" id=\"src\" min=\"10\" max=\"4500\" step=\"10\" value=\"1300\">\n        <\/label>\n        <label class=\"fld\">Launch fan half-width <span class=\"v\" id=\"fanV\">12.0°<\/span>\n          <input type=\"range\" id=\"fan\" min=\"1\" max=\"20\" step=\"0.5\" value=\"12\">\n        <\/label>\n        <label class=\"fld\">Hydrophone range <span class=\"v\" id=\"rngV\">300 km<\/span>\n          <input type=\"range\" id=\"rng\" min=\"5\" max=\"500\" step=\"1\" value=\"300\">\n        <\/label>\n        <label class=\"fld\">Hydrophone depth <span class=\"v\" id=\"rcvdV\">1300 m<\/span>\n          <input type=\"range\" id=\"rcvd\" min=\"10\" max=\"4900\" step=\"10\" value=\"1300\">\n        <\/label>\n        <div class=\"hint\">Drag the green hydrophone anywhere in the water · drag the cyan\n        source up and down.<\/div>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>Sound-speed profile<\/h2>\n        <label class=\"fld\" data-scen=\"deepchannel doubleduct shadow\">Channel axis depth <span class=\"v\" id=\"axisV\">1300 m<\/span>\n          <input type=\"range\" id=\"axis\" min=\"500\" max=\"2500\" step=\"10\" value=\"1300\">\n        <\/label>\n        <label class=\"fld\" data-scen=\"deepchannel doubleduct shadow\">Channel strength ε <span class=\"v\" id=\"epsV\">7.37 ×10⁻³<\/span>\n          <input type=\"range\" id=\"eps\" min=\"0\" max=\"14\" step=\"0.01\" value=\"7.37\">\n        <\/label>\n        <label class=\"fld\" data-scen=\"surfaceduct\">Mixed-layer depth <span class=\"v\" id=\"mldV\">120 m<\/span>\n          <input type=\"range\" id=\"mld\" min=\"20\" max=\"300\" step=\"5\" value=\"120\">\n        <\/label>\n        <div class=\"btns\"><button id=\"cpReset\">↺ Reset profile drags<\/button><\/div>\n        <div class=\"hint\">Drag the five cyan handles on the <b>c(z)<\/b> panel at the left of the\n        stage to sculpt the profile by hand. ε&nbsp;→&nbsp;0 flattens the channel away.<\/div>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>View<\/h2>\n        <div class=\"btns\">\n          <button id=\"panL\">◂ Pan<\/button>\n          <button id=\"panR\">Pan ▸<\/button>\n          <button id=\"recenter\">⊙ Center<\/button>\n        <\/div>\n        <div class=\"hint\">Scroll to zoom the range axis · drag the water to pan ·\n        double-click to fit.<\/div>\n      <\/div>\n\n      <div class=\"grp\">\n        <h2>Overlays<\/h2>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oRays\" checked> Ray fan<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oWf\" checked> Wavefront through the fan<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oEnv\" checked> Turning-point envelope<\/label>\n        <label class=\"chk\"><input type=\"checkbox\" id=\"oProf\" checked> c(z) panel &amp; channel axis<\/label>\n      <\/div>\n    <\/aside>\n\n    <div id=\"stagewrap\">\n      <div id=\"stage\">\n        <canvas id=\"main2d\"><\/canvas>\n        <div id=\"inset3d\">\n          <span class=\"cap\">1:1 near-source fan (true angles, schematic)<\/span>\n          <canvas id=\"c3d\"><\/canvas>\n        <\/div>\n        <div id=\"readouts\">\n          <h3>Live readout<\/h3>\n          <dl id=\"rdl\"><\/dl>\n        <\/div>\n      <\/div>\n      <div id=\"plots\">\n        <div class=\"plot\">\n          <span class=\"cap\">Hydrophone arrival train<\/span>\n          <canvas id=\"cArr\"><\/canvas>\n        <\/div>\n        <div class=\"plot\">\n          <span class=\"cap\">Transmission loss vs range<\/span>\n          <canvas id=\"cTL\"><\/canvas>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <section id=\"explain\">\n    <div class=\"ex\">\n      <h4>Rays bend toward slow water<\/h4>\n      <p>Sound in the sea travels at about <b>1500 m/s<\/b>, but not exactly: it speeds up in warm\n      water and under pressure. A ray crossing that layered water refracts, and Snell's law keeps\n      one number fixed all the way along it — <code>cos θ(z) / c(z) = const<\/code>.<\/p>\n      <p>So a ray always <b>curves toward the slower water<\/b>. Where the speed rises with depth the\n      ray bends back up; where it falls with depth the ray bends down. In a layer of constant\n      gradient <code>g = dc/dz<\/code> the path is exactly a <b>circular arc<\/b> of radius\n      <code>R = c₀ / (g·cos θ₀)<\/code>.<\/p>\n      <p>Wherever <code>c(z) = c_source / cos θ₀<\/code> the ray goes momentarily horizontal — its\n      <b>turning point<\/b> — and heads back. Steeper launch ⇒ deeper turn.<\/p>\n      <p class=\"cav\">The stage is drawn with a large <b>vertical exaggeration<\/b> (printed in the\n      corner), because a ducted ray leans over less than 12° and would otherwise be a flat line.\n      The small inset is the same fan at a true 1:1 aspect. Angles on the main stage are steepened;\n      angles in the inset are real.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>A speed minimum is a waveguide<\/h4>\n      <p>Warm surface water is fast; cold deep water is slow; below about a kilometre the pressure\n      takes over and speeds sound up again. That leaves a <b>minimum<\/b> — the <b>SOFAR axis<\/b>,\n      near <b>1000–1300 m<\/b> at mid latitudes.<\/p>\n      <p>A ray launched near the axis shallow enough (here within roughly <code>±13°<\/code>) turns\n      back <b>before<\/b> it can reach the surface or the seabed. It never touches either, so it\n      never loses energy to scattering or bottom absorption — it just oscillates about the axis\n      forever, spreading <b>cylindrically<\/b> instead of spherically.<\/p>\n      <p>That is why the 1991 <b>Heard Island Feasibility Test<\/b> put a source on the axis in the\n      southern Indian Ocean and was detected on hydrophones roughly <b>18 000 km<\/b> away, on both\n      coasts of North America.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>What the hydrophone hears<\/h4>\n      <p>Not one arrival — a <b>train<\/b>. Each trapped ray takes a different path, so the same\n      click reaches the phone several times. Steep rays swing far off the axis through <b>faster<\/b>\n      water and arrive <b>first<\/b>; the near-axial ray takes the shortest, slowest path and arrives\n      <b>last and loudest<\/b>.<\/p>\n      <p>So a SOFAR arrival is a rising stutter that ends in a bang — a crescendo cut off sharply.\n      That signature is the fingerprint of the duct; drag the hydrophone and it reshapes.<\/p>\n      <p class=\"cav\">This is a ray (high-frequency) model: no diffraction, no modes, no\n      frequency dependence, flat seabed, no currents or eddies. Amplitudes are ray-tube\n      estimates — treat every level as ±~5 dB and every count of arrivals as the strongest few.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>Shadow zones sit beside loud paths<\/h4>\n      <p>Rays leave gaps. Move the hydrophone a few hundred metres and you can fall in a\n      <b>shadow zone<\/b>: geometrically <b>no ray reaches you at all<\/b>, while a phone on the axis\n      at the same range is hearing a dozen arrivals. Loud and silent are neighbours.<\/p>\n      <p>The opposite also happens. Where neighbouring rays pile back together the tube collapses\n      and the sound is refocused — a <b>convergence zone<\/b>, a ring of loud water every\n      <b>50–65 km<\/b> in the deep ocean, with quiet in between.<\/p>\n      <p>Turn on the turning-point envelope to see the caustics that bound both.<\/p>\n    <\/div>\n    <div class=\"ex\">\n      <h4>Reading the units<\/h4>\n      <p><b>c — metres per second.<\/b> The <b>sound speed<\/b>, ~1450–1550 m/s: a 1% change bends a\n      ray by degrees. A whole ocean's profile spans about <b>100 m/s<\/b>, less than the width of\n      the <code>c(z)<\/code> panel.<\/p>\n      <p><b>TL — transmission loss, decibels.<\/b> How much fainter than 1 m from the source.\n      Logarithmic: <code>+20 dB ≈ ten times fainter in pressure<\/code>, and <b>70 dB of loss is a\n      ten-million-fold drop in intensity<\/b>. Ducted sound loses about <code>10 log R<\/code>;\n      unducted sound loses <code>20 log R<\/code> — that gap is the whole trick.<\/p>\n      <p><b>Range — kilometres; arrival spread — seconds.<\/b> 300 km is London to Paris; a\n      <b>blue whale<\/b> call rides the channel across an ocean basin. The arrivals dribble in over\n      a second or two — the drawn-out, stuttering <b>echo of a shout in a canyon<\/b>, not a\n      single click.<\/p>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============================================================ constants */\n/* Munk (1974), \"Sound channel in an exponentially stratified ocean, with application to SOFAR\",\n   JASA 55, 220. Canonical mid-latitude deep sound channel. */\nconst C_MUNK1   = 1492.0;     // sound speed on the channel axis, m/s\nconst EPS_MUNK  = 0.00737;    // Munk perturbation parameter, dimensionless\nconst B_MUNK    = 1300.0;     // Munk stratification scale depth, m\nconst ZAX_MUNK  = 1300.0;     // canonical SOFAR axis depth at mid latitude, m\nconst D_OCEAN   = 5000.0;     // deep-ocean seabed for this section, m\nconst DZ_LAYER  = 50.0;       // layer thickness of the horizontally stratified model, m\nconst NLAY      = Math.round(D_OCEAN/DZ_LAYER);\n/* Arctic half-channel: sound speed rises linearly from a cold, fresh surface.\n   c(z) = 1435 + 0.0165 z  (m/s) — a standard upward-refracting Arctic gradient. */\nconst ARCTIC_C0 = 1435.0, ARCTIC_G = 0.0165;\nconst MLD_GRAD  = 0.017;      // adiabatic gradient inside a wind-mixed layer, s^-1\nconst D2_Z=280, D2_W=130, D2_AMP=16;   // secondary (shallow) duct: Gaussian notch, m / m / (m/s)\n/* Losses. Thorp (1967) volume absorption at ~100 Hz ≈ 0.0035 dB/km. Bottom loss is a\n   low-grazing-angle sand/silt figure; surface reflection is near-lossless in calm water. */\nconst ALPHA_DB_KM = 0.0035, BOT_LOSS_DB = 8.0, SURF_LOSS_DB = 0.5;\nconst TSCALE = 20.0;          // seconds of propagation per second of wall clock at rate 1×\nconst NRAY = 144, NR = 481, DRAW_EVERY = 8;   // calculation fan · range samples · drawn subset\nconst SHADOW_DB = 14;         // a spot this far below the best depth at its range, with at most one\n                              // path reaching it, is called a shadow zone (14 dB = 5x in pressure)\nconst RECV_FRAC = 0.8;        // the hydrophone sits at 0.8 of the traced range: grid index 384\nconst RIDX0 = Math.round((NR-1)*RECV_FRAC);\nconst DEG = Math.PI/180;\n\n/* ============================================================ helpers */\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst smooth=t=>t*t*t*(t*(t*6-15)+10);\nfunction keyf(pairs,x){\n  if(x<=pairs[0][0])return pairs[0][1];\n  for(let i=1;i<pairs.length;i++){\n    if(x<=pairs[i][0]){\n      const[x0,y0]=pairs[i-1],[x1,y1]=pairs[i];\n      return lerp(y0,y1,(x-x0)/(x1-x0));\n    }\n  }\n  return pairs[pairs.length-1][1];\n}\nconst log10=x=>Math.log(Math.max(x,1e-300))/Math.LN10;\nconst fmt=(v,n)=>Number.isFinite(v)?v.toFixed(n):'—';\n\n/* ============================================================ medium model */\n// The one sound-speed kernel. Every profile in the piece is this function plus, optionally,\n// a hand-dragged offset table — so the rays, the c(z) panel and the readouts can never disagree.\nfunction munk(z, zax, eps){\n  const eta = 2*(z-zax)/B_MUNK;\n  return C_MUNK1*(1 + eps*(eta + Math.exp(-eta) - 1));\n}\nfunction presetC(z){\n  if(S.scen==='arctic')      return ARCTIC_C0 + ARCTIC_G*z;\n  if(S.scen==='surfaceduct'){\n    const m=S.mld;\n    return z<m ? munk(m,S.axisSet,S.eps) - MLD_GRAD*(m-z) : munk(z,S.axisSet,S.eps);\n  }\n  if(S.scen==='doubleduct')\n    return munk(z,S.axisSet,S.eps) - D2_AMP*Math.exp(-Math.pow((z-D2_Z)/D2_W,2));\n  return munk(z,S.axisSet,S.eps);            // deepchannel · shadow\n}\nconst rawC = z => presetC(z) + keyf(S.cp, z);\n\n/* the layered table the ray march actually walks: c is linear inside every layer, so each\n   step is an exact circular arc and the ray invariant is conserved by construction */\nconst LAYC = new Float64Array(NLAY+1);\nfunction buildProfile(){\n  for(let i=0;i<=NLAY;i++) LAYC[i]=rawC(i*DZ_LAYER);\n  let mi=0; for(let i=1;i<=NLAY;i++) if(LAYC[i]<LAYC[mi]) mi=i;\n  S.axisZ=mi*DZ_LAYER; S.axisC=LAYC[mi];\n  S.cMin=LAYC[mi]; S.cMax=LAYC[0];\n  for(let i=0;i<=NLAY;i++) if(LAYC[i]>S.cMax) S.cMax=LAYC[i];\n}\nfunction cAt(z){\n  z=clamp(z,0,D_OCEAN);\n  const f=z/DZ_LAYER; const i=Math.min(Math.floor(f),NLAY-1);\n  return lerp(LAYC[i],LAYC[i+1],f-i);\n}\n\n/* ============================================================ scenarios */\n// SCEN holds only the per-scenario differences: display name, control defaults, framing.\nconst SCEN={\n  deepchannel :{name:'Deep sound channel', d:{src:1300, rcvd:1300, rng:300, fan:12, axis:1300, eps:7.37, rate:2.5}},\n  surfaceduct :{name:'Surface duct',       d:{src:60,   rcvd:60,   rng:120, fan:8,  axis:1300, eps:7.37, rate:2.5, mld:120}},\n  doubleduct  :{name:'Double duct',        d:{src:280,  rcvd:280,  rng:150, fan:9,  axis:1300, eps:7.37, rate:2.5}},\n  arctic      :{name:'Arctic half-channel',d:{src:100,  rcvd:100,  rng:120, fan:10, rate:2.5}},\n  // same ocean as scenario 1 — only the hydrophone moves, up above the fan's upper turning depth\n  shadow      :{name:'Shadow zone',        d:{src:1300, rcvd:300,  rng:200, fan:14, axis:1300, eps:7.37, rate:2.5}},\n};\n\n/* ============================================================ state */\nconst S={\n  scen:'deepchannel', playing:false, t:0, rate:2.5,\n  // controls\n  src:1300, rcvd:1300, rng:300, fan:12, axisSet:1300, eps:0.00737, mld:120,\n  cp:[[0,0],[300,0],[1300,0],[3000,0],[5000,0]],   // hand-dragged c(z) offsets, m/s\n  ov:{rays:true, wf:true, env:true, prof:true},\n  // derived medium\n  axisZ:1300, axisC:C_MUNK1, cMin:C_MUNK1, cMax:C_MUNK1+50,\n  // derived acoustics (rebuilt by retrace / recomputeEig)\n  xMax:375000, ridx:RIDX0, maxDucted:0, drawn:[], eig:[], tl:null,\n  pan:0, span:375000,\n  // transient caches\n  _peak:null, _srcUserMoved:false, _res:null,\n};\n\n/* the traced fan, as flat typed arrays: index i*NR + k */\nconst RX = new Float64Array(NR);            // range grid, m\nconst gZ = new Float32Array(NRAY*NR);       // depth of ray i at range k\nconst gT = new Float32Array(NRAY*NR);       // travel time\nconst gS = new Int16Array(NRAY*NR);         // surface reflections so far\nconst gB = new Int16Array(NRAY*NR);         // bottom reflections so far\nconst gN = new Int16Array(NRAY*NR);         // turning points so far\nconst gA = new Uint8Array(NRAY*NR);         // 1 once the ray has reached this range\n
